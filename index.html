// ENEMIES[].element overrides). Deterministic hash fallback so every foe has an element.
const ENEMY_ELEMENT_HINTS = [
  ['fire',  /flame|fire|ember|phoenix|ash|sun|blaze|crimson|brazier|lava|scorch/i],
  ['water', /water|frost|ice|coral|tide|moon|mist|fen|sea|snow|lake|wave|rain|siren/i],
  ['wood',  /briar|grove|vine|verdant|petal|bloom|leaf|forest|wood|reed|thorn/i],
  ['metal', /iron|steel|blade|sword|saber|dagger|bell|gold|disc|chain|needle|spear|arrow/i],
  ['earth', /stone|rock|mountain|earth|bone|jade|dust|clay|corpse|tomb|cliff|sand|grid/i],
];
function enemyElementFor(enemyId) {
  for (const [el, rx] of ENEMY_ELEMENT_HINTS) if (rx.test(enemyId)) return el;
  return ELEMENTS[Math.abs(hashStr(enemyId)) % ELEMENTS.length];
}

// v0.19 Phase 3: initCombat now accepts a single enemyId OR an array of enemyIds (multi-enemy
// encounter). combat.enemies[] is always the array; combat.enemy is a back-compat pointer to
// the current "primary target" (first alive enemy), kept up to date as enemies fall.
function initCombat(enemyIdOrIds, areaCultMult) {
  const ids = Array.isArray(enemyIdOrIds) ? enemyIdOrIds.slice() : [enemyIdOrIds];
  const enemies = ids.map(buildEnemyCombat).filter(Boolean);
  if (!enemies.length) return;
  const weapon = WEAPONS[state.weapon];
  const school = SCHOOLS[state.selectedSchool];
  const loadout = activeSkillsList(state);  // Wave 1d: combat uses the slotted active set (was school.techniques)
  const mods = computeMods(state);
  const rb = realmBonusFor(state);
  const weaponMult = activeBuffValue('weapon_mult', 1);
  const baseIncoming = activeBuffValue('incoming_mult', 1) * boonIncomingMult() * skillIncomingMultPerm() * (mods.incomingMult || 1);

  const p = {
    name: state.name,
    hpMax: computeMaxHP(state), hp: computeMaxHP(state),
    qiMax: computeMaxQi(state), qi: computeMaxQi(state),
    spiritMax: computeMaxSpirit(state), spirit: computeMaxSpirit(state),
    // v0.64: Dao Heart (will) hardens the stance — posture max scales with it.
    postureMax: 60 + 2 * ((state.finalStats && state.finalStats.will) || 0), posture: 0, broken: 0,
    weaponPower: Math.round((weapon.power + secondaryWeaponPowerBonus(state) + refineWeaponBonus(state) + rb.weapon + mods.weaponBonus + boonWeaponAdd() + skillWeaponAdd()) * weaponMult * (mods.weaponMultFlat || 1)),
    loadout,
    cooldowns: Object.fromEntries(loadout.map(id => [id, 0])),
    buffs: { incomingMult: 1, incomingTurns: 0, nextDamageMult: 1, nextDamageTurns: 0,
             reflectPct: 0, reflectTurns: 0, dodgeChance: 0, dodgeTurns: 0,
             regrowthPct: 0, regrowthTurns: 0,
             critChance: 0, critTurns: 0, postureBoost: 1, postureBoostTurns: 0,
             counterOnDodge: 0, counterTurns: 0 },
    baseIncoming,
    effects: [],
    swordIntent: 0,  // v0.45: Azure Sword ramping passive
    mods,
    elements: playerElements(state),               // Wave 1: five-element counters
    element: (playerElements(state)[0] || null),
  };
  combat = {
    turn: 1,
    // v0.64: cultivator might quietly feeds damage (+might/1000 as a fraction).
    // Cached here — cultivatorMight() runs computeMods and is too heavy per-hit.
    mightDamageBonus: cultivatorMight() / 1000,
    enemyId: enemies[0].id,  // legacy single-enemy ID used by victory-reward / insight scaling
    log: [],
    player: p,
    enemies,
    enemy: enemies[0],  // back-compat primary-target pointer; updated by advancePrimaryTarget()
    over: false,
    victory: null,
    rewards: null,
    areaCultMult: areaCultMult || 1,   // v0.50: the area's cultivation multiplier — a defeat here costs that much more lifespan
  };
  pushLog('turn', `— Turn 1 —`);
  if (enemies.length === 1) {
    pushLog('flavor', ENEMIES[enemies[0].id].intro);
  } else {
    pushLog('flavor', `Multiple opponents step from the brush — ${enemies.map(e => e.name).join(', ')}.`);
  }
  if (weaponMult !== 1) pushLog('flavor', `The tincture burns in your veins. Your weapon hums louder.`);
  if (baseIncoming !== 1) pushLog('flavor', `Cold mist coils about you, blunting the edges of the world.`);
}

// Pick the next alive enemy as the primary target. Called whenever an enemy dies. If none alive,
// combat.enemy ends up null and the victory check fires.
function advancePrimaryTarget() {
  const alive = combat.enemies.filter(e => e.hp > 0);
  combat.enemy = alive[0] || null;
  if (combat.enemy) combat.enemyId = combat.enemy.id;
}

function pushLog(cls, text) { combat.log.push({ cls, text }); }

function dealDamage(target, amount, opts) {
  opts = opts || {};
  let qiDmg = amount;
  let hpDmg = opts.directHP || 0;
  let spiritDmg = opts.directSpirit || 0;

  // v0.45 dodge (Like the Wind / Mistwalk): the player can evade an attack outright.
  if (combat && target === combat.player) {
    const dodge = playerDodgeChance(target);
    if (dodge > 0 && Math.random() < dodge) {
      pushLog('posture', `  → ${target.name} is elsewhere — the blow finds only wind.`);
      // v0.57 Tailwind (cloud_dance rework): dodging grants a free counterattack.
      if (target.buffs && target.buffs.counterTurns > 0 && opts.attacker && opts.attacker.hp > 0) {
        const counterDmg = Math.round(target.weaponPower * (target.buffs.counterOnDodge || 0.75));
        const cres = dealDamage(opts.attacker, counterDmg, {});
        pushLog('line', `  → ${target.name} answers from the wind!`);
        pushLog('hurt', damageLogLine(cres, opts.attacker));
      }
      return { qiAbsorbed: 0, hpDamage: 0, spiritDamage: 0, dodged: true };
    }
  }

  if (target.broken > 0 && !opts.ignorePostureBreak) qiDmg *= 2;
  // v0.45 Sunder: melted armor — bonus damage taken, and flat DR is negated below.
  const sunderEf = (target.effects || []).find(ef => ef.kind === 'sunder');
  if (sunderEf) { qiDmg *= 1 + sunderEf.value; hpDmg *= 1 + sunderEf.value; }
  // v0.45 soul-break: a combatant whose spirit pool is empty takes +30% from everything.
  if (target.spiritMax > 0 && target.spirit <= 0) { qiDmg *= 1.3; hpDmg *= 1.3; }
  let incoming = (target.buffs.incomingMult || 1) * (target.baseIncoming || 1);
  // Player-only heritage mitigations
  if (combat && target === combat.player) {
    const hm = heritageMech();
    if (combat.tribulation && hm.tribulationIncomingMult) incoming *= hm.tribulationIncomingMult;
    if (combat.tribulation) incoming *= boonTribulationIncomingMult();
    // v0.64: Dao Heart (will) steadies the soul under heaven's pressure — -0.5%/point, cap 40%.
    if (combat.tribulation) incoming *= 1 - Math.min(0.40, ((state.finalStats && state.finalStats.will) || 0) * 0.005);
    if (spiritDmg && hm.spiritIncomingMult) spiritDmg *= hm.spiritIncomingMult;
  }
  qiDmg *= incoming;
  hpDmg *= incoming;

  // v0.57 elementWard gear: the player takes less from enemies of a warded element (cap 60%).
  if (combat && target === combat.player && opts.attackerElement) {
    const ward = Math.min(0.60, (combat.player.mods.elementWard || {})[opts.attackerElement] || 0);
    if (ward > 0) { qiDmg *= 1 - ward; hpDmg *= 1 - ward; spiritDmg *= 1 - ward; }
  }

  if (opts.pierceQi) {
    const pierced = qiDmg * opts.pierceQi;
    hpDmg += pierced;
    qiDmg -= pierced;
  }

  // v0.23 flatDR — applied after multipliers, capped at 40% of incoming.
  // Player reads from mods; enemies can carry a target.flatDR (set in initCombat for elites).
  // v0.45: Sundered targets lose their flat DR entirely (the armor has been melted off).
  const targetDR = sunderEf ? 0 : ((combat && target === combat.player)
    ? (combat.player.mods.flatDR || 0)
    : (target.flatDR || 0));
  if (targetDR > 0) {
    const cap = (qiDmg + hpDmg) * 0.4;
    let dr = Math.min(targetDR, cap);
    const qSoak = Math.min(qiDmg, dr);
    qiDmg -= qSoak; dr -= qSoak;
    if (dr > 0) hpDmg = Math.max(0, hpDmg - dr);
  }

  const absorbed = Math.min(target.qi, qiDmg);
  target.qi -= absorbed;
  const overflow = qiDmg - absorbed;
  const totalHp = overflow + hpDmg;
  target.hp -= totalHp;
  target.spirit -= spiritDmg;
  if (target.hp < 0) target.hp = 0;
  if (target.spirit < 0) target.spirit = 0;

  // Track the largest single hit the player has taken this combat — used by the death rule
  // (a finishing blow that took out a big chunk of max HP marks the defeat as reckless).
  if (combat && target === combat.player) {
    target.lastHpHit = totalHp;
    target.biggestHpHit = Math.max(target.biggestHpHit || 0, totalHp);
  }

  return {
    qiAbsorbed: Math.round(absorbed),
    hpDamage: Math.round(totalHp),
    spiritDamage: Math.round(spiritDmg),
  };
}

function applyPosture(target, amount, isBreaker, breakDuration) {
  if (amount <= 0 && !isBreaker) return false;
  // v0.51: Stellar Pressure amps incoming posture damage.
  if (amount > 0 && target.effects) {
    const pr = target.effects.find(ef => ef.kind === 'pressured');
    if (pr) amount = Math.round(amount * (1 + pr.value));
    // v0.68: Sundered stances crumble — +10% posture damage taken per Sunder stack.
    const su = target.effects.find(ef => ef.kind === 'sunder');
    if (su) amount = Math.round(amount * (1 + 0.10 * (su.stacks || 1)));
  }
  target.posture += amount;
  if (isBreaker) target.posture = target.postureMax;  // guaranteed break
  let broke = false;
  if (target.posture >= target.postureMax && target.broken === 0) {
    target.broken = breakDuration != null ? breakDuration : 3;
    target.posture = 0;
    broke = true;
  }
  if (target.posture > target.postureMax) target.posture = target.postureMax;
  return broke;
}

function damageLogLine(res, target) {
  if (res.dodged) return `  → evaded! [${target.name}]`;
  const parts = [];
  if (res.qiAbsorbed) parts.push(`${res.qiAbsorbed} qi shield`);
  if (res.hpDamage)   parts.push(`${res.hpDamage} body`);
  if (res.spiritDamage) parts.push(`${res.spiritDamage} spirit`);
  if (!parts.length) return `  → (no damage)`;
  return `  → ${parts.join(', ')} [${target.name}]`;
}

// v0.45: total dodge chance — school passive (Like the Wind) + active Mistwalk buff. Capped 75%.
function playerDodgeChance(p) {
  let c = schoolKit().dodgeChance || 0;
  if (p.buffs && p.buffs.dodgeTurns > 0) c += p.buffs.dodgeChance || 0;
  c += (p.mods && p.mods.dodgeChance) || 0;  // v0.57: gear/skill dodge channel
  return Math.min(0.75, c);
}

// ============================================================
// Player actions
// ============================================================
// v0.24b: auto-combat helpers. Auto-mode is a strike-only farming tool: damage
// reduced (penalty starts at -30% at Mortal, -5% per realm tier — SS strikes at
// full power), insight reward heavily reduced (auto kills earn 12.5% of the new
// 4x baseline = 0.5x current per-kill), capped at 60 minutes of run-time per IRL
// day. Active combat (no auto used in the fight) earns the full 4x baseline.

// Damage penalty for an auto-driven strike, scaled by player realm tier.
// Mortal -30%, QC -25%, FE -20%, CF -15%, GC -10%, NS -5%, SS 0%.
function autoDamagePenalty(tierIdx) {
  return Math.max(0, 0.30 - (tierIdx || 0) * 0.05);
}

// Auto-mode insight is capped at 12.5% of the new 4x active baseline = 0.5x current.
// Active mode (combat.autoUsed === false at time of kill) earns the full 4x.
function combatInsightMult(combatRef) {
  return (combatRef && combatRef.autoUsed) ? 0.5 : 4.0;
}

// Reset dailyMinutes once 24h have passed. Called from cultivation tick + on render.
function tickAutoCombatReset() {
  if (!state || !state.autoCombat) return;
  const now = Date.now();
  if (now - (state.autoCombat.lastReset || 0) >= 24 * 3600 * 1000) {
    state.autoCombat.dailyMinutes = 0;
    state.autoCombat.lastReset = now;
  }
}

const AUTO_TICK_MS = 1500;
const AUTO_DAILY_CAP_MIN = 60;
let autoCombatTimer = null;

// Drives auto-strikes while combat is open and autoCombat.active. Each fired strike
// counts AUTO_TICK_MS toward dailyMinutes; once we hit AUTO_DAILY_CAP_MIN, auto-mode
// force-disables. Also disables on combat.over so we don't run after victory/defeat.
// v0.55: after an auto-won Venture, loop straight back into the SAME location instead of stranding
// the player on the victory screen. Rewards are already banked (granted at kill time), so we just
// re-roll the encounter. Honors the daily cap and bails (disabling auto) if the location went away
// or locked, so auto can never soft-lock.
function autoReVenture() {
  const locId = combat.ventureLocId;
  tickAutoCombatReset();
  if (state.autoCombat.dailyMinutes >= AUTO_DAILY_CAP_MIN) {
    setAutoCombat(false);
    pushLog('flavor', `(auto-combat budget exhausted for the day)`);
    render();
    return;
  }
  const loc = LOCATIONS.find(l => l.id === locId);
  if (!loc || !locationUnlocked(loc)) { setAutoCombat(false); render(); return; }
  initCombat(rollEncounter(loc), loc.cultivationMult || 1);
  if (combat) combat.ventureLocId = loc.id;
  render();
}

function autoCombatTick() {
  if (!state || !state.autoCombat || !state.autoCombat.active) return;
  if (!combat) return;
  // v0.55: combat already decided — if it was a victorious Venture, loop back into the same place;
  // otherwise idle (a defeat, or a non-Venture fight like Walk a Stretch, just waits for the player).
  if (combat.over) {
    if (combat.victory && combat.ventureLocId != null) autoReVenture();
    return;
  }
  // Survival tribulations don't allow strike — auto skips them silently.
  if (combat.tribulation && combat.tribulation.kind === 'survival') return;
  // Daily cap check.
  tickAutoCombatReset();
  if (state.autoCombat.dailyMinutes >= AUTO_DAILY_CAP_MIN) {
    setAutoCombat(false);
    pushLog('flavor', `(auto-combat budget exhausted for the day)`);
    render();
    return;
  }
  state.autoCombat.dailyMinutes += AUTO_TICK_MS / 60000; // 1.5s -> 0.025 min
  playerStrike({ auto: true });
}

function setAutoCombat(on) {
  state.autoCombat.active = !!on;
  if (autoCombatTimer) { clearInterval(autoCombatTimer); autoCombatTimer = null; }
  if (on) {
    autoCombatTimer = setInterval(autoCombatTick, AUTO_TICK_MS);
  }
  saveChar();
}

// v0.23: applies crit / first-strike / low-HP / vs-kind to outgoing damage.
// Mutates ctx.crit so the log line can mark the hit. Returns scaled damage.
// v0.45: also folds in school-kit hooks — crit bonuses, Mark consumption, Red-Ink
// Authority (+dmg vs debuffed), Hunter's Eye (crits apply Mark), Sword Intent stacks.
function applyPlayerOutgoingMods(p, dmg, target, ctx) {
  const m = p.mods;
  const kit = schoolKit();
  const turn = (combat && combat.turn) || 1;
  if (m.firstStrikeBonus && turn <= 1 && !(ctx && ctx.instant)) dmg *= 1 + m.firstStrikeBonus;
  if (m.lowHpBonus && p.hp > 0 && p.hp / p.hpMax < 0.50) dmg *= 1 + m.lowHpBonus;  // v0.70: bloodied at <50% (was 33%)
  if (target && target.kind && m.vsKindMult && m.vsKindMult[target.kind]) {
    dmg *= 1 + m.vsKindMult[target.kind];
  }
  // Wave 1: Five-Element counter (gentle). Overcoming the foe's element = +20%; being
  // overcome = -15%. Dual roots take the most favorable matchup.
  if (target && target.element && p.elements && p.elements.length) {
    let em = bestElementCounter(p.elements, target.element);
    // v0.57 elementBoost gear/skills: amplify the OVERCOME bonus (never the malus).
    if (em > 1 && m.elementBoostAll) em = 1 + (em - 1) * (1 + m.elementBoostAll);
    if (em !== 1) { dmg *= em; ctx.elementMult = em; }
  }
  // v0.57 elementAmp gear: bonus damage VS enemies of a specific element (counter-gear).
  if (target && target.element && m.elementAmp && m.elementAmp[target.element]) {
    dmg *= 1 + m.elementAmp[target.element];
  }
  // v0.57 ramp channels: crescendo builds (+X%/turn, 9-turn cap) and late-fight spikes.
  if (m.perTurnRamp > 0) dmg *= 1 + m.perTurnRamp * Math.min(9, turn - 1);
  if (m.lateBonus > 0 && turn >= 4) dmg *= 1 + m.lateBonus;
  // v0.64: cultivator might — the whole of your accumulated power leans on every blow.
  if (combat && combat.mightDamageBonus) dmg *= 1 + combat.mightDamageBonus;
  // v0.68: the demonic path hits 20% harder, full stop.
  if (state.demonic) dmg *= 1.2;
  // v0.64: chill now works ON the player too (enemies can inflict it).
  const pChill = (p.effects || []).find(ef => ef.kind === 'chill');
  if (pChill) dmg *= Math.max(0, 1 - pChill.value);
  // v0.45 Sword Intent (Azure): +8% per stack on everything the player swings.
  if (p.swordIntent > 0) dmg *= 1 + 0.08 * p.swordIntent;
  // Star Mark (Starfall): marked targets take bonus damage AND are easier to crit.
  let markCrit = 0;
  if (target && target.effects) {
    const mark = target.effects.find(ef => ef.kind === 'mark');
    if (mark) { dmg *= 1 + mark.value; markCrit = 0.20; }
    // v0.45 Red-Ink Authority (Jade Inkwell): +dmg to anything under one of your writs.
    if (kit.ampVsDebuffed && target.effects.length > 0) dmg *= 1 + kit.ampVsDebuffed;
  }
  // Celestial Sight (Starfall): realm-scaled base crit + a per-hit ramp this battle (+ Star Mark crit).
  // v0.57: + timed crit buffs (Executioner's Calm).
  let critChance = (m.critChance || 0) + markCrit + ((p.buffs && p.buffs.critTurns > 0) ? (p.buffs.critChance || 0) : 0);
  if (kit.celestialSight && combat && dmg > 0) {
    const tierC = (state.realm && state.realm.tierIdx) || 0;
    critChance += (0.15 + 0.05 * tierC) + (0.03 + 0.02 * tierC) * (combat.celestialHits || 0);
    combat.celestialHits = (combat.celestialHits || 0) + 1;
  }
  if (critChance > 0 && Math.random() < critChance) {
    dmg *= (m.critMult || 1.5);
    ctx.crit = true;
  }
  return dmg;
}

// v0.68: the demonic path's universal on-hit — every landed strike or technique brands
// the target with HELLFIRE (stacks to 5; each stack burns 1% of MISSING hp per turn).
function applyDemonicHellfire(tgt) {
  if (!state.demonic || !tgt || tgt.hp <= 0) return;
  applyStatusTo(tgt, 'hellfire', 0, 3, 'Hellfire', playerStackCap('hellfire'));
}

// v0.45: shared on-hit hook for school passives that apply statuses (Everburn, Coated
// Blades, Deep Cold, Moltenwake, Oathbrand). Fires once per technique hit per target.
function applySchoolOnHit(p, tgt) {
  const kit = schoolKit();
  if (!kit.onTechHit || !tgt || tgt.hp <= 0) return;
  const h = kit.onTechHit;
  const dotAmp = DOT_KINDS.has(h.kind) ? ((p.mods && p.mods.dotMult) || 1) : 1;
  const value = h.power ? Math.max(1, Math.round(p.weaponPower * h.power * dotAmp)) : h.value;
  const turns = h.turns + (kit.debuffTurnsBonus || 0);
  applyStatusTo(tgt, h.kind, value, turns, kit.passiveName, playerStackCap(h.kind));
}

// v0.45: per-application value for a technique-carried status. effectPower scales the
// DOT tick off weapon power (so DOTs stay relevant as enemy HP scales by realm);
// resonance scales gently by tier since spirit pools are small.
function playerStatusValue(p, tech) {
  const dotAmp = (p.mods && p.mods.dotMult) || 1;  // v0.57: DOT-amp gear/skills
  if (tech.effectPower) return Math.max(1, Math.round(p.weaponPower * tech.effectPower * dotAmp));
  let v = tech.effectValue || 0;
  if (tech.effect === 'resonance') v = Math.round(v * (1 + (state.realm.tierIdx || 0) * 0.5));
  if (DOT_KINDS.has(tech.effect)) v = Math.max(1, Math.round(v * dotAmp));
  return v;
}
const DOT_KINDS = new Set(['burn', 'poison', 'bleed', 'leech']);

// v0.23: lifesteal + qi-on-hit-style triggers fired after a successful hit.
function applyPostHitTriggers(p, res) {
  if ((p.mods.lifestealPct || 0) > 0 && (res.hpDamage + res.qiAbsorbed) > 0) {
    const heal = Math.round((res.hpDamage + res.qiAbsorbed) * p.mods.lifestealPct);
    if (heal > 0) {
      const before = p.hp;
      p.hp = Math.min(p.hpMax, p.hp + heal);
      if (p.hp > before) pushLog('heal', `  → +${p.hp - before} hp (lifesteal)`);
    }
  }
}

function playerStrike(opts) {
  opts = opts || {};
  if (combat.over) return;
  const p = combat.player, e = combat.enemy;
  // v0.24b: auto-driven strikes apply a tier-scaled damage penalty and taint the
  // fight's insight reward (combat.autoUsed sticks for the rest of the encounter).
  const isAuto = !!opts.auto;
  if (isAuto) combat.autoUsed = true;
  let dmg = p.weaponPower * 1.5 * (p.mods.strikeDamageMult || 1) * boonStrikeMult();
  if (isAuto) dmg *= (1 - autoDamagePenalty(state.realm.tierIdx || 0));
  if (p.buffs.nextDamageTurns > 0) {
    dmg *= p.buffs.nextDamageMult;
    p.buffs.nextDamageTurns = 0;
    p.buffs.nextDamageMult = 1;
    pushLog('posture', `The waiting edge falls.`);
  }
  const ctx = {};
  dmg = applyPlayerOutgoingMods(p, dmg, e, ctx);
  const res = dealDamage(e, dmg, {});
  pushLog('line', ctx.crit
    ? `${p.name} strikes — the blade finds the seam, and the air opens.`
    : (isAuto ? `${p.name} strikes — a measured, half-mindful blow.`
              : `${p.name} strikes — a clean, disciplined blow.`));
  pushLog('hurt', damageLogLine(res, e));
  applyPostHitTriggers(p, res);
  if (!res.dodged) {
    applyDemonicHellfire(e);   // v0.68: demonic hellfire brands every landed blow
    // v0.68: schools with strikeAppliesOnHit (Dragonforge's Moltenwake) sunder on STRIKES too.
    if (schoolKit().strikeAppliesOnHit) applySchoolOnHit(p, e);
  }
  const hmStrike = heritageMech();
  const postureAmt = Math.round(10 * p.mods.postureMult * (hmStrike.postureDamageMult || 1) * ((p.buffs.postureBoostTurns > 0) ? (p.buffs.postureBoost || 1) : 1));
  const broke = applyPosture(e, postureAmt, false, 3 + p.mods.postureBreakBonus);
  if (broke) pushLog('posture', `${e.name}'s stance shatters! Qi damage doubled for ${e.broken} turns.`);
  if (p.mods.strikeHeal > 0 && res.qiAbsorbed + res.hpDamage > 0) {
    const before = p.hp;
    p.hp = Math.min(p.hpMax, p.hp + p.mods.strikeHeal);
    if (p.hp > before) pushLog('heal', `  → +${p.hp - before} hp (Bloodbond)`);
  }
  endPlayerAction();
}

// v0.65: sect arts (tech.sect) count as techniques of YOUR school — school damage/qi
// bonuses from heritage, gear and kits apply to them.
function techSchoolOf(tech) { return tech.sect ? state.selectedSchool : tech.school; }
function effectiveQiCost(p, tech) {
  let cost = tech.qi;
  const schoolMult = p.mods.schoolQiMult[techSchoolOf(tech)];
  if (schoolMult) cost *= schoolMult;
  const hm = heritageMech();
  const sQi = techSchoolOf(tech);
  if (hm.schoolQiDiscount && hm.schoolQiDiscount[sQi]) cost *= hm.schoolQiDiscount[sQi];
  if (hm.schoolQiPenalty && hm.schoolQiPenalty[sQi]) cost *= hm.schoolQiPenalty[sQi];
  cost *= boonQiCostMult();
  const qiUp = p.effects.find(ef => ef.kind === 'qi_cost_up');
  if (qiUp) cost *= qiUp.value;
  return Math.ceil(cost);
}
function effectiveHpCost(p, tech) {
  if (!tech.hpCost) return 0;
  return Math.ceil(tech.hpCost * p.mods.hpCostMult);
}

function playerTechnique(techId) {
  if (combat.over) return;
  const p = combat.player, e = combat.enemy;
  const tech = TECHNIQUES[techId];
  if (p.cooldowns[techId] > 0) return;
  const qiCost = effectiveQiCost(p, tech);
  const hpCost = effectiveHpCost(p, tech);
  if (p.qi < qiCost) return;
  if (hpCost && p.hp <= hpCost) return;

  p.qi -= qiCost;
  if (hpCost) p.hp -= hpCost;
  p.cooldowns[techId] = tech.cd + 1;

  let dmg = p.weaponPower * (tech.damage || 0) * (p.mods.techDamageMult || 1);
  const hm0 = heritageMech();
  const sDmg = techSchoolOf(tech);
  if (hm0.schoolDamageMult && hm0.schoolDamageMult[sDmg]) dmg *= hm0.schoolDamageMult[sDmg];
  if (p.mods.schoolDamageMult && p.mods.schoolDamageMult[sDmg]) dmg *= p.mods.schoolDamageMult[sDmg];
  if (hm0.rivalDamageMult && combat.enemyId && RIVAL_ENEMY_IDS.has(combat.enemyId)) dmg *= hm0.rivalDamageMult;
  if (p.buffs.nextDamageTurns > 0 && dmg > 0) {
    dmg *= p.buffs.nextDamageMult;
    p.buffs.nextDamageTurns = 0;
    p.buffs.nextDamageMult = 1;
    pushLog('posture', `The waiting edge joins the blow.`);
  }
  // v0.51: per-battle damage falloff (Pierce the Sky weakens 10% per use this fight).
  if (tech.damageFalloffPct) {
    combat.techUses = combat.techUses || {};
    const fUses = combat.techUses[techId] || 0;
    dmg *= Math.max(0.1, 1 - tech.damageFalloffPct * fUses);
    combat.techUses[techId] = fUses + 1;
  }

  // v0.19 Phase 3: AOE techs hit every alive enemy at 70% per-target damage.
  // Single-target techs (default) hit primary target only at full damage.
  const isAoe = tech.target === 'aoe';
  const targets = isAoe ? combat.enemies.filter(en => en.hp > 0) : [e];
  const targetDmgMult = isAoe ? 0.7 : 1.0;

  if (isAoe && targets.length > 1) {
    pushLog('line', `${p.name} unleashes ${tech.name} — the strike spreads across every standing opponent.`);
  } else {
    pushLog('line', tech.logHit(p.name, e.name));
  }

  let pierce = tech.pierceQi || 0;
  if (hm0.schoolPierceBonus && hm0.schoolPierceBonus[sDmg]) pierce = Math.min(1, pierce + hm0.schoolPierceBonus[sDmg]);
  const directSpiritAmt = (tech.directSpirit || 0) * (p.mods.spiritDamageMult || 1);
  const postureBoostMult = (p.buffs && p.buffs.postureBoostTurns > 0) ? (p.buffs.postureBoost || 1) : 1;  // v0.57 Stormcall
  const postureAmtBase = Math.round((tech.postureBuild || 0) * p.mods.postureMult * (hm0.postureDamageMult || 1) * postureBoostMult);

  const kit = schoolKit();
  // v0.51: instance count. tech.hits (e.g. Starfall Volley) = N full instances per target; Celestial
  // Sight splits ANY single-target strike (v0.54: not just Star Arrow) into two half-instances on the
  // Nth strike this battle. Gate is structural now (!isAoe && damage>0) — every single-target attack counts.
  let instances = tech.hits || 1;
  let perInstanceMult = 1;
  if (kit.celestialSight && !isAoe && (tech.damage || 0) > 0) {
    combat.celestialStrikes = (combat.celestialStrikes || 0) + 1;
    const sTier = (state.realm && state.realm.tierIdx) || 0;
    const splitN = sTier >= 5 ? 1 : sTier >= 4 ? 2 : 3;
    if (combat.celestialStrikes % splitN === 0) { instances = 2; perInstanceMult = 0.5; pushLog('posture', `  → Celestial Sight: the strike splits in two!`); }
  }
  targets.forEach(tgt => {
    // v0.57 Quench-style payoffs: consume a status on the target for bonus damage.
    let consumeMult = 1;
    if (tech.consumeBonus && tgt.effects) {
      const cIdx = tgt.effects.findIndex(ef => ef.kind === tech.consumeBonus.kind);
      if (cIdx >= 0) {
        const stacks = tgt.effects[cIdx].stacks || 1;
        consumeMult = 1 + tech.consumeBonus.perStack * stacks;
        tgt.effects.splice(cIdx, 1);
        pushLog('posture', `  → ${tgt.name}'s ${STATUS_INFO[tech.consumeBonus.kind] ? STATUS_INFO[tech.consumeBonus.kind].label : tech.consumeBonus.kind} ×${stacks} is consumed — +${Math.round((consumeMult - 1) * 100)}% damage!`);
      }
    }
    for (let h = 0; h < instances; h++) {
      if (tgt.hp <= 0) break;
      let tdmg = dmg * targetDmgMult * perInstanceMult * consumeMult;
      const ctx = { instant: tech.instant };
      tdmg = applyPlayerOutgoingMods(p, tdmg, tgt, ctx);
      if (tdmg > 0 || (h === 0 && (tech.directHP || tech.directSpirit))) {
        const res = dealDamage(tgt, tdmg, {
          directHP: h === 0 ? (tech.directHP || 0) : 0,
          directSpirit: h === 0 ? directSpiritAmt : 0,
          pierceQi: pierce,
        });
        if (ctx.crit) pushLog('posture', `  → critical strike!`);
        pushLog('hurt', damageLogLine(res, tgt));
        applyPostHitTriggers(p, res);
        // v0.45: school passive on-hit statuses ride along on every damaging hit.
        if (!res.dodged) { applySchoolOnHit(p, tgt); applyDemonicHellfire(tgt); }
      }
    }
    // v0.57 Ashfall Detonation: blow up an existing DOT on the target for its remaining
    // damage at a multiplier (consumes the status; lands as direct HP like the DOT would).
    if (tech.detonate && tgt.hp > 0 && tgt.effects) {
      const dIdx = tgt.effects.findIndex(ef => ef.kind === tech.detonate.kind);
      if (dIdx >= 0) {
        const ef = tgt.effects[dIdx];
        const burst = Math.max(1, Math.round(ef.value * ef.turns * tech.detonate.mult));
        tgt.effects.splice(dIdx, 1);
        const dres = dealDamage(tgt, 0, { directHP: burst });
        pushLog('posture', `  → the ${STATUS_INFO[tech.detonate.kind] ? STATUS_INFO[tech.detonate.kind].label : tech.detonate.kind} detonates!`);
        pushLog('hurt', damageLogLine(dres, tgt));
      }
    }
    if (postureAmtBase || tech.postureBreak) {
      const broke = applyPosture(tgt, postureAmtBase, tech.postureBreak, 3 + p.mods.postureBreakBonus);
      if (broke) {
        pushLog('posture', `${tgt.name}'s stance shatters! Qi damage doubled for ${tgt.broken} turns.`);
        // v0.45 Aftershock (Thunder Hammer): breaks also stun.
        if (kit.shockOnBreak && applyStatusTo(tgt, 'shock', 0, 1, kit.passiveName)) {
          pushLog('posture', `  → ${tgt.name} is shocked — it cannot act next turn!`);
        }
      }
    }
    // v0.45: technique-carried statuses route through applyStatusTo (stacking semantics,
    // weapon-power-scaled DOT values, Lingering Glyphs duration bonus, effectChance rolls).
    if (tech.effect) {
      if (!(tech.effectChance && Math.random() >= tech.effectChance)) {
        const value = playerStatusValue(p, tech);
        const turns = tech.effectTurns + (kit.debuffTurnsBonus || 0);
        const n = tech.effectStacks || 1;
        let applied = false;
        for (let i = 0; i < n; i++) applied = applyStatusTo(tgt, tech.effect, value, turns, tech.name, playerStackCap(tech.effect)) || applied;
        if (applied && STATUS_INFO[tech.effect]) {
          pushLog('flavor', `  → ${tgt.name}: ${STATUS_INFO[tech.effect].label}${n > 1 ? ` ×${n}` : ''}.`);
        }
      }
    }
    // v0.51: multi-status techniques (e.g. Stellar Pressure applies pressured + qi_cost_up).
    if (tech.statusList) {
      tech.statusList.forEach(s => {
        if (applyStatusTo(tgt, s.kind, s.value, s.turns + (kit.debuffTurnsBonus || 0), tech.name) && STATUS_INFO[s.kind]) {
          pushLog('flavor', `  → ${tgt.name}: ${STATUS_INFO[s.kind].label}.`);
        }
      });
    }
  });

  // v0.57 Call the Debt (chain_saint): immediately collect oathbound backlash from
  // every bound enemy at a multiplier (the oath itself stays in force).
  if (tech.triggerBacklash) {
    let collected = 0;
    combat.enemies.forEach(en => {
      if (en.hp <= 0 || !en.effects) return;
      const oath = en.effects.find(ef => ef.kind === 'oathbound');
      if (!oath) return;
      const amt = Math.max(1, Math.round(oath.value * tech.triggerBacklash.mult));
      en.hp = Math.max(0, en.hp - amt);
      collected++;
      pushLog('hurt', `  → ${en.name} pays ${amt} — the debt is called.`);
    });
    if (!collected) pushLog('flavor', `  → no oaths to collect; the chain rings empty.`);
  }
  // v0.57 Listening Dao (azure): direct Sword Intent gain + qi restoration.
  if (tech.intentGain) {
    const before = p.swordIntent || 0;
    const capA = schoolKit().intentCap || 5;
    p.swordIntent = Math.min(capA, before + tech.intentGain);
    if (p.swordIntent > before) pushLog('posture', `  → Sword Intent ${p.swordIntent}/${capA} (+${Math.round(p.swordIntent * 8)}% damage).`);
  }
  if (tech.qiRestore) {
    const before = p.qi;
    p.qi = Math.min(p.qiMax, p.qi + tech.qiRestore);
    if (p.qi > before) pushLog('heal', `  → +${p.qi - before} qi.`);
  }

  // v0.45 Sword Intent (Azure): single-target technique hits build the edge.
  if (kit.intentPerHit && !isAoe && dmg > 0) {
    const gain = (tech.intentStacks || kit.intentPerHit);
    const before = p.swordIntent || 0;
    const capB = kit.intentCap || 5;
    p.swordIntent = Math.min(capB, before + gain);
    if (p.swordIntent > before) pushLog('posture', `  → Sword Intent ${p.swordIntent}/${capB} (+${Math.round(p.swordIntent*8)}% damage).`);
  }

  if (tech.buff) {
    if (tech.buff.nextDamageMult) {
      p.buffs.nextDamageMult = tech.buff.nextDamageMult;
      p.buffs.nextDamageTurns = tech.buff.turns || 1;
    }
    if (tech.buff.incomingMult != null) {
      p.buffs.incomingMult = tech.buff.incomingMult;
      p.buffs.incomingTurns = tech.buff.turns || 1;
    }
    // v0.45: new self-buff channels — reflect (Avalanche Guard) and dodge (Mistwalk).
    if (tech.buff.reflectPct) {
      p.buffs.reflectPct = tech.buff.reflectPct;
      p.buffs.reflectTurns = tech.buff.turns || 1;
    }
    if (tech.buff.dodgeChance) {
      p.buffs.dodgeChance = tech.buff.dodgeChance;
      p.buffs.dodgeTurns = tech.buff.turns || 1;
    }
    // v0.57 stance-rework buffs: timed crit (Executioner's Calm), posture boost
    // (Stormcall), counterattack-on-dodge (Tailwind).
    if (tech.buff.critChance) {
      p.buffs.critChance = tech.buff.critChance;
      p.buffs.critTurns = tech.buff.turns || 1;
    }
    if (tech.buff.postureBoost) {
      p.buffs.postureBoost = tech.buff.postureBoost;
      p.buffs.postureBoostTurns = tech.buff.turns || 1;
    }
    if (tech.buff.counterOnDodge) {
      p.buffs.counterOnDodge = tech.buff.counterOnDodge;
      p.buffs.counterTurns = tech.buff.turns || 1;
    }
  }
  // v0.45: Verdant Communion-style regrowth (heal-over-time on self).
  if (tech.selfBuff && tech.selfBuff.regrowthPct) {
    p.buffs.regrowthPct = tech.selfBuff.regrowthPct;
    p.buffs.regrowthTurns = tech.selfBuff.turns || 1;
    pushLog('heal', `  → Regrowth: +${Math.round(tech.selfBuff.regrowthPct*100)}% max HP per turn for ${p.buffs.regrowthTurns} turns.`);
  }

  if (tech.instant) render(); else endPlayerAction();   // v0.51: free-action techniques don't take the turn
}

function playerMeditate() {
  if (combat.over) return;
  const p = combat.player;
  // v0.64: entangled players cannot gather qi (the Tide-Queen's trick, among others).
  if ((p.effects || []).some(ef => ef.kind === 'entangle')) {
    pushLog('line', `${p.name} reaches for heaven-qi — the entangling bonds drink everything drawn.`);
    endPlayerAction();
    return;
  }
  const hm = heritageMech();
  const schoolMed = (hm.schoolMeditateMult && hm.schoolMeditateMult[state.selectedSchool]) || 1;
  const regen = Math.ceil(p.qiMax * 0.5 * p.mods.meditateMult * schoolMed);
  const before = p.qi;
  p.qi = Math.min(p.qiMax, p.qi + regen);
  p.buffs.incomingMult = 1.6;
  p.buffs.incomingTurns = 1;
  pushLog('line', `${p.name} folds inward, drawing heaven-qi through open meridians.`);
  pushLog('heal', `  → +${p.qi - before} qi (vulnerable until next turn)`);
  // v0.45 Sword Intent: meditating sheathes the blade — the edge is lost.
  if (p.swordIntent > 0) {
    pushLog('flavor', `  → The gathered Sword Intent disperses with the breath.`);
    p.swordIntent = 0;
  }
  endPlayerAction();
}

// ============================================================
// Turn flow
// ============================================================
function endPlayerAction() {
  if (checkDeath()) return;
  enemyTurn();
  if (checkDeath()) return;
  endOfRound();
  if (checkDeath()) return;
  render();
}

// Per-enemy loot + insight grant. Called once per enemy as they fall. Accumulates into
// combat.rewards (multi-enemy aware: arrays of drops, summed insight + materials).
function grantEnemyDefeatRewards(e) {
  const enemyData = ENEMIES[e.id];
  const hmVictory = heritageMech();
  const rewardScale = (e.scale && e.scale.reward) || 1;
  const insight = Math.round(enemyData.insightReward * rewardScale * boonInsightMult() * skillCombatInsightMult() * (combat.player.mods.insightMult || 1) * ((SCHOOLS[state.selectedSchool] && SCHOOLS[state.selectedSchool].insightFromKillsMult) || 1) * (hmVictory.combatInsightMult || 1) * combatInsightMult(combat) * metaInsightMult() * (state.demonic ? 1.5 : 1));
  addInsight(insight);
  state.sectKills = (state.sectKills || 0) + 1;  // Wave 2b: progress toward the sect hunt bounty
  // v0.58: boss kill tracking + first-kill material cache.
  if (enemyData.isBoss) {
    if (!state.bossKills) state.bossKills = {};
    state.bossKills[e.id] = (state.bossKills[e.id] || 0) + 1;
    // v0.77: the cooldown starts when the boss FALLS — defeats allow instant retries.
    if (!state.bossCooldowns) state.bossCooldowns = {};
    state.bossCooldowns[e.id] = Date.now();
    // v0.60: the sect honors boss kills — automatic contribution bounty.
    const bossBounty = 30 + 30 * ((BOSSES[e.id] && BOSSES[e.id].tier) || 0);
    grantContribution(bossBounty);
    pushLog('reward', `The sect honors the kill: +${bossBounty} contribution.`);
    // v0.62: a boss kill carries a great flash of comprehension —
    // rand(500..1000) x 3 x (1 + boss realm tiers above Mortal).
    const bossTierIns = (BOSSES[e.id] && BOSSES[e.id].tier) || 0;
    const bossInsight = Math.round((500 + Math.random() * 500) * 3 * (1 + bossTierIns));
    addInsight(bossInsight);
    pushLog('reward', `The fall of something this old teaches: +${bossInsight.toLocaleString()} insight.`);
    const meta = BOSSES[e.id];
    if (meta && meta.firstKill && state.bossKills[e.id] === 1) {
      Object.entries(meta.firstKill).forEach(([mid, n]) => {
        state.base.materials[mid] = (state.base.materials[mid] || 0) + n;
      });
      const parts = Object.entries(meta.firstKill).map(([mid, n]) => `${n}× ${(MATERIALS[mid] && MATERIALS[mid].name) || mid}`).join(', ');
      pushLog('reward', `First kill! The fall of ${enemyData.name} yields: ${parts}.`);
    }
  }
  const drop = rollInscriptionDrop();
  if (drop) state.inscriptions.owned.push(drop);
  const armorDrop = rollArmorDrop(enemyData);
  if (armorDrop) state.armor.owned.push(armorDrop);
  const artifactDrop = rollArtifactDrop(enemyData);
  if (artifactDrop) state.artifacts.owned.push(artifactDrop);
  let weaponDrop = null;
  // v0.24a: drop logic split. Elites use the existing per-enemy named drop table.
  // Non-elites get junk most of the time — their named drop is "replaced" 80% of
  // the time with a tier-appropriate junk roll. Net effect: most drops are scrap
  // sellable to the caravan, occasional named slip-throughs, bosses still feel
  // worth re-fighting because their named drops aren't filtered.
  const isEliteKill = enemyData.archetype === 'elite';
  (enemyData.drops || []).forEach(d => {
    if (!weaponDrop && Math.random() < d.chance) {
      if (!isEliteKill && Math.random() < 0.80) {
        const junk = rollJunkWeaponForTier(state.realm.tierIdx || 0);
        if (junk) { weaponDrop = junk; state.weapons.owned.push(junk); }
      } else {
        weaponDrop = d.id;
        state.weapons.owned.push(d.id);
      }
    }
  });
  // Standalone junk-drop roll for non-elites that have no named drop entry, OR whose
  // named drops failed their per-entry chance roll. Keeps mooks dropping *something*
  // sometimes — gives the early game a steady trickle of sell-fodder.
  if (!weaponDrop && !isEliteKill && Math.random() < 0.18) {
    const junk = rollJunkWeaponForTier(state.realm.tierIdx || 0);
    if (junk) { weaponDrop = junk; state.weapons.owned.push(junk); }
  }
  const materialDrops = {};
  (enemyData.materialDrops || []).forEach(d => {
    if (Math.random() < d.chance) {
      const [lo, hi] = d.count;
      const n = lo + Math.floor(Math.random() * (hi - lo + 1));
      state.base.materials[d.id] = (state.base.materials[d.id] || 0) + n;
      materialDrops[d.id] = (materialDrops[d.id] || 0) + n;
    }
  });
  // v0.21: spirit stones drop on every kill, alongside insight. sqrt scaling so weak mooks give 1,
  // mid-tier give a handful, bosses give meaningfully more without flooding the economy. Funnels
  // into the same materialDrops dict so it appears in the combat log + post-combat panel.
  const stoneAmount = Math.max(1, Math.floor(Math.sqrt(enemyData.insightReward || 1) * rewardScale * 0.5));
  state.base.materials.spirit_stone = (state.base.materials.spirit_stone || 0) + stoneAmount;
  materialDrops.spirit_stone = (materialDrops.spirit_stone || 0) + stoneAmount;
  const bookChance = enemyData.bookDropChance != null ? enemyData.bookDropChance : 0.08;
  const bookDrop = rollBookDrop(bookChance);
  if (bookDrop) state.foundBooks.push(bookDrop);

  // v0.23: qi-on-kill from weapons/artifacts.
  const qiOnKill = (combat.player && combat.player.mods.qiOnKill) || 0;
  if (qiOnKill > 0) {
    const before = combat.player.qi;
    combat.player.qi = Math.min(combat.player.qiMax, combat.player.qi + qiOnKill);
    const gained = combat.player.qi - before;
    if (gained > 0) pushLog('heal', `  → +${gained} qi (kill surge)`);
  }

  pushLog('victory', `${e.name} falls.`);
  pushLog('flavor', enemyData.victoryText);
  pushLog('reward', `+${insight} insight gained.`);
  if (drop) { const ins = INSCRIPTIONS[drop]; pushLog('reward', `Inscription found: ${ins.name} — ${ins.desc}`); }
  if (weaponDrop) { const w = WEAPONS[weaponDrop]; pushLog('reward', `Weapon claimed: ${w.name} (power ${w.power}, ${w.slots} slots).`); }
  if (armorDrop) { const ar = ARMOR[armorDrop]; pushLog('reward', `Armor found: ${ar.name} (${ar.rarity}, ${ARMOR_SLOT_LABELS[ar.slot] || ar.slot}).`); }
  if (artifactDrop) { const af = ARTIFACTS[artifactDrop]; pushLog('reward', `Artifact recovered: ${af.name} — ${af.desc}`); }
  const matStr = Object.entries(materialDrops).map(([id, n]) => `${n}× ${MATERIALS[id].name}`).join(', ');
  if (matStr) pushLog('reward', `Materials gathered: ${matStr}.`);
  if (bookDrop) { const bk = SKILL_BOOKS[bookDrop]; pushLog('reward', `A skill book tumbles loose: ${bk.name} (${bk.rarity}).`); }

  combat.rewards = combat.rewards || { insight: 0, drops: [], weaponDrops: [], bookDrops: [], armorDrops: [], artifactDrops: [], materialDrops: {} };
  combat.rewards.insight += insight;
  if (drop) combat.rewards.drops.push(drop);
  if (weaponDrop) combat.rewards.weaponDrops.push(weaponDrop);
  if (bookDrop) combat.rewards.bookDrops.push(bookDrop);
  if (armorDrop) combat.rewards.armorDrops.push(armorDrop);
  if (artifactDrop) combat.rewards.artifactDrops.push(artifactDrop);
  Object.entries(materialDrops).forEach(([id, n]) => {
    combat.rewards.materialDrops[id] = (combat.rewards.materialDrops[id] || 0) + n;
  });
}

function checkDeath() {
  const p = combat.player;
  // Check each enemy for newly-defeated state. Per-enemy rewards on each fall.
  combat.enemies.forEach(e => {
    if (e.hp <= 0 && !e.defeated) {
      e.defeated = true;
      grantEnemyDefeatRewards(e);
    }
  });
  // If primary target fell, advance to next alive enemy.
  if (combat.enemy && combat.enemy.hp <= 0) advancePrimaryTarget();
  // Final victory only when no alive enemies remain.
  const anyAlive = combat.enemies.some(e => e.hp > 0);
  if (!anyAlive && !combat.over) {
    combat.over = true;
    combat.victory = true;

    // Tribulation victory: advance realm, skip extra insight reward (already granted per-enemy).
    if (combat.tribulation && pendingTribulation) {
      state.realm.insight -= pendingTribulation.cost;
      state.realm.tierIdx = pendingTribulation.targetTier;
      state.realm.layer = 1;
      state.realmDefeats = 0;  // v0.25: breakthrough resets defeat counter
      state.bodyQuench = (state.bodyQuench || 0) + 1;  // Wave 3c: surviving the tribulation tempers the body
      pushLog('reward', `Realm breakthrough: ${REALMS[state.realm.tierIdx].name}! The tribulation's fire tempers your body — now +${bodyQuenchHPAdd()} max HP for life.`);
      if (state.tribulationFails && state.tribulationFails[combat.enemyId]) {
        state.tribulationFails[combat.enemyId] = 0;
      }
      pendingTribulation = null;
      if (state.confirmed) state.finalStats = finalStats(state);
    }

    // v0.71: a stage of the Conquest of Heaven falls.
    if (combat.heavenConquest) {
      state.heavenConquest = (state.heavenConquest || 0) + 1;
      combat.heavenConquest = null;
      if (state.heavenConquest >= 3) {
        pushLog('reward', 'THE GATE IS TAKEN. Heaven lies open before you — ascend when you are ready.');
      } else {
        pushLog('reward', `The ${state.heavenConquest === 1 ? 'first' : 'second'} of the Risen falls. ${3 - state.heavenConquest} still bar the gate.`);
      }
    }
    // v0.65: promotion duel won — the rank is claimed.
    if (combat.sectDuel != null) {
      state.sectRank = combat.sectDuel;
      pushLog('reward', `Promotion! You now stand as ${SECT_RANKS[state.sectRank].name} of the sect (+${state.sectRank * 5}% cultivation).`);
      combat.sectDuel = null;
    }

    const hmVictory = heritageMech();
    if (hmVictory.postCombatHeal) {
      combat.player.hp = combat.player.hpMax;
      combat.player.qi = combat.player.qiMax;
      combat.player.spirit = combat.player.spiritMax;
      pushLog('heal', `  → World-Tree Scion: body and qi restored.`);
    }
    saveChar();
    render();
    return true;
  }
  if (p.hp <= 0 && !combat.over) {
    combat.over = true;
    combat.victory = false;
    const enemyData = ENEMIES[combat.enemyId];
    pushLog('defeat', `${p.name} collapses.`);
    pushLog('flavor', enemyData.defeatText);
    if (combat.tribulation && pendingTribulation) {
      handleTribulationFailure(combat.enemyId, p.name, enemyData);
      return true;
    }
    // v0.50: a (non-tribulation) defeat exacts a lifespan toll.
    const lifeLoss = combatDefeatLifespanCost(combat.areaCultMult || 1) * (combat.bossFight ? 2 : 1) * lifespanConsumptionMult();  // v0.58 boss double; v0.77 body-inscription surcharge
    if (lifeLoss > 0) {
      state.age = (state.age || 16) + lifeLoss;
      const shown = lifeLoss >= 10 ? Math.round(lifeLoss) : lifeLoss.toFixed(1);
      pushLog('defeat', `The dao exacts its toll: ${shown} ${lifeLoss < 1.5 ? 'year' : 'years'} of lifespan lost.`);
    }
    // Non-tribulation defeats: small base death chance, raised by reckless conditions.
    const death = rollCombatDeath(combat, p);
    if (death.died) {
      pushLog('defeat', `The wound runs deeper than the body. ${p.name} does not rise.`);
      const cause = `Slain by ${enemyData.name} (${death.reasons.join(', ') || 'a careless step'})`;
      const prose = `In the long ledger of the dao, the strike that ended ${p.name} was no different from a thousand others — only the body it found could not stand back up.`;
      saveChar(); // persist the over-state briefly so the log is visible if user quickly inspects
      setTimeout(() => dieRun(cause, prose, p.name), 0);
    }
    render();
    return true;
  }
  return false;
}

// Combat death rule: defeats are usually unconscious-and-retry, but reckless conditions (huge
// finishing blow, qi shield depleted, fast wipe, late realm) can stack a chance to permakill.
// Tribulation defeats use the streak counter instead — handled separately.
// v0.25: defeat counter ramps perma-death chance per realm.
// First 5 defeats this realm are free (0% chance). Each defeat thereafter adds 2.5%.
// Counter increments on EVERY defeat (whether the roll killed or not) and resets
// on realm breakthrough. Tribulations are handled separately (3-strike rule).
// v0.50: lifespan toll on a defeat — random 1-15 years × the area's cultivation multiplier,
// capped at 20 × realms ascended above Mortal (tierIdx). Mortals (tier 0) lose nothing.
function combatDefeatLifespanCost(areaCultMult) {
  const tier = (state.realm && state.realm.tierIdx) || 0;
  const cap = 20 * tier;
  if (cap <= 0) return 0;
  const base = 1 + Math.random() * 14;            // 1..15 years
  return Math.min(cap, base * (areaCultMult || 1));
}
function rollCombatDeath(combat, p) {
  state.realmDefeats = (state.realmDefeats || 0) + 1;
  const defeats = state.realmDefeats;
  const chance = Math.max(0, (defeats - 5) * 0.025);
  const died = Math.random() < chance;
  return {
    died, chance,
    reasons: died ? [`${defeats} defeats this realm — the dao thins, and the body remembers each loss`] : [],
    defeats,
  };
}

// Tribulation streak: each tribulation tracks consecutive failures by enemyId. 3 in a row kills.
// Resets on success or on attempting a different tribulation.
function handleTribulationFailure(enemyId, charName, enemyData) {
  if (!state.tribulationFails) state.tribulationFails = {};
  state.tribulationFails[enemyId] = (state.tribulationFails[enemyId] || 0) + 1;
  // Reset other tribulations' streaks — only one trib can be currently in-streak.
  Object.keys(state.tribulationFails).forEach(k => { if (k !== enemyId) state.tribulationFails[k] = 0; });
  pendingTribulation = null;
  const fails = state.tribulationFails[enemyId];
  if (fails >= 3) {
    pushLog('defeat', `Three times the heavens tested you. Three times you fell. The dao closes.`);
    saveChar();
    const cause = `Consumed by ${enemyData.name} (third failed tribulation)`;
    const prose = `Some doors do not open on the third knock. ${charName}'s name is unstitched from the realm-list, and the next breath belongs to no one.`;
    setTimeout(() => dieRun(cause, prose, charName), 0);
  } else {
    pushLog('defeat', `Tribulation failure ${fails}/3. The next attempt will be the last.`);
    saveChar();
  }
  render();
}

// v0.19 Phase 3: every alive enemy in combat.enemies takes a turn (in their array order).
// Effects tick per-enemy. AI runs from ENEMIES[e.id].ai. Defeated enemies are skipped.
// Stops early if checkDeath fires combat.over (e.g. player died from a bleed at start).
// v0.45: shared status ticker for both sides. Handles every DOT/drain kind; fixes the
// latent bug where enemy-side bleed (Azure-Thread Severing) never actually ticked.
// opts.healTarget receives the HP drained by leech ticks.
function tickCombatantEffects(c, opts) {
  opts = opts || {};
  c.effects = c.effects.filter(ef => {
    if (ef.kind === 'qi_drain' || ef.kind === 'entangle') {
      const before = c.qi;
      c.qi = Math.max(0, c.qi - ef.value);
      if (before > c.qi) pushLog('hurt', `  → ${c.name} bleeds ${before - c.qi} qi to ${ef.name}.`);
    }
    if (ef.kind === 'burn' || ef.kind === 'poison' || ef.kind === 'bleed' || ef.kind === 'leech') {
      const before = c.hp;
      c.hp = Math.max(0, c.hp - ef.value);
      const lost = before - c.hp;
      if (lost > 0) {
        const label = (STATUS_INFO[ef.kind] && STATUS_INFO[ef.kind].label) || ef.kind;
        pushLog('hurt', `  → ${c.name} loses ${lost} hp to ${ef.name} (${label}${ef.stacks > 1 ? ` ×${ef.stacks}` : ''}).`);
        if (combat && c === combat.player) c.lastHpHit = Math.max(c.lastHpHit || 0, lost);
        if (ef.kind === 'leech' && opts.healTarget && opts.healTarget.hp > 0) {
          const ht = opts.healTarget;
          const beforeHeal = ht.hp;
          ht.hp = Math.min(ht.hpMax, ht.hp + lost);
          if (ht.hp > beforeHeal) pushLog('heal', `  → +${ht.hp - beforeHeal} hp drained through ${ef.name}.`);
        }
      }
    }
    // v0.68 demonic hellfire: per-turn damage = stacks x 1% of MISSING health — an
    // execute that accelerates as the wound deepens. Computed at tick time (dynamic).
    if (ef.kind === 'hellfire') {
      const missing = Math.max(0, (c.hpMax || 0) - c.hp);
      const burn = Math.max(1, Math.round(missing * 0.01 * (ef.stacks || 1)));
      if (c.hp > 0 && missing > 0) {
        c.hp = Math.max(0, c.hp - burn);
        pushLog('hurt', `  → ${c.name} loses ${burn} hp to hellfire (x${ef.stacks || 1}).`);
        if (combat && c === combat.player) c.lastHpHit = Math.max(c.lastHpHit || 0, burn);
      }
    }
    if (ef.kind === 'resonance') {
      const before = c.spirit;
      c.spirit = Math.max(0, c.spirit - ef.value);
      if (before > c.spirit) {
        pushLog('hurt', `  → ${c.name}'s spirit frays by ${before - c.spirit} (${ef.name}).`);
        if (c.spirit <= 0 && before > 0) pushLog('posture', `  → ${c.name} is soul-broken! +30% damage taken.`);
      }
    }
    ef.turns--;
    return ef.turns > 0;
  });
}

function enemyTurn() {
  const p = combat.player;
  for (const e of combat.enemies) {
    if (e.hp <= 0) continue;
    if (combat.over) break;
    // Shock must be read before the tick (a 1-turn shock expires during it).
    const shocked = e.effects.some(ef => ef.kind === 'shock');
    tickCombatantEffects(e, { healTarget: p });
    if (e.hp <= 0) continue;  // a DOT finished it — rewards granted in checkDeath
    if (shocked) {
      pushLog('posture', `${e.name} is shocked — it staggers, and its turn passes.`);
      e.buffs.incomingMult = 1;
      continue;
    }
    const enemyData = ENEMIES[e.id];
    if (enemyData) enemyData.ai(e, p);
    e.buffs.incomingMult = 1;
  }
}

function enemyTickCDs(e) {
  Object.keys(e.cooldowns).forEach(k => { if (e.cooldowns[k]>0) e.cooldowns[k]--; });
}
function enemyCanUse(e, techId) {
  const tech = e.techniques[techId];
  // v0.45: silenced enemies cannot use techniques at all.
  if (e.effects.some(ef => ef.kind === 'silence')) return false;
  const up = e.effects.find(ef => ef.kind === 'qi_cost_up');
  const cost = up ? Math.ceil(tech.qi * up.value) : tech.qi;
  return e.cooldowns[techId] === 0 && e.qi >= cost;
}
// v0.45: Chill reduces a combatant's outgoing damage.
function chillMult(c) {
  const ef = (c.effects || []).find(x => x.kind === 'chill');
  return ef ? Math.max(0, 1 - ef.value) : 1;
}
// v0.45: Iron Skin / Avalanche Guard — reflect a share of damage taken back at the attacker.
function applyPlayerReflect(e, res) {
  const p = combat.player;
  let pct = schoolKit().reflectPct || 0;
  if (p.buffs && p.buffs.reflectTurns > 0) pct += p.buffs.reflectPct || 0;
  const taken = (res.hpDamage || 0) + (res.qiAbsorbed || 0);
  if (pct <= 0 || taken <= 0 || res.dodged || e.hp <= 0) return;
  const r = Math.round(taken * pct);
  if (r > 0) {
    e.hp = Math.max(0, e.hp - r);
    pushLog('hurt', `  → ${e.name} takes ${r} reflected damage (Iron Skin).`);
  }
}
function enemyUseTech(e, p, techId) {
  const tech = e.techniques[techId];
  // v0.45 safety: some per-enemy AIs call enemyUseTech directly — a silenced enemy
  // falls back to a plain strike instead.
  if (e.effects.some(ef => ef.kind === 'silence')) {
    pushLog('flavor', `${e.name} reaches for a technique — the seal holds. It lashes out plainly instead.`);
    const res = dealDamage(p, e.weaponPower * chillMult(e), { attacker: e, attackerElement: e.element });
    pushLog('hurt', damageLogLine(res, p));
    applyPlayerReflect(e, res);
    return;
  }
  const up = e.effects.find(ef => ef.kind === 'qi_cost_up');
  const cost = up ? Math.ceil(tech.qi * up.value) : tech.qi;
  e.qi -= cost;
  e.cooldowns[techId] = tech.cd + 1;
  // v0.45 Oathbrand backlash: bound enemies pay in blood for every technique used.
  const oath = e.effects.find(ef => ef.kind === 'oathbound');
  if (oath) {
    e.hp = Math.max(0, e.hp - oath.value);
    pushLog('hurt', `  → ${e.name} takes ${oath.value} backlash — the oath collects (${oath.name}).`);
    if (e.hp <= 0) { pushLog('posture', `${e.name} is undone by its own vow.`); return; }
  }
  const dmg = e.weaponPower * (tech.damage || 0) * chillMult(e);
  pushLog('line', tech.logHit(e.name, p.name));
  if (dmg > 0 || tech.directHP || tech.directSpirit) {
    const cm = chillMult(e);
    const res = dealDamage(p, dmg, {
      directHP: (tech.directHP || 0) * cm,
      directSpirit: (tech.directSpirit || 0) * cm,
      pierceQi: tech.pierceQi || 0,
      attacker: e, attackerElement: e.element,
    });
    pushLog('hurt', damageLogLine(res, p));
    applyPlayerReflect(e, res);
    if (res.dodged) return;  // evaded entirely: no posture, no rider effects
  }
  if (tech.postureBuild || tech.postureBreak) {
    const broke = applyPosture(p, tech.postureBuild || 0, tech.postureBreak, 3);
    if (broke) pushLog('posture', `${p.name}'s stance shatters! Qi damage doubled for ${p.broken} turns.`);
  }
  if (tech.effect) {
    let turns = tech.effectTurns;
    const hm = heritageMech();
    if (tech.effect === 'qi_cost_up' && hm.qiCostUpDurationMult) {
      turns = Math.max(1, Math.ceil(turns * hm.qiCostUpDurationMult));
    }
    p.effects.push({
      kind: tech.effect, value: tech.effectValue, turns, name: tech.name,
    });
    if (tech.effect === 'qi_drain') pushLog('flavor', `A glyph sticks to you, drinking your qi.`);
    if (tech.effect === 'bleed') pushLog('flavor', `The wound will not close on its own.`);
  }
}
function enemyMeditate(e) {
  // v0.45 Entangle: meditation is sealed — the turn is spent, nothing is gathered.
  if (e.effects.some(ef => ef.kind === 'entangle')) {
    e.buffs.incomingMult = 1.5;
    pushLog('line', `The ${e.name} tries to gather qi — the entangling glyphs drink everything it draws.`);
    return;
  }
  const regen = Math.ceil(e.qiMax * 0.4);
  const before = e.qi;
  e.qi = Math.min(e.qiMax, e.qi + regen);
  e.buffs.incomingMult = 1.5;
  pushLog('line', `The ${e.name} gathers itself, drawing qi inward.`);
  pushLog('heal', `  → +${e.qi - before} qi (vulnerable)`);
}
function enemyBasicStrike(e, p) {
  // v0.18 Phase 2: before falling through to a plain strike, try any usable technique.
  // This lets new techs added to techIds actually get used by the existing per-enemy AIs
  // (which only hard-code their original tech names). Specific AI logic that prefers
  // particular techs in particular orders runs first and is unaffected — this only kicks
  // in when the AI was already about to basic-strike.
  for (const techId of Object.keys(e.techniques || {})) {
    if (enemyCanUse(e, techId)) return enemyUseTech(e, p, techId);
  }
  const res = dealDamage(p, e.weaponPower * chillMult(e), { attacker: e, attackerElement: e.element });
  pushLog('line', `The ${e.name} attacks ${p.name}.`);
  pushLog('hurt', damageLogLine(res, p));
  applyPlayerReflect(e, res);
  if (!res.dodged) applyPosture(p, 4, false, 3);
}

function endOfRound() {
  const p = combat.player;
  Object.keys(p.cooldowns).forEach(k => { if (p.cooldowns[k]>0) p.cooldowns[k]--; });

  // v0.45: player-side statuses tick through the same engine as enemies (bleed, drains,
  // and any future enemy-applied DOT kinds all handled in one place).
  tickCombatantEffects(p);

  // v0.45 Sap of the Grove (Verdant) + Regrowth: heal-over-time at end of round.
  const kitEOR = schoolKit();
  let regen0 = 0;
  if (kitEOR.regenPct) regen0 += Math.round(p.hpMax * kitEOR.regenPct);
  if (p.buffs.regrowthTurns > 0) {
    regen0 += Math.round(p.hpMax * (p.buffs.regrowthPct || 0));
    p.buffs.regrowthTurns--;
  }
  if (regen0 > 0 && p.hp > 0 && p.hp < p.hpMax) {
    const before = p.hp;
    p.hp = Math.min(p.hpMax, p.hp + regen0);
    if (p.hp > before) pushLog('heal', `  → +${p.hp - before} hp (regrowth)`);
  }

  if (p.buffs.incomingTurns > 0) {
    p.buffs.incomingTurns--;
    if (p.buffs.incomingTurns === 0) p.buffs.incomingMult = 1;
  }
  // v0.45: tick the new self-buff timers (reflect / dodge).
  if (p.buffs.reflectTurns > 0) { p.buffs.reflectTurns--; if (p.buffs.reflectTurns === 0) p.buffs.reflectPct = 0; }
  if (p.buffs.dodgeTurns > 0)   { p.buffs.dodgeTurns--;   if (p.buffs.dodgeTurns === 0)   p.buffs.dodgeChance = 0; }
  // v0.57 stance-rework buff timers.
  if (p.buffs.critTurns > 0)         { p.buffs.critTurns--;         if (p.buffs.critTurns === 0)         p.buffs.critChance = 0; }
  if (p.buffs.postureBoostTurns > 0) { p.buffs.postureBoostTurns--; if (p.buffs.postureBoostTurns === 0) p.buffs.postureBoost = 1; }
  if (p.buffs.counterTurns > 0)      { p.buffs.counterTurns--;      if (p.buffs.counterTurns === 0)      p.buffs.counterOnDodge = 0; }
  if (p.broken > 0) p.broken--;
  // Tick posture-broken state for every alive enemy (multi-enemy aware).
  combat.enemies.forEach(en => { if (en.broken > 0) en.broken--; });

  // v0.64: Perception (mind) keeps the meridians flowing mid-combat: +1 qi/turn per 6 mind.
  const regen = 2 + (p.mods.qiRegenBonus || 0) + Math.floor(((state.finalStats && state.finalStats.mind) || 0) / 6);
  p.qi = Math.min(p.qiMax, p.qi + regen);

  combat.turn++;
  pushLog('turn', `— Turn ${combat.turn} —`);

  // Survival tribulation: win when turn count exceeds threshold (kill all enemies, normally one)
  if (combat.tribulation && combat.tribulation.kind === 'survival' && combat.turn > combat.tribulation.turns) {
    combat.enemies.forEach(en => { en.hp = 0; });
  }
}

// Render dispatch
// ============================================================
const app = document.getElementById('app');

function appendPanel(panel, tab) {
  if (tab && tab !== activeTab) return;
  app.appendChild(panel);
}

// v0.72 FIX (operator: "Abandon this Life is broken"): window.confirm() NEVER shows in a
// bare Android WebView (no WebChromeClient installed) — it silently returns false, so every
// confirm-gated destructive button no-opped on the phone while working on desktop. Replaced
// with a WebView-proof TWO-TAP arming: first tap arms (button turns crimson and asks again,
// 5s to decide), second tap executes.
function armDestructiveButton(btn, armedText, action) {
  let armed = false, timer = null;
  const orig = btn.textContent;
  btn.onclick = () => {
    if (!armed) {
      armed = true;
      btn.textContent = armedText;
      btn.style.color = 'var(--crimson)';
      btn.style.borderColor = 'var(--crimson)';
      timer = setTimeout(() => {
        armed = false;
        btn.textContent = orig;
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 5000);
    } else {
      clearTimeout(timer);
      action();
    }
  };
}

// v0.58: shared per-realm sub-tab chips. uiKey persists the choice in state.ui;
// countFn(tier) -> entry count shown on the chip. Defaults to the player's realm.
function selectedRealmTab(uiKey) {
  if (!state.ui) state.ui = {};
  const v = state.ui[uiKey];
  const maxT = state.realm.tierIdx || 0;
  if (typeof v === 'number' && v >= 0 && v <= 6) return v;
  return Math.min(maxT, 6);
}
function realmTabChips(uiKey, countFn) {

}

// Childhood / Destiny screens
// ============================================================
function renderChildhood() {
  const stage = state.childhood.step;
  const info = CHILDHOOD_STAGE_INFO[stage];
  const stepIdx = CHILDHOOD_STAGE_ORDER.indexOf(stage);

  const intro = document.createElement('div');
  intro.className = 'panel';
  intro.innerHTML = `<div class="roll-header">
      <strong>${info.title}</strong>
      <span style="color:var(--ink-soft);font-size:0.85rem">Step ${stepIdx + 1} of ${CHILDHOOD_STAGE_ORDER.length}</span>
    </div>
    <p style="margin:0.6rem 0 0.3rem">${info.heading}</p>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0">${info.flavor}</p>
    <p style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.5rem;font-style:italic">Fate offers itself. Choose once — there is no rerolling a life.</p>`;
  app.appendChild(intro);

  state.childhood.offer.forEach(beatId => {
    const beat = CHILDHOOD_BEATS[stage][beatId];
    if (!beat) return;
    const card = document.createElement('div');
    card.className = 'school-card';
    // v0.17: stat numbers are NEVER shown — flavor prose carries the entire signal. Items
    // (memento inscriptions, herbs, materials) are still listed since those are story elements,
    // not optimization knobs.
    const extras = [];
    if (beat.items) {
      if (beat.items.inscriptions && beat.items.inscriptions.length) {
        const names = beat.items.inscriptions.map(id => INSCRIPTIONS[id] ? INSCRIPTIONS[id].name : id).join(', ');
        extras.push(`<em>Memento:</em> ${names}`);
      }
      if (beat.items.weapons && beat.items.weapons.length) {
        const names = beat.items.weapons.map(id => WEAPONS[id] ? WEAPONS[id].name : id).join(', ');
        extras.push(`<em>Heirloom:</em> ${names}`);
      }
      if (beat.items.materials && Object.keys(beat.items.materials).length) {
        const list = Object.entries(beat.items.materials).map(([id, n]) => `${n}× ${MATERIALS[id] ? MATERIALS[id].name : id}`).join(', ');
        extras.push(`<em>Provisions:</em> ${list}`);
      }
      if (beat.items.herbs && Object.keys(beat.items.herbs).length) {
        const list = Object.entries(beat.items.herbs).map(([id, n]) => `${n}× ${HERBS[id] ? HERBS[id].name : id}`).join(', ');
        extras.push(`<em>Pouch:</em> ${list}`);
      }
    }
    const fatalBadge = beat.fatal
      ? `<div class="heritage-mods" style="color:#c44;margin-top:0.3rem"><strong>This fate ends here.</strong> No cultivator emerges from this story.</div>`
      : '';
    card.innerHTML = `<div class="school-name">${beat.name}</div>
      <div class="heritage-flavor" style="margin:0.5rem 0">${beat.prose}</div>
      ${extras.map(e => `<div class="heritage-mods" style="font-size:0.78rem;margin-top:0.2rem">${e}</div>`).join('')}
      ${fatalBadge}`;
    card.onclick = () => pickChildhoodBeat(stage, beatId);
    app.appendChild(card);
  });

  const cancel = document.createElement('div');
  cancel.className = 'panel';
  cancel.innerHTML = `<div class="button-row"><button class="ghost" id="abandon-childhood">Abandon</button></div>`;
  app.appendChild(cancel);
  document.getElementById('abandon-childhood').onclick = () => { state = null; render(); };
}

function pickChildhoodBeat(stage, beatId) {
  const beat = CHILDHOOD_BEATS[stage][beatId];
  if (beat && beat.fatal) {
    // Fatal childhood beat: the run ends before chargen. No save to wipe (no atts-char yet).
    dieRun(beat.deathCause, beat.deathProse, 'A would-be cultivator');
    return;
  }
  applyChildhoodBeatToState(state, stage, beatId);
  const i = CHILDHOOD_STAGE_ORDER.indexOf(stage);
  if (i < CHILDHOOD_STAGE_ORDER.length - 1) {
    const nextStage = CHILDHOOD_STAGE_ORDER[i + 1];
    state.childhood.step = nextStage;
    const rng = makeRng((state.seed ^ Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    state.childhood.offer = rollChildhoodOffer(nextStage, state.childhood.flags, rng);
  } else {
    const finishedChildhood = state.childhood;
    state = newCharacter((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, finishedChildhood);
  }
  render();
}
