  const nameInput = document.getElementById('name');
  nameInput.value = state.name;
  nameInput.oninput = e => { state.name = e.target.value; updateConfirmButton(); };

  // Story recap — only for characters that went through the childhood flow (post-v0.13).
  if (state.childhood && state.childhood.picks && Object.keys(state.childhood.picks).length) {
    const storyP = document.createElement('div');
    storyP.className = 'panel';
    const lines = CHILDHOOD_STAGE_ORDER.map(stg => {
      const id = state.childhood.picks[stg];
      if (!id) return null;
      const beat = CHILDHOOD_BEATS[stg][id];
      return `<div style="margin:0.25rem 0"><span style="color:var(--ink-soft);font-size:0.78rem">${CHILDHOOD_STAGE_INFO[stg].title}.</span> <strong>${beat.name}</strong></div>`;
    }).filter(Boolean).join('');
    storyP.innerHTML = `<strong>Your Story</strong>${lines}`;
    app.appendChild(storyP);
  }

  const remaining = state.pool - allocated(state);
  const stP = document.createElement('div');
  stP.className = 'panel';
  const poolClass = state.poolTier === 'legend' ? 'legend'
                  : state.poolTier === 'big'    ? 'big'
                  : state.poolTier === 'spike'  ? 'spike' : '';
  const poolLabel = state.poolTier === 'legend' ? ' — HEAVEN-BLESSED'
                  : state.poolTier === 'big'    ? ' — exceptional'
                  : state.poolTier === 'spike'  ? ' — fortunate' : '';
  stP.innerHTML = `<div class="roll-header">
    <strong>Roots &amp; Bones</strong>
    <div class="pool-display">Points: <span class="pool-number ${poolClass}">${remaining}</span> / ${state.pool}${poolLabel}</div>
  </div>`;
  STATS.forEach(s => {
    const base = state.baseStats[s.key];
    const alloc = state.allocation[s.key];
    const hMod = state.selectedHeritage != null
      ? (state.heritages[state.selectedHeritage].mods[s.key] || 0) : 0;
    const total = Math.max(6, base + alloc + hMod);
    const hStr = hMod ? ` <span style="color:var(--gold)">${hMod>0?'+':''}${hMod}</span>` : '';
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div style="flex:1;min-width:0">
        <div><span class="stat-name">${s.name}</span><span class="stat-zh">${s.zh}</span></div>
        <div class="stat-desc">${s.desc}</div>
      </div>
      <div class="stat-controls">
        <button data-key="${s.key}" data-delta="-1" ${alloc<=0?'disabled':''}>−</button>
        <span class="stat-value">${total}</span>
        <button data-key="${s.key}" data-delta="1" ${remaining<=0||alloc>=5?'disabled':''}>+</button>
      </div>
      <div class="stat-breakdown">${base}${alloc?` +${alloc}`:''}${hStr}</div>
    `;
    stP.appendChild(row);
  });
  stP.querySelectorAll('button[data-key]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.key;
      const d = +b.dataset.delta;
      if (d > 0 && state.pool - allocated(state) > 0 && state.allocation[k] < 5) state.allocation[k]++;
      if (d < 0 && state.allocation[k] > 0) state.allocation[k]--;
      render();
    };
  });
  app.appendChild(stP);

  const rP = document.createElement('div');
  rP.className = 'panel';
  rP.innerHTML = `<div class="roll-header">
      <strong>Reroll Fate</strong>
      <span>${state.rerollsLeft} remaining</span>
    </div>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0.3rem 0 0.6rem">Rerolls base stats, bonus pool, and heritage offerings. Your name and school are preserved.</p>
    <button id="reroll" ${state.rerollsLeft<=0?'disabled':''}>Reroll</button>`;
  app.appendChild(rP);
  document.getElementById('reroll').onclick = () => {
    if (state.rerollsLeft <= 0) return;
    const keepName = state.name;
    const keepSchool = state.selectedSchool;
    const keepRerolls = state.rerollsLeft - 1;
    const keepChildhood = state.childhood;
    state = newCharacter((Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0, keepChildhood);
    state.name = keepName;
    state.selectedSchool = keepSchool;
    state.rerollsLeft = keepRerolls;
    render();
  };

  const hP = document.createElement('div');
  hP.className = 'panel';
  hP.innerHTML = `<strong>Heritage</strong>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0.3rem 0 0.6rem">Three fates offer themselves. Choose one.</p>`;
  state.heritages.forEach((h, i) => {
    const card = document.createElement('div');
    card.className = 'heritage-card' + (state.selectedHeritage === i ? ' selected' : '');
    const modStr = Object.entries(h.mods).map(([k,v]) => {
      const s = STATS.find(x => x.key === k);
      return `${v>0?'+':''}${v} ${s.name}`;
    }).join(', ');
    card.innerHTML = `
      <div class="heritage-name">${h.name}<span class="rarity-tag rarity-${h.rarity}">${h.rarity}</span></div>
      <div class="heritage-mods">${modStr}</div>
      <div class="heritage-mods">${h.extra}</div>
      <div class="heritage-flavor">${h.flavor}</div>`;
    card.onclick = () => {
      // Revert previous heritage's one-time reroll / stat-pool bonuses before granting new one.
      const prev = state.selectedHeritage;
      if (prev != null && prev !== i) {
        const prevMech = HERITAGE_MECHANICS[state.heritages[prev].name];
        if (prevMech) {
          if (prevMech.extraRerolls) state.rerollsLeft = Math.max(0, state.rerollsLeft - prevMech.extraRerolls);
          if (prevMech.extraStatPool) state.pool = Math.max(0, state.pool - prevMech.extraStatPool);
        }
      }
      state.selectedHeritage = i;
      const mech = HERITAGE_MECHANICS[h.name];
      if (mech && prev !== i) {
        if (mech.extraRerolls)  state.rerollsLeft += mech.extraRerolls;
        if (mech.extraStatPool) state.pool += mech.extraStatPool;
      }
      render();
    };
    hP.appendChild(card);
  });
  app.appendChild(hP);

  const sP = document.createElement('div');
  sP.className = 'panel';
  sP.innerHTML = `<strong>School</strong>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0.3rem 0 0.6rem">Where will you take your first steps? Each school teaches a different rhythm of combat — and its own cultivation method.</p>`;
  Object.entries(SCHOOLS).forEach(([id, school]) => {
    const card = document.createElement('div');
    card.className = 'school-card' + (state.selectedSchool === id ? ' selected' : '');
    const weapon = WEAPONS[school.weapon];
    const method = Object.values(CULTIVATION_METHODS).find(m => m.schools && m.schools.includes(id));
    const statNames = school.bestStats.map(k => STATS.find(s=>s.key===k).name).join(' & ');
    const techList = school.techniques.map(tid => {
      const t = TECHNIQUES[tid];
      return `<div style="font-size:0.78rem;color:var(--ink-soft);margin:0.15rem 0 0 0.5rem">• <span style="color:var(--ink);font-weight:bold">${t.name}</span> <span style="opacity:0.7">${t.zh}</span> — ${t.desc}</div>`;
    }).join('');
    const roleLabel = { single: 'Pure Single-Target', aoe: 'Pure AOE', mixed: 'Mixed' }[school.role] || '';
    const roleColor = { single: '#9ec5e8', aoe: '#e89e9e', mixed: '#c9b97a' }[school.role] || 'var(--gold)';
    const kitCard = SCHOOL_KITS[id];
    card.innerHTML = `
      <div class="school-name">${school.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.85rem">${school.zh}</span>${roleLabel ? `<span style="float:right;font-size:0.72rem;font-weight:normal;color:${roleColor};border:1px solid ${roleColor};padding:0.1rem 0.4rem;border-radius:0.3rem">${roleLabel}</span>` : ''}</div>
      <div class="school-mods">Starter weapon: <strong>${weapon.name}</strong> (${weapon.zh}) — power ${weapon.power}. Best with: ${statNames}.</div>
      ${method ? `<div class="school-mods">Cultivation method: <strong>${method.name}</strong> (${method.zh}) — ${method.desc}</div>` : ''}
      <div class="school-flavor">${school.flavor}</div>
      <div style="margin-top:0.4rem;font-size:0.82rem"><strong>Gameplan.</strong> ${school.specialty}</div>
      ${kitCard ? `<div style="margin-top:0.3rem;font-size:0.82rem"><strong style="color:var(--gold)">Passive — ${kitCard.passiveName}</strong> <span style="color:var(--ink-soft);font-size:0.75rem">${kitCard.passiveZh}</span>: ${kitCard.passiveDesc}</div>` : ''}
      <div style="margin-top:0.3rem">${techList}</div>`;
    card.onclick = () => { state.selectedSchool = id; render(); };
    sP.appendChild(card);
  });
  app.appendChild(sP);

  // ---- v0.61: the Demonic Path choice ----
  const dP = document.createElement('div');
  dP.className = 'panel';
  const demonForced = !!(SCHOOLS[state.selectedSchool] && SCHOOLS[state.selectedSchool].isDemon);
  if (demonForced) state.demonic = true;
  const demonOn = !!state.demonic;
  const demonLore = state.selectedSchool && DEMONIC_SCHOOL_LORE[state.selectedSchool];
  const twistLine = (state.selectedSchool && DEMONIC_TWISTS[state.selectedSchool])
    ? `<div style="font-size:0.8rem;margin-top:0.3rem"><strong>Your school's demonic form${demonLore ? ` — ${demonLore.name} ${demonLore.zh}` : ''}:</strong> ${DEMONIC_TWISTS[state.selectedSchool].twistDesc}${demonLore ? `<div style="color:var(--ink-soft);margin-top:0.15rem">${demonLore.flavor}</div>` : ''}</div>` : '';
  dP.innerHTML = `<strong>The Demonic Path</strong> <span style="color:var(--ink-soft);font-size:0.85rem">魔道</span>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0.3rem 0 0.4rem">Any school can be walked as heresy — each has a demonic mirror of itself. The demonic dao grows by SLAUGHTER, not stillness.</p>
    <div style="font-size:0.82rem"><strong style="color:var(--gold)">Gains:</strong> +4 to every stat · +20% max HP · +20% to ALL damage · every landed blow brands HELLFIRE (stacks to 5; each stack burns 1% of the target's MISSING health per turn) · +50% insight from kills, and righteous hunters who ambush you are worth TRIPLE · your school's passive sharpened · six demon-only grounds.</div>
    <div style="font-size:0.82rem;margin-top:0.25rem"><strong style="color:var(--crimson)">Price:</strong> raw cultivation runs at HALF pace (this dao is fed, not sat with) · a heavenly tribulation bars EVERY breakthrough, against executioners far above your realm · righteous sects hunt you on the road.</div>
    ${twistLine}`;
  const dBtnRow = document.createElement('div');
  dBtnRow.className = 'button-row';
  dBtnRow.style.marginTop = '0.5rem';
  const dBtn = document.createElement('button');
  dBtn.className = demonOn ? 'gold' : 'ghost';
  dBtn.textContent = demonForced ? 'Demon Heart Palace IS the demonic path' : (demonOn ? 'Walking the Demonic Path' : 'Walk the Demonic Path');
  dBtn.disabled = demonForced;
  dBtn.onclick = () => { state.demonic = !state.demonic; render(); };
  dBtnRow.appendChild(dBtn);
  dP.appendChild(dBtnRow);
  app.appendChild(dP);

  const cP = document.createElement('div');
  cP.className = 'panel';
  cP.innerHTML = `<div class="button-row">
      <button id="confirm">Step onto the Path</button>
      <button class="ghost" id="abandon">Abandon</button>
    </div>
    <p id="confirm-hint" style="font-size:0.8rem;color:var(--ink-soft);margin-top:0.5rem"></p>`;
  app.appendChild(cP);
  document.getElementById('confirm').onclick = () => {
    if (!canConfirm()) return;
    state.confirmed = true;
    const school = SCHOOLS[state.selectedSchool];
    if (school.isDemon) state.demonic = true;  // v0.61: Demon Heart is inherently demonic
    state.finalStats = finalStats(state);
    state.weapon = school.weapon;
    state.loadout = school.techniques.slice();
    state.activeSkills = school.techniques.slice();  // Wave 1d: default active set = the 4 base techs
    applyDemonicLoadoutSwap(state);  // v0.70: the heretical signature replaces the righteous one
    state.realm.insight += metaStartInsight();  // Wave 2c: Inherited Memory head-start (souls meta)
    state.passiveTick = Date.now();
    applyHeritagePostConfirm(state);
    applyChildhoodPostConfirm(state);
    saveChar();
    scheduleCultivationTick();
    render();
  };
  document.getElementById('abandon').onclick = () => { state = null; render(); };
  updateConfirmButton();
}

function canConfirm() {
  return state && state.name.trim() && state.selectedHeritage != null && state.selectedSchool != null;
}
function updateConfirmButton() {
  const btn = document.getElementById('confirm');
  const hint = document.getElementById('confirm-hint');
  if (!btn) return;
  const ok = canConfirm();
  btn.disabled = !ok;
  const missing = [];
  if (!state.name.trim()) missing.push('name');
  if (state.selectedHeritage == null) missing.push('heritage');
  if (state.selectedSchool == null) missing.push('school');
  hint.textContent = ok ? '' : `Choose your ${missing.join(', ')} to continue.`;
}

// ============================================================
// Forge recipe row builders (v0.23: factored out for sub-tab rendering)
// ============================================================
function buildWeaponRecipeRow(recipe) {
  const w = WEAPONS[recipe.id];
  const row = document.createElement('div');
  if (!w) return row;
  const meetsReq = meetsRealmReq(recipe);
  const canMake = canForge(recipe);
  const alreadyHas = recipe.id === state.weapon || state.weapons.owned.includes(recipe.id);
  row.className = 'consumable-row tip';
  row.setAttribute('data-tip', w.desc);
  const scaledCosts = effectiveWeaponRecipeCost(recipe);
  const matText = Object.entries(scaledCosts).map(([mid, n]) => {
    const have = state.base.materials[mid] || 0;
    const mat = MATERIALS[mid];
    const shortfall = have < n;
    return `<span style="color:${shortfall?'var(--crimson)':'var(--ink)'}">${n}× ${mat.name} (${have})</span>`;
  }).join(', ');
  const reqLabel = recipe.minRealmTier
    ? `${REALMS[recipe.minRealmTier].name}${recipe.minLayer ? ' L' + recipe.minLayer : ''}`
    : '';
  const reqHTML = meetsReq ? '' : `<div class="consumable-desc" style="color:var(--crimson)">Requires ${reqLabel}.</div>`;
  const ownedHTML = alreadyHas ? `<div class="consumable-desc" style="color:var(--jade)">Already in your possession.</div>` : '';
  const info = document.createElement('div');
  info.style.flex = '1 1 55%';
  const modBlurb = weaponModBlurb(w);
  info.innerHTML = `<div class="consumable-name">${w.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${w.zh}</span> <span class="rarity-tag rarity-${w.rarity||'common'}">${w.rarity||'common'}</span></div>
    <div class="consumable-desc">power ${w.power} · ${w.slots} slots · ${w.kind}${modBlurb ? ' · ' + modBlurb : ''}<br>${matText}</div>
    ${reqHTML}${ownedHTML}`;
  row.appendChild(info);
  const btns = document.createElement('div');
  btns.className = 'plot-buttons';
  const craftBtn = document.createElement('button');
  craftBtn.className = 'gold small';
  craftBtn.textContent = 'Forge';
  craftBtn.disabled = !canMake || alreadyHas;
  craftBtn.onclick = () => { craftArtifact(recipe); render(); };
  btns.appendChild(craftBtn);
  row.appendChild(btns);
  return row;
}

function buildArmorRecipeRow(recipe) {
  const ar = ARMOR[recipe.id];
  const row = document.createElement('div');
  if (!ar) return row;
  const meetsReq = meetsRealmReq(recipe);
  const canMake = canForge(recipe);
  const alreadyHas = state.armor.owned.includes(recipe.id)
    || Object.values(state.armor.equipped || {}).includes(recipe.id);
  row.className = 'consumable-row tip';
  row.setAttribute('data-tip', ar.desc);
  const matText = Object.entries(recipe.materials).map(([mid, n]) => {
    const have = state.base.materials[mid] || 0;
    const mat = MATERIALS[mid]; if (!mat) return '';
    const shortfall = have < n;
    return `<span style="color:${shortfall?'var(--crimson)':'var(--ink)'}">${n}× ${mat.name} (${have})</span>`;
  }).join(', ');
  const reqLabel = recipe.minRealmTier
    ? `${REALMS[recipe.minRealmTier].name}${recipe.minLayer ? ' L' + recipe.minLayer : ''}`
    : '';
  const reqHTML = meetsReq ? '' : `<div class="consumable-desc" style="color:var(--crimson)">Requires ${reqLabel}.</div>`;
  const ownedHTML = alreadyHas ? `<div class="consumable-desc" style="color:var(--jade)">Already in your possession.</div>` : '';
  const info = document.createElement('div');
  info.style.flex = '1 1 55%';
  const setStr = ar.set ? ` · ${ARMOR_SETS[ar.set].name} set` : '';
  info.innerHTML = `<div class="consumable-name">${ar.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${ar.zh}</span> <span class="rarity-tag rarity-${ar.rarity||'common'}">${ar.rarity||'common'}</span></div>
    <div class="consumable-desc">${ARMOR_SLOT_LABELS[ar.slot] || ar.slot}${setStr} · ${modSummary(ar.mods)}<br>${matText}</div>
    ${reqHTML}${ownedHTML}`;
  row.appendChild(info);
  const btns = document.createElement('div');
  btns.className = 'plot-buttons';
  const craftBtn = document.createElement('button');
  craftBtn.className = 'gold small';
  craftBtn.textContent = 'Forge';
  craftBtn.disabled = !canMake || alreadyHas;
  craftBtn.onclick = () => { craftArmor(recipe); render(); };
  btns.appendChild(craftBtn);
  row.appendChild(btns);
  return row;
}

// v0.23: short human-readable summary of a weapon's mod profile, for the row blurb.
// Only flags the more interesting mods — keeps row dense without ballooning.
function weaponModBlurb(w) {
  if (!w || typeof w.apply !== 'function') return '';
  const probe = baseInscriptionMods();
  try { w.apply(probe); } catch (e) { return ''; }
  const tags = [];
  if (probe.critChance > 0) tags.push(`+${Math.round(probe.critChance*100)}% crit`);
  if (probe.critMult > 1.5) tags.push(`+${Math.round((probe.critMult-1.5)*100)}% crit dmg`);
  if (probe.lifestealPct > 0) tags.push(`${Math.round(probe.lifestealPct*100)}% lifesteal`);
  if (probe.flatDR > 0) tags.push(`${probe.flatDR} DR`);
  if (probe.firstStrikeBonus > 0) tags.push(`+${Math.round(probe.firstStrikeBonus*100)}% opener`);
  if (probe.lowHpBonus > 0) tags.push(`+${Math.round(probe.lowHpBonus*100)}% at low HP`);
  if (probe.qiOnKill > 0) tags.push(`+${probe.qiOnKill} qi/kill`);
  Object.entries(probe.vsKindMult || {}).forEach(([k, v]) => { if (v > 0) tags.push(`+${Math.round(v*100)}% vs ${k}`); });
  if (probe.qiRegenBonus > 0) tags.push(`+${probe.qiRegenBonus} qi regen`);
  if (probe.hpBonus > 0) tags.push(`+${probe.hpBonus} hp`);
  if (probe.qiBonus > 0) tags.push(`+${probe.qiBonus} qi`);
  if (probe.spiritBonus > 0) tags.push(`+${probe.spiritBonus} spirit`);
  if (probe.spiritDamageMult > 1) tags.push(`+${Math.round((probe.spiritDamageMult-1)*100)}% spirit dmg`);
  if (probe.postureBreakBonus > 0) tags.push(`+${probe.postureBreakBonus} break dur`);
  return tags.join(', ');
}

  ensurePlots();

    app.appendChild(banner);
    document.getElementById('dismiss-offline').onclick = () => {
      offlineReport = null;
      render();
    };
  }

  // Character panel
  const p = document.createElement('div');
  p.className = 'panel';
  const ascLabel = state.ascensions ? ` &middot; <span style="color:var(--gold)">Ascensions ×${state.ascensions}</span>` : '';
  let html = `<h2>${state.name}</h2>
    <p style="margin:0 0 0.8rem;color:var(--ink-soft)"><em>${h.name}</em> &middot; <em>${school.name}</em> &middot; ${realmLabel(state)}${ascLabel}</p>`;
  if (state.ascensionBoons && state.ascensionBoons.length) {
    const chips = state.ascensionBoons.map(id => {
      const b = BOONS[id];
      return `<span class="buff-chip tip" data-tip="${escapeTip(b.desc)}" style="background:rgba(184,134,11,0.15);border-color:var(--gold)">${b.name}</span>`;
    }).join('');
    html += `<div style="margin:0 0 0.8rem">${chips}</div>`;
  }
  if (state.destinies && state.destinies.length) {
    const dchips = state.destinies.map(id => {
      const d = DESTINIES[id];
      if (!d) return '';
      return `<span class="buff-chip tip" data-tip="${escapeTip(d.desc)}" style="background:rgba(120,80,160,0.15);border-color:#9a6cc4">${d.name}${d.keystone ? ' ✦' : ''}</span>`;
    }).join('');
    html += `<div style="margin:0 0 0.8rem">${dchips}</div>`;
  }
  STATS.forEach(s => {
    html += `<div class="stat-row">
      <div><span class="stat-name">${s.name}</span><span class="stat-zh">${s.zh}</span><div class="stat-desc">${s.desc}</div></div>
      <div class="stat-value">${state.finalStats[s.key]}</div>
    </div>`;
  });
  const hpMax = computeMaxHP(state), qiMax = computeMaxQi(state), spMax = computeMaxSpirit(state);
  const mods = computeMods(state);
  const rb = realmBonusFor(state);
  const wpnMult = activeBuffValue('weapon_mult', 1);
  const wpnPower = Math.round((weapon.power + refineWeaponBonus(state) + rb.weapon + mods.weaponBonus) * wpnMult);
  html += `<div style="margin-top:0.8rem;font-size:0.88rem">
    <strong>Body</strong> ${hpMax} HP &middot;
    <strong>Qi Pool</strong> ${qiMax} &middot;
    <strong>Spirit</strong> ${spMax} &middot;
    <strong>Weapon Power</strong> ${wpnPower}
  </div>`;
  if (state.spiritRoot) {
    const sr = state.spiritRoot;
    const rootEls = (sr.elements && sr.elements.length ? sr.elements : [sr.element]).map(elementLabel).join(' / ');
    const gradePct = Math.round(((sr.grade || 1) - 1) * 100);
    const foundPct = Math.round(((state.foundationQuality || 1) - 1) * 100);
    html += `<div style="margin-top:0.4rem;font-size:0.88rem">
      <strong>Spirit Root</strong> <span class="tip" data-tip="Your innate element drives Five-Element combat counters: +${Math.round(ELEMENT_COUNTER_BONUS*100)}% damage when you overcome a foe's element, -${Math.round(ELEMENT_COUNTER_MALUS*100)}% when overcome. Grade is a gentle, upside-only cultivation multiplier.">${rootEls} &middot; ${sr.gradeName || 'Common'} (${gradePct>=0?'+':''}${gradePct}% cult)</span> &middot;
      <strong>Foundation</strong> <span class="tip" data-tip="Quality of your cultivation base, set when you break through. A permanent, upside-only multiplier on cultivation speed — better breakthrough prep raises it, and it never drops.">+${foundPct}% cult</span>
    </div>`;
  }
  html += `<p style="margin-top:1rem;font-style:italic;color:var(--ink-soft)">${h.flavor}</p>`;
  p.innerHTML = html;
  app.appendChild(p);  // always visible (header)

  // Realm + cultivation
  const realmP = document.createElement('div');
  realmP.className = 'panel';
  const info = advanceInfo(state);
  const progressPct = info ? Math.min(100, (state.realm.insight / info.cost) * 100) : 100;
  const tier = REALMS[state.realm.tierIdx];
  const insightInt = Math.floor(state.realm.insight);
  let realmHTML = `<div class="realm-header">
      <div><span class="realm-title">${realmLabel(state)}</span><span class="realm-zh">${tier.zh}</span></div>
      <div style="font-size:0.85rem">Insight: <strong id="insight-value">${insightInt}</strong>${info ? ' / ' + info.cost : ''}</div>
    </div>
    <div class="realm-bar"><div class="realm-bar-fill" id="insight-bar" style="width:${progressPct}%"></div></div>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0.2rem 0 0.6rem;font-style:italic">${tier.flavor}</p>`;
  realmHTML += `<p class="tip" data-tip="Lifespan is a resource. Age advances slowly and ONLY while actively cultivating (idling/offline are safe); each realm hugely extends your span. Certain pills, schools, and artifacts ADD lifespan; powerful pills SPEND it (a share of what remains) for permanent power. Running out is death by old age — which reincarnates you with your souls intact." style="font-size:0.8rem;color:var(--ink-soft);margin:0 0 0.4rem">Age <strong>${Math.floor(state.age || 16)}</strong> / lifespan <strong>${lifespanMax()}</strong> yrs &middot; <strong style="color:var(--jade)">${Math.floor(lifespanRemaining())}</strong> remaining${state.bodyQuench ? ` · body tempered ×${state.bodyQuench} (+${bodyQuenchHPAdd()} HP)` : ''}</p>`;
  if (destinyPicksAvailable() > 0 && eligibleDestinies().length) {
    realmHTML += `<div class="button-row" style="margin-top:0.4rem"><button class="gold" id="choose-destiny">Choose a Destiny (${destinyPicksAvailable()} available)</button></div>
      <p style="font-size:0.78rem;color:#c79cf0;margin-top:0.3rem">A breakthrough has opened a fork in your fate.</p>`;
  }
  if (info) {
    const can = state.realm.insight >= info.cost;
    realmHTML += `<div class="button-row">
      <button class="gold" id="advance" ${can?'':'disabled'}>${info.label} (${info.cost} insight)</button>
    </div>`;
    if (!can) realmHTML += `<p style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.4rem">Gather more insight through combat and cultivation.</p>`;
  } else if (canAscend()) {
    if (state.demonic && (state.heavenConquest || 0) < 3) {
      const stage = state.heavenConquest || 0;
      const nextName = ENEMIES[HEAVEN_CONQUEST_STAGES[stage]].name;
      realmHTML += `<p style="font-size:0.85rem;color:var(--crimson);margin-top:0.4rem">The heavens do not INVITE heretics. Three ascended cultivators bar the gate — take it from them. Conquest: <strong>${stage}/3</strong>. Next: <strong>${nextName}</strong>.</p>
        <div class="button-row">
          <button class="gold" id="conquer-btn">Assault the Gate (${stage + 1}/3)</button>
        </div>
        <p style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.4rem">Each of the Risen is a boss in their own right. Defeats cost the usual toll but your conquered stages HOLD — the gate does not heal.</p>`;
    } else {
      realmHTML += `<p style="font-size:0.85rem;color:var(--gold);margin-top:0.4rem">${state.demonic ? 'THE GATE IS TAKEN. Heaven lies open — not granted, but conquered.' : 'You stand at the last-charted rung of the heavens. The dao waits — either climb further, or continue this life on your own terms.'}</p>
      <div class="button-row">
        <button class="gold" id="ascend-btn">Ascend to the Dao</button>
      </div>
      <p style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.4rem">WHAT CROSSES WITH YOU: your name, school, heritage, your childhood's story (its stat echoes re-roll), the demonic path if you walk it, your Ascensions tally, and EVERY boon — past picks plus the new one. The Soul Altar (souls, aptitudes) persists separately across even death. EVERYTHING ELSE resets: realm, items, skills, materials, sect standing, destinies.</p>`;
    }
  } else {
    realmHTML += `<p style="font-size:0.85rem;color:var(--gold);margin-top:0.4rem">The peak of the known heavens. Nothing higher has been mapped.</p>`;
  }

  const method = getCultivationMethod();
  const rate = cultivationRate();
  if (state.cultivating) {
    const loc = LOCATIONS.find(l => l.id === state.cultivating.locationId);
    realmHTML += `<div class="cult-status">
      <div><strong>Cultivating at ${loc ? loc.name : 'nowhere'}</strong> · method: ${method.name}</div>
      <div>Gaining <span class="rate" id="cult-rate">${rate.toFixed(3)}</span> insight/sec (${Math.round(rate*60)}/min, ${Math.round(rate*3600)}/hour)</div>
      <div class="button-row" style="margin-top:0.5rem"><button class="ghost small" id="stop-cult">Stop Cultivating</button></div>
    </div>`;
  } else {
    realmHTML += `<div class="cult-status idle">
      <div><strong>Passive cultivation</strong> · method: ${method.name}</div>
      <div>Gaining <span class="rate" id="cult-rate">${rate.toFixed(3)}</span> insight/sec (${Math.round(rate*60)}/min) just by carrying the dao with you. Meditate at a location for a larger rate.</div>
    </div>`;
  }

  realmP.innerHTML = realmHTML;
  app.appendChild(realmP);  // always visible (header)
  renderTabBar();
  const advBtn = document.getElementById('advance');
  if (advBtn) advBtn.onclick = () => { tryAdvanceRealm(); render(); };
  const cdBtn = document.getElementById('choose-destiny');
  if (cdBtn) cdBtn.onclick = () => openDestinyChoice();
  const conquerBtn = document.getElementById('conquer-btn');
  if (conquerBtn) conquerBtn.onclick = () => startHeavenConquest();
  const ascBtn = document.getElementById('ascend-btn');
  if (ascBtn) ascBtn.onclick = () => beginAscension();
  const stopBtn = document.getElementById('stop-cult');
  if (stopBtn) stopBtn.onclick = () => { stopCultivation(); render(); };

  // --- Cultivation Points panel (Wave 1b: reserve stat points; only shown once you have any) ---
  const totalFreeAlloc = STAT_KEYS.reduce((a, k) => a + ((state.freeAlloc && state.freeAlloc[k]) || 0), 0);
  if ((state.freePoints || 0) > 0 || totalFreeAlloc > 0) {
    const fpP = document.createElement('div');
    fpP.className = 'panel';
    let fpHtml = `<h3>Cultivation Points <span style="font-weight:normal;color:var(--ink-soft);font-size:0.85rem">修为点</span></h3>
      <p style="font-size:0.85rem;color:var(--ink-soft);margin:0 0 0.5rem">Unspent: <strong style="color:var(--gold)">${state.freePoints || 0}</strong>. Earned on each breakthrough — allocate into any stat, and respec freely anytime.</p>`;
    STATS.forEach(s => {
      const a = (state.freeAlloc && state.freeAlloc[s.key]) || 0;
      fpHtml += `<div class="stat-row">
        <div><span class="stat-name">${s.name}</span> <span class="stat-zh">${s.zh}</span>${a ? ` <span style="color:var(--gold)">+${a}</span>` : ''}</div>
        <div style="display:flex;gap:0.3rem;align-items:center">
          <button class="ghost small" data-fpm="${s.key}" ${a > 0 ? '' : 'disabled'}>−</button>
          <button class="ghost small" data-fpp="${s.key}" ${(state.freePoints || 0) > 0 ? '' : 'disabled'}>+</button>
        </div>
      </div>`;
    });
    fpHtml += `<div class="button-row" style="margin-top:0.5rem"><button class="ghost small" id="fp-respec" ${totalFreeAlloc > 0 ? '' : 'disabled'}>Respec (return ${totalFreeAlloc})</button></div>`;
    fpP.innerHTML = fpHtml;
    app.appendChild(fpP);
    STATS.forEach(s => {
      const pb = fpP.querySelector(`[data-fpp="${s.key}"]`);
      if (pb) pb.onclick = () => { allocFreePoint(s.key, 1); render(); };
      const mb = fpP.querySelector(`[data-fpm="${s.key}"]`);
      if (mb) mb.onclick = () => { allocFreePoint(s.key, -1); render(); };
    });
    const rsp = document.getElementById('fp-respec');
    if (rsp) rsp.onclick = () => { respecFreePoints(); render(); };
  }

  // --- Skill tree panel (Self tab) ---
  const skP = document.createElement('div');
  skP.className = 'panel';
  skP.innerHTML = `<h3>Skills <span style="font-weight:normal;color:var(--ink-soft);font-size:0.85rem">道术</span></h3>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0 0 0.4rem">Spend insight to unlock permanent passive bonuses. Higher realms unlock higher nodes.</p>`;
  const categories = {};
  SKILLS.forEach(sk => {
    if (sk.demonicOnly && !state.demonic) return;   // v0.68: invisible to the righteous
    if (!categories[sk.category]) categories[sk.category] = [];
    categories[sk.category].push(sk);
  });
  Object.entries(categories).forEach(([cat, skills]) => {
    const hdr = document.createElement('div');
    hdr.className = 'skill-category-header';
    hdr.textContent = cat;
    skP.appendChild(hdr);
    skills.forEach(sk => {
      if (sk.repeatable) {
        // Wave 1e: Endless Path repeatable node — rank up for stacking passive growth.
        const rank = repeatableRank(sk.id);
        const cap = sk.maxRank || Infinity;
        const atCap = rank >= cap;
        const cost = repeatableCost(sk);
        const met = meetsSkillReq(sk);
        const v = sk.effect.value * rank;
        let cur = '';
        if (rank > 0) {
          if (sk.effect.kind === 'cultivation_mult') cur = `now +${Math.round(v * 100)}% cultivation`;
          else if (sk.effect.kind === 'hp_add') cur = `now +${v} max HP`;
          else if (sk.effect.kind === 'weapon_add') cur = `now +${v} weapon power`;
          else if (sk.effect.kind === 'combat_insight_mult') cur = `now +${Math.round(v * 100)}% combat insight`;
          else if (sk.effect.kind === 'incoming_mult_perm') cur = `now -${Math.round(v * 100)}% damage taken`;
        }
        const reason = [];
        if (!met && state.realm.tierIdx < (sk.minTier || 0)) reason.push(`Requires ${REALMS[sk.minTier].name}`);
        else if (met && !atCap && state.realm.insight < cost) reason.push(`Need ${cost.toLocaleString()} insight`);
        const node = document.createElement('div');
        node.className = 'skill-node tip' + (rank > 0 ? ' unlocked' : (met ? '' : ' locked'));
        node.setAttribute('data-tip', sk.desc);
        const left = document.createElement('div');
        left.style.flex = '1 1 60%';
        left.innerHTML = `<div class="skill-name">${sk.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${sk.zh}</span> <span style="color:var(--gold);font-size:0.78rem">Rank ${rank}${cap !== Infinity ? '/' + cap : ''}</span></div>
          <div class="skill-desc">${sk.desc}${cur ? ` <span style="color:var(--gold)">(${cur})</span>` : ''}</div>
          ${reason.length ? `<div class="skill-desc" style="color:var(--crimson)">${reason.join(' · ')}</div>` : ''}`;
        node.appendChild(left);
        const right = document.createElement('div');
        right.style.textAlign = 'right';
        if (atCap) {
          right.innerHTML = `<span class="rarity-tag rarity-legendary">maxed</span>`;
        } else {
          const btn = document.createElement('button');
          btn.className = 'small gold';
          btn.textContent = `Rank Up (${cost.toLocaleString()})`;
          btn.disabled = !canRankUp(sk);
          btn.onclick = () => { rankUpSkill(sk.id); render(); };
          right.appendChild(btn);
        }
        node.appendChild(right);
        skP.appendChild(node);
        return;
      }
      const unlocked = hasSkill(sk.id);
      const canBuy = !unlocked && canUnlockSkill(sk);
      const reasonNotMet = [];
      if (!unlocked) {
        if (state.realm.tierIdx < (sk.minTier || 0)) reasonNotMet.push(`Requires ${REALMS[sk.minTier].name}`);
        else if (state.realm.tierIdx === (sk.minTier || 0) && sk.minLayer && state.realm.layer < sk.minLayer) reasonNotMet.push(`Requires ${REALMS[sk.minTier].name} L${sk.minLayer}`);
        if (sk.requires && sk.requires.some(r => !hasSkill(r))) reasonNotMet.push(`Requires: ${sk.requires.map(r => SKILLS.find(s => s.id === r).name).join(', ')}`);
        if (meetsSkillReq(sk) && state.realm.insight < sk.cost) reasonNotMet.push(`Need ${sk.cost} insight`);
      }
      const node = document.createElement('div');
      node.className = 'skill-node tip' + (unlocked ? ' unlocked' : (meetsSkillReq(sk) ? '' : ' locked'));
      node.setAttribute('data-tip', sk.desc);
      const left = document.createElement('div');
      left.style.flex = '1 1 60%';
      left.innerHTML = `<div class="skill-name">${sk.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${sk.zh}</span></div>
        <div class="skill-desc">${sk.desc}</div>
        ${reasonNotMet.length ? `<div class="skill-desc" style="color:var(--crimson)">${reasonNotMet.join(' · ')}</div>` : ''}`;
      node.appendChild(left);
      const right = document.createElement('div');
      right.style.textAlign = 'right';
      if (unlocked) {
        right.innerHTML = `<span class="rarity-tag rarity-legendary">learned</span>`;
      } else {
        const btn = document.createElement('button');
        btn.className = 'small gold';
        btn.textContent = `Learn (${sk.cost.toLocaleString()})`;
        btn.disabled = !canBuy;
        btn.onclick = () => { unlockSkill(sk.id); render(); };
        right.appendChild(btn);
      }
      node.appendChild(right);
      skP.appendChild(node);
    });
  });

  // Library: discovered skill books
  const foundBooks = state.foundBooks || [];
  const libraryHdr = document.createElement('div');
  libraryHdr.className = 'skill-category-header';
  libraryHdr.textContent = `Library (${foundBooks.length} discovered)`;
  skP.appendChild(libraryHdr);
  if (!foundBooks.length) {
    const empty = document.createElement('div');
    empty.style.fontSize = '0.78rem';
    empty.style.color = 'var(--ink-soft)';
    empty.style.fontStyle = 'italic';
    empty.textContent = 'No skill books yet. Enemies sometimes carry them — the rarer the foe, the rarer the book.';
    skP.appendChild(empty);
  } else {
    foundBooks.forEach(bookId => {
      const bk = SKILL_BOOKS[bookId];
      if (!bk) return;
      const canBuy = state.realm.insight >= bk.cost;
      const node = document.createElement('div');
      node.className = 'skill-node tip';
      node.setAttribute('data-tip', bk.desc);
      const left = document.createElement('div');
      left.style.flex = '1 1 60%';
      const rarityCls = bk.rarity === 'divine' ? 'legendary' : bk.rarity;
      left.innerHTML = `<div class="skill-name">${bk.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${bk.zh}</span> <span class="rarity-tag rarity-${rarityCls}">${bk.rarity}</span></div>
        <div class="skill-desc">${bk.desc}</div>
        ${!canBuy ? `<div class="skill-desc" style="color:var(--crimson)">Need ${bk.cost.toLocaleString()} insight</div>` : ''}`;
      node.appendChild(left);
      const right = document.createElement('div');
      right.style.textAlign = 'right';
      const btn = document.createElement('button');
      btn.className = 'small gold';
      btn.textContent = `Learn (${bk.cost.toLocaleString()})`;
      btn.disabled = !canBuy;
      btn.onclick = () => {
        if (state.realm.insight < bk.cost) return;
        state.realm.insight -= bk.cost;
        state.skills.push(bookId);
        state.foundBooks = state.foundBooks.filter(x => x !== bookId);
        applyPermanentSkillEffect(bk);
        saveChar();
        render();
      };
      right.appendChild(btn);
      node.appendChild(right);
      skP.appendChild(node);
    });
  }

  appendPanel(skP, 'skills');

  // Artifact
  const artP = document.createElement('div');
  artP.className = 'panel';
  // v0.77: demonic flesh-carving — body inscription slots, with the lifespan surcharge.
  if (state.demonic) {
    const bSlots = bodyInscriptionSlots();
    const carved = bodyInscriptions();
    const bP = document.createElement('div');
    bP.className = 'panel';
    bP.innerHTML = `<h3>Body Inscriptions <span style="font-weight:normal;color:var(--ink-soft);font-size:0.85rem">刻身</span></h3>
      <p style="font-size:0.85rem;color:var(--ink-soft);margin:0 0 0.4rem">Heresy carves power into the FLESH itself: <strong style="color:var(--gold)">${carved.length}/${bSlots}</strong> body slots (+1 every second realm). Each carved inscription applies its full effect — and raises <strong style="color:var(--crimson)">ALL lifespan consumption by +10%</strong> (currently ${Math.round((lifespanConsumptionMult() - 1) * 100)}%): aging, defeat tolls, and lifespan-burning pills alike.</p>`;
    carved.forEach((id, idx) => {
      const ins = INSCRIPTIONS[id];
      if (!ins) return;
      const row = document.createElement('div'); row.className = 'consumable-row';
      row.innerHTML = `<div class="consumable-info"><div class="consumable-name">${ins.name} <span class="rarity-tag rarity-${ins.rarity}">${ins.rarity}</span> <span style="color:var(--crimson);font-size:0.72rem">carved</span></div><div class="consumable-desc">${ins.desc}</div></div>`;
      const btns = document.createElement('div'); btns.className = 'consumable-buttons';
      const ub = document.createElement('button'); ub.className = 'ghost'; ub.textContent = 'Cut Out';
      ub.onclick = () => { unslotBodyInscription(idx); render(); };
      btns.appendChild(ub); row.appendChild(btns); bP.appendChild(row);
    });
    if (carved.length < bSlots) {
      const gearSlotted = state.inscriptions.slotted || [];
      const available = (state.inscriptions.owned || []).filter((id, i, arr) => {
        if (!INSCRIPTIONS[id]) return false;
        if (arr.indexOf(id) !== i) return false;   // one row per id
        const ownedCount = arr.filter(x => x === id).length;
        const usedCount = gearSlotted.filter(x => x === id).length + carved.filter(x => x === id).length;
        return ownedCount > usedCount;
      });
      if (available.length) {
        const hdr = document.createElement('div');
        hdr.style.cssText = 'font-size:0.8rem;color:var(--ink-soft);margin:0.3rem 0 0.2rem';
        hdr.textContent = 'Carve from your unslotted inscriptions:';
        bP.appendChild(hdr);
        available.forEach(id => {
          const ins = INSCRIPTIONS[id];
          const row = document.createElement('div'); row.className = 'consumable-row';
          row.innerHTML = `<div class="consumable-info"><div class="consumable-name">${ins.name} <span class="rarity-tag rarity-${ins.rarity}">${ins.rarity}</span></div><div class="consumable-desc">${ins.desc}</div></div>`;
          const btns = document.createElement('div'); btns.className = 'consumable-buttons';
          const cb = document.createElement('button'); cb.className = 'gold small'; cb.textContent = 'Carve (+10% lifespan use)';
          cb.onclick = () => { slotBodyInscription(id); render(); };
          btns.appendChild(cb); row.appendChild(btns); bP.appendChild(row);
        });
      } else {
        const none = document.createElement('div');
        none.className = 'consumable-desc';
        none.style.cssText = 'opacity:0.7';
        none.textContent = 'No unslotted inscriptions available to carve.';
        bP.appendChild(none);
      }
    }
    appendPanel(bP, 'self');
  }

  const cap = slotCapacity();
  let artHTML = `<h3>Artifact — ${weapon.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.85rem">${weapon.zh}</span>
    <span class="rarity-tag rarity-${weapon.rarity||'common'}">${weapon.rarity||'common'}</span></h3>
    <p style="font-size:0.85rem;color:var(--ink-soft);margin:0 0 0.4rem"><em>${weapon.desc}</em><br>base power ${weapon.power}${rb.weapon?` · +${rb.weapon} realm`:''}${mods.weaponBonus?` · +${mods.weaponBonus} inscription`:''}${wpnMult!==1?` · ×${wpnMult.toFixed(2)} tincture`:''} · <strong>total ${wpnPower}</strong></p>
    <div style="font-size:0.85rem;margin-bottom:0.3rem"><strong>Inscription Slots</strong> (${state.inscriptions.slotted.length}/${cap})</div>
    <div class="slot-row" id="slot-row"></div>`;
  if (state.inscriptions.owned.length) {
    artHTML += `<div style="font-size:0.85rem;margin-top:0.6rem"><strong>Owned Inscriptions</strong> — click to slot</div>
      <div class="owned-list" id="owned-list"></div>`;
  } else {
    artHTML += `<p style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.5rem;font-style:italic">No loose inscriptions. Victories may yield them.</p>`;
  }
  if (state.weapons.owned.length) {
    artHTML += `<div style="font-size:0.85rem;margin-top:0.8rem"><strong>Other Weapons</strong> — click to equip (inscriptions will unslot)</div>
      <div id="weapon-list"></div>`;
  }
  artP.innerHTML = artHTML;
  appendPanel(artP, 'forge');

  const slotRow = document.getElementById('slot-row');
  if (slotRow) {
    for (let i = 0; i < cap; i++) {
      const id = state.inscriptions.slotted[i];
      const slot = document.createElement('div');
      if (id) {
        const ins = INSCRIPTIONS[id];
        slot.className = 'slot filled tip';
        slot.setAttribute('data-tip', ins.desc);
        slot.innerHTML = `<div class="inscription-name">${ins.name} <span class="rarity-tag rarity-${ins.rarity}">${ins.rarity}</span></div>
          <div class="inscription-desc">${ins.desc}</div>
          <div style="font-size:0.7rem;color:var(--ink-soft);margin-top:0.1rem">click to unslot</div>`;
        slot.onclick = () => { unslotInscription(i); render(); };
      } else {
        slot.className = 'slot empty';
        slot.textContent = 'Empty slot';
      }
      slotRow.appendChild(slot);
    }
  }
  const ownedList = document.getElementById('owned-list');
  if (ownedList) {
    const slotFull = state.inscriptions.slotted.length >= cap;
    state.inscriptions.owned.forEach(id => {
      const ins = INSCRIPTIONS[id];
      const item = document.createElement('div');
      item.className = 'owned-item tip' + (slotFull ? ' no-slot' : '');
      item.setAttribute('data-tip', ins.desc);
      item.innerHTML = `<div class="inscription-name">${ins.name} <span class="rarity-tag rarity-${ins.rarity}">${ins.rarity}</span></div>
        <div class="inscription-desc">${ins.desc}</div>`;
      if (!slotFull) item.onclick = () => { slotInscription(id); render(); };
      ownedList.appendChild(item);
    });
  }
  const wList = document.getElementById('weapon-list');
  if (wList) {
    state.weapons.owned.forEach(id => {
      const w = WEAPONS[id];
      const item = document.createElement('div');
      item.className = 'weapon-card tip';

  lsRow.innerHTML = `<div class="consumable-info">
      <div class="consumable-name">Old-Age Death</div>
      <div class="consumable-desc">When ON, reaching your lifespan ends the life (old age → reincarnation, souls intact). When OFF, lifespan still shows but never kills you. Age only advances during active cultivation.</div>
    </div>`;
  const lsBtns = document.createElement('div'); lsBtns.className = 'consumable-buttons';
  const lsBtn = document.createElement('button');
  lsBtn.className = noDeath ? 'ghost' : 'gold';
  lsBtn.textContent = noDeath ? 'OFF — enable' : 'ON — disable';
  lsBtn.onclick = () => { if (!META.settings) META.settings = {}; META.settings.noAgeDeath = !META.settings.noAgeDeath; saveMeta(); render(); };
  lsBtns.appendChild(lsBtn); lsRow.appendChild(lsBtns); cfgP.appendChild(lsRow);
  appendPanel(buildConfigPanel(), 'config');  // unified: the in-game tab shows the same panel as the title screen
  const reBtn = document.getElementById('random-encounter');
  if (reBtn) {
    const wcd = walkCooldownLeft();
    if (wcd > 0) {
      reBtn.textContent = `Walk a Stretch (${Math.ceil(wcd / 60000)}m)`;
      reBtn.disabled = true;
    } else {
      reBtn.onclick = () => walkAStretch();
    }
  }

  const dz = document.createElement('div');
  dz.className = 'panel';
  dz.innerHTML = `<div class="button-row">
    <button class="ghost" id="restart">Abandon This Life</button>
  </div>
  <p style="font-size:0.75rem;color:var(--ink-soft);margin-top:0.4rem">Starts character creation from the beginning. Your saved character will be erased.</p>`;
  app.appendChild(dz);  // always visible (footer)
  armDestructiveButton(document.getElementById('restart'), 'Tap again to abandon - all progress lost', () => {
    localStorage.removeItem(charKey());
    state = null;
    if (cultivationTimer) { clearInterval(cultivationTimer); cultivationTimer = null; }
    render();
  });
}

function renderConsumableRow(id, c) {
  const row = document.createElement('div');
  row.className = 'consumable-row tip';
  row.setAttribute('data-tip', c.desc);
  const owned = state.base.consumables[id] || 0;
  const canMake = canCraft(id);
  const meetsReq = meetsRealmReq(c);
  const recipeText = Object.entries(effectiveRecipe(c)).map(([h, n]) => {
    const have = state.base.herbs[h] || 0;
    const short = have < n;
    return `<span style="color:${short?'var(--crimson)':'var(--ink)'}">${n}× ${HERBS[h].name} (${have})</span>`;
  }).join(', ');
  const reqLabel = c.minRealmTier
    ? `${REALMS[c.minRealmTier].name}${c.minLayer ? ' L' + c.minLayer : ''}`
    : '';
  const reqHTML = !meetsReq ? `<div class="consumable-desc" style="color:var(--crimson)">Requires ${reqLabel}.</div>` : '';

  const infoDiv = document.createElement('div');
  infoDiv.style.flex = '1 1 55%';
  infoDiv.innerHTML = `<div class="consumable-name">${c.name} <span style="color:var(--ink-soft);font-weight:normal;font-size:0.8rem">${c.zh}</span> <span class="rarity-tag rarity-${c.rarity}">${c.rarity}</span> ${owned ? `× <strong>${owned}</strong>` : ''}</div>
    <div class="consumable-desc">${c.desc}<br>Recipe: ${recipeText}</div>
    ${reqHTML}`;
  row.appendChild(infoDiv);

  const btns = document.createElement('div');
  btns.className = 'plot-buttons';
  const craftBtn = document.createElement('button');
  craftBtn.className = 'small';
  craftBtn.textContent = 'Craft';
  craftBtn.disabled = !canMake;
  craftBtn.onclick = () => { craft(id); render(); };
  btns.appendChild(craftBtn);
  const useBtn = document.createElement('button');
  useBtn.className = 'gold small';
  useBtn.textContent = 'Use';
  useBtn.disabled = !owned;
  useBtn.onclick = () => { consume(id); render(); };
  btns.appendChild(useBtn);
  row.appendChild(btns);
  return row;
}

// ============================================================
// Combat render
// ============================================================
function renderCombat() {
  const p = combat.player;

  const grid = document.createElement('div');
  grid.className = 'combat-grid';
  grid.appendChild(renderCombatant(p, 'player'));
  // v0.19 Phase 3: render every enemy in the encounter. Defeated enemies still show but dimmed,
  // so the player can see what they took down across the fight. Primary target gets a marker.
  combat.enemies.forEach((en, idx) => {
    const panel = renderCombatant(en, 'enemy');
    if (en.hp <= 0) panel.style.opacity = '0.45';
    if (en === combat.enemy) {
      const marker = document.createElement('div');
      marker.style.cssText = 'font-size:0.72rem;color:var(--gold);text-align:center;margin-top:-0.2rem';
      marker.textContent = '— primary target —';
      panel.appendChild(marker);
    }
    grid.appendChild(panel);
  });
  app.appendChild(grid);

  const logWrap = document.createElement('div');
  logWrap.className = 'panel';
  logWrap.style.padding = '0.6rem';
  const log = document.createElement('div');
  log.className = 'combat-log';
  log.id = 'combat-log';
  combat.log.forEach(l => {
    const div = document.createElement('div');
    div.className = 'line ' + (l.cls || '');
    div.textContent = l.text;
    log.appendChild(div);
  });
  logWrap.appendChild(log);
  app.appendChild(logWrap);
  setTimeout(() => { log.scrollTop = log.scrollHeight; }, 0);

  const aP = document.createElement('div');
  aP.className = 'panel';
  if (combat.over) {
    let endHTML = '';
    if (combat.victory && combat.rewards) {
      const r = combat.rewards;
      endHTML += `<p style="margin:0 0 0.5rem"><strong>+${r.insight} insight.</strong>`;
      const drops = r.drops || (r.drop ? [r.drop] : []);
      const weaponDrops = r.weaponDrops || (r.weaponDrop ? [r.weaponDrop] : []);
      const bookDrops = r.bookDrops || (r.bookDrop ? [r.bookDrop] : []);
      const armorDrops = r.armorDrops || (r.armorDrop ? [r.armorDrop] : []);
      drops.forEach(id => { const ins = INSCRIPTIONS[id]; if (ins) endHTML += ` You pocket a <strong style="color:var(--gold)">${ins.name}</strong>.`; });
      weaponDrops.forEach(id => { const w = WEAPONS[id]; if (w) endHTML += ` You claim the <strong style="color:var(--gold)">${w.name}</strong>.`; });
      armorDrops.forEach(id => { const ar = ARMOR[id]; if (ar) endHTML += ` Armor recovered: <strong style="color:var(--gold)">${ar.name}</strong>.`; });
      const artifactDrops = r.artifactDrops || [];
      artifactDrops.forEach(id => { const af = ARTIFACTS[id]; if (af) endHTML += ` Artifact recovered: <strong style="color:var(--gold)">${af.name}</strong>.`; });
      bookDrops.forEach(id => { const bk = SKILL_BOOKS[id]; if (bk) endHTML += ` You find a <strong style="color:var(--gold)">${bk.name}</strong> (${bk.rarity} skill book).`; });
      const mats = r.materialDrops || {};
      const matEntries = Object.entries(mats);
      if (matEntries.length) {
        const parts = matEntries.map(([id, n]) => `${n}× ${MATERIALS[id].name}`).join(', ');
        endHTML += ` You gather ${parts}.`;
      }
      endHTML += `</p>`;
    }
    // v0.67: manual re-venture — same loop auto-combat gets, as a button.
    const reLoc = (combat.victory && combat.ventureLocId) ? LOCATIONS.find(l => l.id === combat.ventureLocId) : null;
    const canReVenture = reLoc && locationUnlocked(reLoc);
    endHTML += `<div class="button-row">
      ${canReVenture ? '<button id="fight-again" class="gold">Fight Again</button>' : ''}
      <button id="end">${combat.victory ? 'Return Home' : 'Crawl Home'}</button>
    </div>`;
    aP.innerHTML = endHTML;
    app.appendChild(aP);
    if (canReVenture) {
      document.getElementById('fight-again').onclick = () => {
        const locId = combat.ventureLocId;
        initCombat(rollEncounter(reLoc), reLoc.cultivationMult || 1);
        if (combat) combat.ventureLocId = locId;
        render();
      };
    }
    document.getElementById('end').onclick = () => {
      if (state.cultivating) state.cultivating.lastTick = Date.now();
      else state.passiveTick = Date.now();
      combat = null;
      saveChar();
      render();
    };
    return;
  }

  const grid2 = document.createElement('div');
  grid2.className = 'actions-grid';

  const isSurvival = combat.tribulation && combat.tribulation.kind === 'survival';
  if (isSurvival) {
    const remaining = combat.tribulation.turns - combat.turn + 1;
    const banner = document.createElement('div');
    banner.style.cssText = 'grid-column: 1 / -1; background: rgba(184,134,11,0.15); border: 1px solid var(--gold); padding: 0.6rem; border-radius: 3px; font-size: 0.85rem; text-align: center;';
    banner.innerHTML = `<strong>Endurance Trial</strong> — survive <strong style="color:var(--gold)">${Math.max(0, remaining)}</strong> more turn${remaining === 1 ? '' : 's'}. Only Meditate is available.`;
    grid2.appendChild(banner);
  }

  // v0.24b: auto-combat toggle + status banner. Suppressed during tribulations
  // (tribulations are too important to trust to a half-mindful auto-strike).
  if (!isSurvival && !combat.tribulation) {
    tickAutoCombatReset();
    const ac = state.autoCombat || { active: false, dailyMinutes: 0 };
    const minutesLeft = Math.max(0, AUTO_DAILY_CAP_MIN - (ac.dailyMinutes || 0));
    const tierIdx = state.realm.tierIdx || 0;
    const penPct = Math.round(autoDamagePenalty(tierIdx) * 100);
    const banner = document.createElement('div');
    banner.style.cssText = 'grid-column: 1 / -1; background: rgba(58,42,28,0.4); border: 1px solid var(--ink-soft); padding: 0.45rem 0.6rem; border-radius: 3px; font-size: 0.78rem; display:flex;justify-content:space-between;align-items:center;gap:0.5rem;';
    const autoLoops = ac.active && combat.ventureLocId != null;
    const status = ac.active
      ? `<strong style="color:var(--gold)">Auto-combat ON</strong> — ${penPct === 0 ? 'no damage penalty' : '-' + penPct + '% strike damage'}, kills give 12.5% insight (vs 4x baseline). ${minutesLeft.toFixed(1)}m left today.${autoLoops ? ' Re-ventures this place on victory.' : ''}`
      : `Auto-combat: ${penPct === 0 ? 'no damage penalty' : '-' + penPct + '% strike damage'}, 12.5% insight, strikes only. ${minutesLeft.toFixed(1)}m left today.`;
    const btn = document.createElement('button');
    btn.className = 'small ' + (ac.active ? 'gold' : 'ghost');
    btn.textContent = ac.active ? 'Stop Auto' : 'Start Auto';
    btn.disabled = !ac.active && minutesLeft <= 0;
    btn.onclick = () => { setAutoCombat(!ac.active); render(); };
    banner.innerHTML = `<span>${status}</span>`;
    banner.appendChild(btn);
    grid2.appendChild(banner);
  }

  if (!isSurvival) {
    const strikeBtn = document.createElement('button');
    strikeBtn.className = 'action-btn basic tip';
    strikeBtn.setAttribute('data-tip', `Weapon strike — ${Math.round(p.weaponPower*1.5)} damage, +10 posture, no qi cost, no cooldown. Your reliable fallback and a solid posture builder.`);
    strikeBtn.innerHTML = `<span class="name">Strike</span><span class="meta">${Math.round(p.weaponPower*1.5)} dmg · free</span>`;
    strikeBtn.onclick = playerStrike;
    grid2.appendChild(strikeBtn);
  }

  const medBtn = document.createElement('button');
  medBtn.className = 'action-btn basic tip';
  const medAmount = Math.ceil(p.qiMax * 0.5 * p.mods.meditateMult);
  medBtn.setAttribute('data-tip', `Recover +${medAmount} qi immediately. Vulnerable: you take 60% more damage until next round.`);
  medBtn.innerHTML = `<span class="name">Meditate</span><span class="meta">+${medAmount} qi · vulnerable</span>`;
  medBtn.onclick = playerMeditate;
  grid2.appendChild(medBtn);

  if (!isSurvival) {
    p.loadout.forEach(tid => {
      const t = TECHNIQUES[tid];
      const cd = p.cooldowns[tid] || 0;
      const effCost = effectiveQiCost(p, t);
      const effHp = effectiveHpCost(p, t);
      const noQi = p.qi < effCost;
      const noHp = effHp && p.hp <= effHp;
      const disabled = cd > 0 || noQi || noHp;
      const btn = document.createElement('button');
      btn.className = 'action-btn tip';
      // v0.45: explicit single-target / AOE marker on every technique button.
      const isAoeBtn = t.target === 'aoe';
      btn.setAttribute('data-tip', `[${isAoeBtn ? 'AOE — hits every standing enemy at 70% damage' : 'Single-target'}] ${t.desc}`);
      const cdLabel = cd > 0 ? ` · cd ${cd}` : '';
      const hpLabel = effHp ? ` · ${effHp} hp` : '';
      const tgtLabel = isAoeBtn ? ' · AOE' : ' · ST';
      btn.innerHTML = `<span class="name">${t.name}</span><span class="meta">${effCost} qi${hpLabel}${tgtLabel}${cdLabel}</span>`;
      btn.disabled = disabled;
      btn.onclick = () => playerTechnique(tid);
      grid2.appendChild(btn);
    });
  }

  aP.appendChild(grid2);
  app.appendChild(aP);
}

function renderCombatant(c, side) {
  const panel = document.createElement('div');
  panel.className = 'combatant';
  const broken = c.broken > 0;
  // v0.45: all statuses render generically from STATUS_INFO (burn/poison/chill/shock/
  // sunder/mark/leech/entangle/silence/resonance/oathbound + the original drains).
  let effTags = (c.effects || []).map(ef => {
    const info = STATUS_INFO[ef.kind];
    if (!info) return '';
    const stackStr = (ef.stacks || 1) > 1 ? ` ×${ef.stacks}` : '';
    return `<span class="rarity-tag rarity-rare tip" data-tip="${escapeTip(info.tip(ef))}">${info.label}${stackStr} ${ef.turns}</span>`;
  }).join('');
  // v0.45: soul-broken marker (spirit pool emptied = +30% damage taken).
  if (c.spiritMax > 0 && c.spirit <= 0) {
    effTags += `<span class="rarity-tag rarity-legendary tip" data-tip="Soul-broken: spirit pool emptied — takes +30% damage from all sources.">soul-broken</span>`;
  }
  // v0.45: player-side passive/buff markers.
  if (side === 'player') {
    if (c.swordIntent > 0) effTags += `<span class="rarity-tag rarity-legendary tip" data-tip="Sword Intent: +${c.swordIntent * 8}% damage. Builds on technique hits; meditating resets it.">sword intent ${c.swordIntent}/${schoolKit().intentCap || 5}</span>`;
    if (c.buffs && c.buffs.dodgeTurns > 0) effTags += `<span class="rarity-tag rarity-legendary tip" data-tip="Mistwalk: +${Math.round((c.buffs.dodgeChance||0)*100)}% dodge for ${c.buffs.dodgeTurns} more round(s).">mistwalk ${c.buffs.dodgeTurns}</span>`;
    if (c.buffs && c.buffs.reflectTurns > 0) effTags += `<span class="rarity-tag rarity-legendary tip" data-tip="Avalanche Guard: +${Math.round((c.buffs.reflectPct||0)*100)}% of damage taken is reflected for ${c.buffs.reflectTurns} more round(s).">guard ${c.buffs.reflectTurns}</span>`;
    if (c.buffs && c.buffs.regrowthTurns > 0) effTags += `<span class="rarity-tag rarity-legendary tip" data-tip="Regrowth: healing ${Math.round((c.buffs.regrowthPct||0)*100)}% max HP per round for ${c.buffs.regrowthTurns} more round(s).">regrowth ${c.buffs.regrowthTurns}</span>`;
  }
  const brokenTag = broken
    ? `<span class="broken-banner tip" data-tip="Posture broken: qi damage to this combatant is doubled for ${c.broken} more turn${c.broken===1?'':'s'}.">Posture Broken — ${c.broken}</span>`
    : '';
  // Wave 1: five-element badge + (for the player) the live matchup vs the primary target.
  const elKey = c.element || (c.elements && c.elements[0]);
  const elStr = (c.elements && c.elements.length > 1) ? c.elements.map(elementLabel).join(' / ') : elementLabel(elKey);
  const elBadge = elKey ? `<span class="rarity-tag tip" data-tip="Five-Element affinity. Overcoming a foe's element: +${Math.round(ELEMENT_COUNTER_BONUS*100)}% damage. Being overcome: -${Math.round(ELEMENT_COUNTER_MALUS*100)}%.">${elStr}</span>` : '';
  let matchup = '';
  if (side === 'player' && combat && combat.enemy && combat.enemy.element && c.elements && c.elements.length) {
    const em = bestElementCounter(c.elements, combat.enemy.element);
    if (em > 1) matchup = `<span class="rarity-tag rarity-legendary tip" data-tip="Your element overcomes ${elementLabel(combat.enemy.element)} — +${Math.round((em-1)*100)}% damage to it.">≻ ${ELEMENT_NAME[combat.enemy.element]} +${Math.round((em-1)*100)}%</span>`;
    else if (em < 1) matchup = `<span class="rarity-tag rarity-rare tip" data-tip="${elementLabel(combat.enemy.element)} overcomes your element — ${Math.round((em-1)*100)}% damage to it.">≺ ${ELEMENT_NAME[combat.enemy.element]} ${Math.round((em-1)*100)}%</span>`;
  }
  panel.innerHTML = `
    <h3>
      <span>${c.name}</span>
      <span class="subtitle">${side === 'player' ? 'you' : 'enemy'}</span>
    </h3>
    ${(elBadge || matchup) ? `<div style="margin:0.2rem 0">${elBadge} ${matchup}</div>` : ''}
    ${broken ? `<div>${brokenTag}</div>` : ''}
    ${effTags ? `<div style="margin:0.2rem 0">${effTags}</div>` : ''}
    ${bar('HP', c.hp, c.hpMax, 'bar-hp', 'Body vitality. Reaches 0 = defeat.')}
    ${bar('Qi Shield', c.qi, c.qiMax, 'bar-qi', 'Absorbs damage before HP. Some techniques (direct HP, pierce) bypass it.')}
    ${bar('Spirit', c.spirit, c.spiritMax, 'bar-spirit', 'Mental/soul pool. Some techniques target it directly.')}
    ${bar('Posture', c.posture, c.postureMax, 'bar-posture' + (broken ? ' broken' : ''), 'Fill this bar to break the target: 3 turns of doubled qi damage.')}
  `;
  return panel;
}

function bar(label, cur, max, cls, tip) {
  const pct = max > 0 ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0;
  return `<div class="bar-wrap tip" data-tip="${escapeTip(tip)}">
    <div class="bar-label"><span>${label}</span><span>${Math.round(cur)} / ${max}</span></div>
    <div class="bar ${cls}"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

// ============================================================
// Save / load / migration
// ============================================================
function saveChar() {
  try { localStorage.setItem(charKey(), JSON.stringify(state)); } catch (e) {}
}
try {
  const saved = localStorage.getItem(charKey());
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed && parsed.confirmed) {
      if (!parsed.realm) parsed.realm = { tierIdx: 0, layer: 1, insight: 0 };
      if (!parsed.inscriptions) parsed.inscriptions = { owned: [], slotted: [] };
      if (!parsed.weapons) parsed.weapons = { owned: [] };
      if (parsed.cultivating === undefined) parsed.cultivating = null;
      if (parsed.passiveTick === undefined) parsed.passiveTick = Date.now();
      if (!parsed.base) parsed.base = newBase();
      if (!parsed.base.buffs) parsed.base.buffs = [];
      if (!parsed.base.materials) parsed.base.materials = {};
      if (!parsed.base.arrays) parsed.base.arrays = [];
      if (parsed.ascensions === undefined) parsed.ascensions = 0;
      if (!parsed.ascensionBoons) parsed.ascensionBoons = [];
      if (!parsed.skills) parsed.skills = [];
      if (!parsed.skillRanks) parsed.skillRanks = {};
      if (!parsed.foundBooks) parsed.foundBooks = [];
      if (!parsed.armor) parsed.armor = newArmorState();
      if (!parsed.armor.equipped) parsed.armor.equipped = newArmorState().equipped;
      if (!parsed.armor.owned) parsed.armor.owned = [];
      if (!parsed.childhood) {
        // Legacy save predates the childhood/destiny system. Grandfather as completed-empty;
        // statMods/flags/items are absent, so heritage offering and stats behave exactly as before.
        parsed.childhood = {
          step: 'complete', picks: {}, flags: [], statMods: {},
          items: { inscriptions: [], weapons: [], materials: {}, herbs: {} },
        };
      }
      if (!parsed.tribulationFails) parsed.tribulationFails = {};
      if (!parsed.artifacts) parsed.artifacts = { owned: [] };
      if (!parsed.artifacts.owned) parsed.artifacts.owned = [];
      if (!parsed.ui) parsed.ui = { forgeTab: 'weapons' };
      // v0.24a: migrate weapons.crafted (track forged-vs-scavenged provenance).
      // Pre-v0.24 saves: assume nothing is crafted yet — all currently-owned weapons
      // become "found", which is fair (we have no record either way).
      if (parsed.weapons && !parsed.weapons.crafted) parsed.weapons.crafted = [];
      // v0.24b: auto-combat state. dailyMinutes resets every 24h via tickAutoCombatReset.
      // Active flag intentionally NOT persisted across refresh — fresh load = fresh choice.
      if (!parsed.autoCombat) parsed.autoCombat = {
        active: false, dailyMinutes: 0, lastReset: Date.now(),
      };
      parsed.autoCombat.active = false;
      // v0.25: ramping death + lifetime insight tracking.
      if (parsed.realmDefeats == null) parsed.realmDefeats = 0;
      // Best-effort backfill for legacy saves: floor at current realm.insight; even
      // if low, the player won't feel cheated since they didn't earn the lifetime bonus.
      if (parsed.lifetimeInsight == null) parsed.lifetimeInsight = parsed.realm ? (parsed.realm.insight || 0) : 0;
      // Wave 1: five-element spirit root + foundation quality. Existing chars get an element
      // matching their school (no cultivation-speed change — grade 1.0, foundation 1.0).
      if (!parsed.spiritRoot) {
        const schoolEl = schoolElement(parsed.selectedSchool);
        parsed.spiritRoot = { elements: [schoolEl], element: schoolEl, grade: 1.0, gradeName: 'Common', dual: false };
      }
      if (parsed.foundationQuality == null) parsed.foundationQuality = 1.0;
      // Wave 1b: reserve stat points + weapon refine levels.
      if (parsed.freePoints == null) parsed.freePoints = 0;
      if (!parsed.freeAlloc) parsed.freeAlloc = Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
      if (!parsed.refine) parsed.refine = {};
      // Wave 1d: active-ability slots. Existing chars get their 4 base school techs as the active
      // set (preserves current combat behavior; bought techs become slottable, a buff not a nerf).
      if (!parsed.activeSkills) parsed.activeSkills = (SCHOOLS[parsed.selectedSchool] ? SCHOOLS[parsed.selectedSchool].techniques.slice() : []);
      // Wave 2a: destinies. Existing chars start with none and destinyPicks 0, so
      // availablePicks = tierIdx — they may immediately claim one destiny per realm already
      // reached (a fair catch-up; new chars accrue one pick per future breakthrough).
      if (!parsed.destinies) parsed.destinies = [];
      if (parsed.destinyPicks == null) parsed.destinyPicks = 0;
      // Wave 2b: sect economy.
      if (parsed.contribution == null) parsed.contribution = 0;
      if (parsed.contributionLifetime == null) parsed.contributionLifetime = 0;
      if (parsed.sectKills == null) parsed.sectKills = 0;
      if (parsed.lastOpportunity == null) parsed.lastOpportunity = 0;  // Wave 3a
      if (parsed.realmRun === undefined) parsed.realmRun = null;       // Wave 3b
      if (parsed.lastRealmRun == null) parsed.lastRealmRun = 0;
      // Wave 3c: lifespan + body-quench. Existing chars get a fresh age-16 clock (no retro-aging).
      if (parsed.age == null) parsed.age = 16;
      if (parsed.lifespanBonus == null) parsed.lifespanBonus = 0;
      if (parsed.bodyQuench == null) parsed.bodyQuench = 0;
      if (!parsed.settings) parsed.settings = { noAgeDeath: false };
      if (!parsed.bossKills) parsed.bossKills = {};  // v0.58 boss roster
      if (!parsed.bossCooldowns) parsed.bossCooldowns = {};  // v0.62 boss challenge cooldowns
      // v0.65: sect ramp x10 — migrate lifetime once so existing standing is preserved,
      // and seed the new EARNED rank from it (no one re-fights for a rank they held).
      if (!parsed.sectRampV65) {
        parsed.sectRampV65 = true;
        parsed.contributionLifetime = (parsed.contributionLifetime || 0) * 10;
        let idx = 0;
        for (let i = 0; i < SECT_RANKS.length; i++) if (parsed.contributionLifetime >= SECT_RANKS[i].at) idx = i;
        parsed.sectRank = idx;
      }
      if (parsed.sectRank == null) parsed.sectRank = 0;
      if (parsed.lastWalk == null) parsed.lastWalk = 0;
      if (parsed.heavenConquest == null) parsed.heavenConquest = 0;   // v0.71 conquest stages
      if (!parsed.bodyInscriptions) parsed.bodyInscriptions = [];      // v0.77 demonic flesh-carving
      if (parsed.lastRiftRun == null) parsed.lastRiftRun = 0;          // v0.77 Warped Rift-Gate
      if (parsed.riftRun === undefined) parsed.riftRun = null;
      // v0.61: demonic path flag. Existing demon_heart characters walked it all along.
      if (parsed.demonic == null) parsed.demonic = !!(SCHOOLS[parsed.selectedSchool] && SCHOOLS[parsed.selectedSchool].isDemon);
      // v0.56 FIX ("5th slot showing but not working"): techniques deleted/renamed in
      // updates (e.g. v0.51 lunar_sight -> stellar_pressure) left DEAD ids in saved
      // loadout/activeSkills. activeSkillsList silently filtered them from combat (4
      // buttons), but the panel counted raw activeSkills.length — "5/5" with a ghost
      // occupying the 5th slot, and the cap check refused to slot anything else.
      // Pass 1: map renamed ids forward. Pass 2: scrub ids that no longer exist.
      const TECH_RENAMES = { lunar_sight: 'stellar_pressure' };
      ['loadout', 'activeSkills'].forEach(k => {
        if (!Array.isArray(parsed[k])) return;
        parsed[k] = parsed[k]
          .map(tid => TECH_RENAMES[tid] || tid)
          .filter((tid, i, arr) => TECHNIQUES[tid] && arr.indexOf(tid) === i);
      });
      // v0.45: schools gained a 5th signature base technique — backfill it into existing
      // saves' loadout (and active set, base slots also grew 4 -> 5 so there's room).
      if (parsed.selectedSchool && SCHOOLS[parsed.selectedSchool] && Array.isArray(parsed.loadout)) {
        SCHOOLS[parsed.selectedSchool].techniques.forEach(tid => {
          if (!parsed.loadout.includes(tid)) parsed.loadout.push(tid);
          if (Array.isArray(parsed.activeSkills) && !parsed.activeSkills.includes(tid)
              && parsed.activeSkills.length < activeSlotsForRealm(parsed)) {
            parsed.activeSkills.push(tid);
          }
        });
      }
      applyDemonicLoadoutSwap(parsed);   // v0.70: existing demonic saves get the heretical signature
      state = parsed;
    }
  }
} catch (e) {}

if (state && state.confirmed) {
  offlineReport = applyOfflineGains();
  scheduleCultivationTick();
}

render();
</script>
