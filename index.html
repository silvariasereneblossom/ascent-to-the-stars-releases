const CHILDHOOD_STAGE_ORDER = ['birth', 'event', 'youth'];
const CHILDHOOD_OFFER_COUNT = 4;
const CHILDHOOD_STAGE_INFO = {
  birth: {
    title: 'Birth',
    heading: 'How did you come into the world?',
    flavor: 'Heaven scatters its omens like rain on a pond. You may not choose where they fall — only what you do when they touch you.',
  },
  event: {
    title: 'Childhood',
    heading: 'What did the years teach you?',
    flavor: 'A child is shaped less by lessons than by what they survive. Some scars never heal. Some never need to.',
  },
  youth: {
    title: 'Coming of Age',
    heading: 'And then — the day before everything changed.',
    flavor: 'Every cultivator can name the year they decided. For most, the choice came twice: once made, once accepted.',
  },
};

function newChildhoodState(seed) {
  const rng = makeRng(seed);
  return {
    step: 'birth',
    picks: {},
    flags: [],
    statMods: {},
    items: { inscriptions: [], weapons: [], materials: {}, herbs: {} },
    offer: rollChildhoodOffer('birth', [], rng),
  };
}

function rollChildhoodOffer(stage, _flags, rng) {
  // Weighted draw without replacement. Fatal beats carry 0.2x weight so they appear rarely
  // (~7% chance per offer of including any single fatal). Players still must pick one to die.
  const remaining = Object.keys(CHILDHOOD_BEATS[stage]).map(id => ({
    id, w: CHILDHOOD_BEATS[stage][id].fatal ? 0.2 : 1.0,
  }));
  const result = [];
  while (result.length < CHILDHOOD_OFFER_COUNT && remaining.length) {
    const total = remaining.reduce((a, b) => a + b.w, 0);
    let r = rng() * total;
    let idx = remaining.length - 1;
    for (let i = 0; i < remaining.length; i++) {
      r -= remaining[i].w;
      if (r <= 0) { idx = i; break; }
    }
    result.push(remaining[idx].id);
    remaining.splice(idx, 1);
  }
  return result;
}

function applyChildhoodBeatToState(st, stage, beatId) {
  const beat = CHILDHOOD_BEATS[stage][beatId];
  if (!beat) return;
  st.childhood.picks[stage] = beatId;
  if (beat.flag) st.childhood.flags.push(beat.flag);
  // statRanges: random roll per pick — never shown to the player. Same beat picked across runs
  // gives different stats. Risky beats span net-negative to net-very-positive.
  if (beat.statRanges) {
    Object.entries(beat.statRanges).forEach(([k, range]) => {
      const lo = range[0], hi = range[1];
      const rolled = Math.floor(Math.random() * (hi - lo + 1)) + lo;
      st.childhood.statMods[k] = (st.childhood.statMods[k] || 0) + rolled;
    });
  } else if (beat.statMods) {
    // Backward-compat for any beat that still uses fixed mods (none currently).
    Object.entries(beat.statMods).forEach(([k, v]) => {
      st.childhood.statMods[k] = (st.childhood.statMods[k] || 0) + v;
    });
  }
  if (beat.items) {
    if (beat.items.inscriptions) st.childhood.items.inscriptions.push(...beat.items.inscriptions);
    if (beat.items.weapons) st.childhood.items.weapons.push(...beat.items.weapons);
    if (beat.items.materials) {
      Object.entries(beat.items.materials).forEach(([id, n]) => {
        st.childhood.items.materials[id] = (st.childhood.items.materials[id] || 0) + n;
      });
    }
    if (beat.items.herbs) {
      Object.entries(beat.items.herbs).forEach(([id, n]) => {
        st.childhood.items.herbs[id] = (st.childhood.items.herbs[id] || 0) + n;
      });
    }
  }
}

function findBeatByFlag(flag) {
  for (const stage of CHILDHOOD_STAGE_ORDER) {
    for (const id of Object.keys(CHILDHOOD_BEATS[stage])) {
      if (CHILDHOOD_BEATS[stage][id].flag === flag) return CHILDHOOD_BEATS[stage][id];
    }
  }
  return null;
}

function pickHeritageBiased(rng, flags, rarity) {
  const pool = HERITAGES.filter(h => h.rarity === rarity);
  if (!pool.length) return null;
  const weights = pool.map(h => {
    let w = 1;
    flags.forEach(f => {
      const beat = findBeatByFlag(f);
      if (beat && beat.heritageBias && beat.heritageBias.includes(h.name)) w *= 3;
    });
    return w;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = rng() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function newPreCharacter(seed) {
  return { seed, confirmed: false, childhood: newChildhoodState(seed) };
}

function newCharacter(seed, childhood = null) {
  const rng = makeRng(seed);
  const baseStats = {};
  STAT_KEYS.forEach(k => { baseStats[k] = roll3d6(rng); });
  if (childhood && childhood.statMods) {
    Object.entries(childhood.statMods).forEach(([k, v]) => {
      if (STAT_KEYS.includes(k)) baseStats[k] = Math.max(3, baseStats[k] + v);
    });
  }

  const roll = rng();
  let pool, tier;
  if      (roll < 0.005) { pool = randInt(rng,35,50); tier = 'legend'; }
  else if (roll < 0.035) { pool = randInt(rng,20,30); tier = 'big'; }
  else if (roll < 0.185) { pool = randInt(rng,12,18); tier = 'spike'; }
  else                   { pool = randInt(rng, 5, 9); tier = 'normal'; }

  const flags = childhood ? (childhood.flags || []) : [];
  const commons = HERITAGES.filter(h => h.rarity === 'common');
  const pickCommon = arr => arr[Math.floor(rng() * arr.length)];
  const offered = [];
  offered.push(pickCommon(commons));
  let second = pickCommon(commons);
  while (second === offered[0]) second = pickCommon(commons);
  offered.push(second);
  const rareRoll = rng();
  if (rareRoll < 0.015)      offered.push(pickHeritageBiased(rng, flags, 'divine'));
  else if (rareRoll < 0.095) offered.push(pickHeritageBiased(rng, flags, 'legendary'));
  else                        offered.push(pickHeritageBiased(rng, flags, 'rare'));

  const childhoodCopy = childhood ? {
    step: 'complete',
    picks: { ...(childhood.picks || {}) },
    flags: (childhood.flags || []).slice(),
    statMods: { ...(childhood.statMods || {}) },
    items: childhood.items ? {
      inscriptions: (childhood.items.inscriptions || []).slice(),
      weapons: (childhood.items.weapons || []).slice(),
      materials: { ...(childhood.items.materials || {}) },
      herbs: { ...(childhood.items.herbs || {}) },
    } : { inscriptions: [], weapons: [], materials: {}, herbs: {} },
  } : null;

  return {
    seed, baseStats, pool, poolTier: tier,
    allocation: Object.fromEntries(STAT_KEYS.map(k => [k, 0])),
    heritages: offered,
    selectedHeritage: null,
    selectedSchool: null,
    rerollsLeft: 3,
    name: '',
    confirmed: false,
    realm: { tierIdx: 0, layer: 1, insight: 0 },
    inscriptions: { owned: [], slotted: [] },
    weapons: { owned: [], crafted: [] },
    armor: newArmorState(),
    cultivating: null,
    passiveTick: Date.now(),
    base: newBase(),
    ascensions: 0,
    ascensionBoons: [],
    skills: [],
    skillRanks: {},
    foundBooks: [],
    childhood: childhoodCopy,
    tribulationFails: {},
    artifacts: { owned: [] },
    ui: { forgeTab: 'weapons' },
    autoCombat: { active: false, dailyMinutes: 0, lastReset: Date.now() },
    // v0.25: realmDefeats resets on breakthrough; first 5 defeats per realm are free,
    // each subsequent defeat adds 2.5% perma-death chance. lifetimeInsight tracks
    // every insight gain — feeds the reincarnation bonus (15% of lifetime).
    realmDefeats: 0,
    lifetimeInsight: 0,
    // Wave 1: spirit root (element drives combat counters; grade is a gentle cult mult)
    // + foundation quality (gentle, upside-only multiplier improved at each breakthrough).
    spiritRoot: rollSpiritRoot(rng),
    foundationQuality: 1.0,
    // Wave 1b: Hero's-Adventure reserve stat points (banked, respec-friendly) + per-weapon
    // refine levels (own-many, invest in favorites).
    freePoints: 0,
    freeAlloc: Object.fromEntries(STAT_KEYS.map(k => [k, 0])),
    refine: {},
    // Wave 1d: active-ability slots (combat-usable subset of the loadout; cap grows by realm).
    activeSkills: [],
    // Wave 2a: destinies picked at breakthroughs (per-life). destinyPicks counts picks made
    // (so chain "replaces" upgrades don't grant free extra picks).
    destinies: [],
    destinyPicks: 0,
    // Wave 2b: sect economy (per-life). contribution = spendable; lifetime sets rank; sectKills
    // tracks the hunt bounty.
    contribution: 0,
    contributionLifetime: 0,
    sectKills: 0,
  };
}

// v0.25: single-site insight increment so lifetime tracking stays in sync.
// Boon/skill/heritage one-shots that nudge insight directly still bypass this — those
// are small enough that the slight under-count of lifetime doesn't matter for the
// 15% reincarnation bonus.
function addInsight(amount) {
  if (!state || !state.realm) return;
  state.realm.insight += amount;
  state.lifetimeInsight = (state.lifetimeInsight || 0) + amount;
}

function newArmorState() {
  return {
    owned: [],
    equipped: { helmet: null, chest: null, gloves: null, boots: null, accessory1: null, accessory2: null },
  };
}

function finalStats(st) {
  const h = st.selectedHeritage != null ? st.heritages[st.selectedHeritage].mods : {};
  const out = {};
  // Heritage latent tier bonus (e.g. Hidden Dragon awakens at Core Formation)
  let latent = 0;
  if (st.selectedHeritage != null) {
    const hname = st.heritages[st.selectedHeritage].name;
    const mech = HERITAGE_MECHANICS[hname];
    if (mech && mech.latentStatsTier && st.realm && st.realm.tierIdx >= mech.latentStatsTier.tier) {
      latent = mech.latentStatsTier.value;
    }
  }
  STAT_KEYS.forEach(k => {
    const v = st.baseStats[k] + st.allocation[k] + (h[k] || 0) + latent + ((st.freeAlloc && st.freeAlloc[k]) || 0);
    out[k] = Math.max(6, v);
  });
  return out;
}

const allocated = st => STAT_KEYS.reduce((a,k) => a + st.allocation[k], 0);

// Wave 1b: reserve stat points (Hero's-Adventure "reserve XP pool" — banked, allocate later,
// respec freely). Earned on each tier breakthrough; spent into the 6 stats; fully refundable.
const REALM_FREE_POINTS = 3;
function allocFreePoint(statKey, delta) {
  if (!state) return;
  if (!state.freeAlloc) state.freeAlloc = Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
  if (!STAT_KEYS.includes(statKey)) return;
  if (delta > 0) {
    if ((state.freePoints || 0) <= 0) return;
    state.freePoints--; state.freeAlloc[statKey] = (state.freeAlloc[statKey] || 0) + 1;
  } else {
    if ((state.freeAlloc[statKey] || 0) <= 0) return;
    state.freeAlloc[statKey]--; state.freePoints = (state.freePoints || 0) + 1;
  }
  if (state.confirmed) state.finalStats = finalStats(state);
  saveChar();
}
function respecFreePoints() {
  if (!state || !state.freeAlloc) return;
  let returned = 0;
  STAT_KEYS.forEach(k => { returned += state.freeAlloc[k] || 0; state.freeAlloc[k] = 0; });
  state.freePoints = (state.freePoints || 0) + returned;
  if (state.confirmed) state.finalStats = finalStats(state);
  saveChar();
}

// ============================================================
// Active buffs (from pills/potions)
// ============================================================
function cleanupBuffs() {
  if (!state || !state.base) return;
  const now = Date.now();
  state.base.buffs = state.base.buffs.filter(b => b.expiresAt > now);
}

function activeBuffValue(kind, defaultValue) {
  if (!state || !state.base) return defaultValue;
  cleanupBuffs();
  const b = state.base.buffs.find(x => x.kind === kind);
  return b ? b.value : defaultValue;
}

// ============================================================
// Realm helpers
// ============================================================
// v0.21: realm gates weapon and artifact slot counts. Mortal: 1 of each. Each tier above
// adds one slot, capping at 6 (so NS+SS share the same cap).
function weaponSlotsForRealm(char) {
  const tierIdx = (char && char.realm) ? char.realm.tierIdx : 0;
  return Math.min(6, 1 + tierIdx);
}
function artifactSlotsForRealm(char) {
  const tierIdx = (char && char.realm) ? char.realm.tierIdx : 0;
  return Math.min(6, 1 + tierIdx);
}

// Auto-equipped weapons. Primary first (state.weapon), then highest-power owned weapons fill
// the remaining slots up to the realm-gated cap. Secondaries contribute 0.75x of their base
// power (computed inside initCombat) plus their inscription effects.
function equippedWeapons(char) {
  if (!char || !char.weapons) return [];
  const max = weaponSlotsForRealm(char);
  const primary = char.weapon;
  const owned = (char.weapons.owned || []).slice();
  const secondaries = owned
    .filter(id => id !== primary && WEAPONS[id])
    .sort((a, b) => (WEAPONS[b].power || 0) - (WEAPONS[a].power || 0));
  return [primary, ...secondaries.slice(0, Math.max(0, max - 1))].filter(Boolean);
}

// Sum of (0.75 * power) across non-primary equipped weapons. Used by initCombat weaponPower calc.
function secondaryWeaponPowerBonus(char) {
  const eq = equippedWeapons(char);
  if (eq.length <= 1) return 0;
  return eq.slice(1).reduce((sum, wid) => {
    const w = WEAPONS[wid];
    return sum + (w ? Math.round(w.power * 0.75) : 0);
  }, 0);
}

// Wave 1b: weapon refinement (Hero's-Adventure "own many, invest in favorites"). Gentle —
// NO failure, NO destruction. Each level adds REFINE_WEAPON_PCT of the weapon's base power
// (secondaries at 0.75x, matching the secondary-power rule). Cost scales with level + rarity.
const REFINE_WEAPON_PCT = 0.08;
const REFINE_CAP = 10;
const REFINE_RARITY_MULT = { common: 1, rare: 2, legendary: 4, divine: 8 };
function refineCost(wid, lvl) {
  const w = WEAPONS[wid];
  const next = (lvl || 0) + 1;
  const rm = (w && REFINE_RARITY_MULT[w.rarity]) || 1;
  return { spirit_iron: next * 2 * rm, spirit_stone: Math.max(1, Math.ceil(next * rm * 0.5)) };
}
function canRefine(wid) {
  if (!WEAPONS[wid]) return false;
  const lvl = (state.refine && state.refine[wid]) || 0;
  if (lvl >= REFINE_CAP) return false;
  const cost = refineCost(wid, lvl);
  return Object.entries(cost).every(([m, n]) => (state.base.materials[m] || 0) >= n);
}
function refineWeapon(wid) {
  if (!canRefine(wid)) return;
  const lvl = (state.refine && state.refine[wid]) || 0;
  const cost = refineCost(wid, lvl);
  Object.entries(cost).forEach(([m, n]) => {
    state.base.materials[m] = (state.base.materials[m] || 0) - n;
    if (state.base.materials[m] <= 0) delete state.base.materials[m];
  });
  if (!state.refine) state.refine = {};
  state.refine[wid] = lvl + 1;
  saveChar();
}
// Total refine power bonus from currently-equipped weapons (primary full, secondaries 0.75x).
function refineWeaponBonus(char) {
  const eq = equippedWeapons(char);
  if (!eq.length) return 0;
  let bonus = 0;
  eq.forEach((wid, idx) => {
    const w = WEAPONS[wid];
    const lvl = (char.refine && char.refine[wid]) || 0;
    if (!w || !lvl) return;
    const per = w.power * REFINE_WEAPON_PCT * lvl;
    bonus += idx === 0 ? per : per * 0.75;
  });
  return Math.round(bonus);
}

// Auto-equipped artifacts. Highest "power" (sum of mod magnitudes as a tie-breaker) up to
// realm-gated cap. Artifacts are passive — their mods feed into computeMods.
function equippedArtifacts(char) {
  if (!char || !char.artifacts) return [];
  const max = artifactSlotsForRealm(char);
  const owned = (char.artifacts.owned || []).filter(id => ARTIFACTS[id]);
  const score = id => {
    const a = ARTIFACTS[id];
    if (!a || !a.mods) return 0;
    return Object.values(a.mods).reduce((s, v) => s + Math.abs(typeof v === 'number' ? v : 0), 0);
  };
  return owned.slice().sort((a, b) => score(b) - score(a)).slice(0, max);
}

function realmBonusFor(char) {
  let hp = 0, qi = 0, weapon = 0;
  for (let i = 0; i <= char.realm.tierIdx; i++) {
    const tier = REALMS[i];
    const layers = (i < char.realm.tierIdx) ? tier.layers : char.realm.layer;
    hp += tier.hpBonus * layers;
    qi += tier.qiBonus * layers;
    weapon += tier.weaponBonus * layers;
  }
  return { hp, qi, weapon };
}

// v0.14: enemies scale with where the player is within their current realm tier.
// 1.0x at layer 1, max-layer multiplier scales by realm tier so high-realm enemies keep up with
// player power growth from multi-weapons + artifacts.
//   Mortal/QC/FE (tier 0-2): 1x to 4x  (unchanged from v0.14)
//   CF (3): 1x to 4.75x
//   GC (4): 1x to 5.5x
//   NS (5): 1x to 6.25x
//   SS (6): 1x to 7x
// Insight reward stays gentler (1.0x to 2.0x) so the cost doesn't compound brutally with HP.
function playerLayerScale(char) {
  const tier = REALMS[char.realm.tierIdx];
  if (!tier || tier.layers <= 1) return { stats: 1.0, reward: 1.0 };
  const t = (char.realm.layer - 1) / (tier.layers - 1);
  const tierBoost = 1 + 0.25 * Math.max(0, char.realm.tierIdx - 2);
  return { stats: 1.0 + 3.0 * t * tierBoost, reward: 1.0 + 1.0 * t };
}

function advanceInfo(char) {
  const tier = REALMS[char.realm.tierIdx];
  if (char.realm.layer < tier.layers) {
    const nextLayer = char.realm.layer + 1;
    const cost = tier.insightPerLayer + char.realm.layer * (tier.insightPerLayerStep || 0);
    return { kind: 'within', cost, label: `${tier.name} Layer ${nextLayer}` };
  }
  const next = REALMS[char.realm.tierIdx + 1];
  if (next) return { kind: 'breakthrough', cost: next.insightPerLayer, label: `Break into ${next.name}` };
  return null;
}

function realmLabel(char) {
  const tier = REALMS[char.realm.tierIdx];
  if (tier.layers === 1) return tier.name;
  return `${tier.name}, Layer ${char.realm.layer}`;
}

function tryAdvanceRealm() {
  const info = advanceInfo(state);
  if (!info || state.realm.insight < info.cost) return false;
  const preInsight = state.realm.insight;  // Wave 1: captured before deduction for foundation-quality calc

  // Tribulation check on realm transitions (demon school is not judged by the heavens)
  const currentSchool = SCHOOLS[state.selectedSchool];
  if (info.kind === 'breakthrough' && !(currentSchool && currentSchool.isDemon)) {
    const fromTier = state.realm.tierIdx;
    const toTier = fromTier + 1;
    const trib = findTribulation(fromTier, toTier);
    if (trib) {
      pendingTribulation = { targetTier: toTier, cost: info.cost };
      initCombat(trib.enemyId);
      combat.tribulation = { kind: trib.kind, turns: trib.turns || 0 };
      if (trib.kind === 'survival') {
        pushLog('posture', `Survive ${trib.turns} turns. You cannot strike this trial.`);
      } else {
        pushLog('posture', `A tribulation stands between you and the next realm. Win, or try again later.`);
      }
      return true;
    }
  }

  state.realm.insight -= info.cost;
  if (info.kind === 'within') {
    state.realm.layer++;
  } else {
    state.realm.tierIdx++;
    state.realm.layer = 1;
    // v0.25: breakthrough resets the defeat counter — fresh realm, fresh slate.
    state.realmDefeats = 0;
    // Wave 1: gentle "foundation quality" — a permanent, upside-only cultivation multiplier.
    // Better prep (over-cultivating past the cost, a cultivation buff active, a fine spirit
    // root) yields a higher foundation; a rushed breakthrough is NEVER penalized (floor 1.0).
    // Stored as a running max so it only ever improves — the opposite of ACS's brutal gate.
    const surplusRatio = info.cost > 0 ? Math.min(1, (preInsight - info.cost) / info.cost) : 0;
    const buffBonus = activeBuffValue('cultivation_mult', 1) > 1 ? 0.05 : 0;
    const rootBonus = (((state.spiritRoot && state.spiritRoot.grade) || 1) - 1) * 0.5;
    let q = 1.0 + surplusRatio * 0.20 + buffBonus + rootBonus;
    q = Math.min(1.30, Math.max(1.0, q));
    state.foundationQuality = Math.max(state.foundationQuality || 1.0, q);
    state.lastFoundationRoll = q;
    // Wave 1b: award reserve stat points on each tier breakthrough.
    state.freePoints = (state.freePoints || 0) + REALM_FREE_POINTS;
    // Recompute finalStats in case a heritage latent bonus kicks in at this tier.
    if (state.confirmed) state.finalStats = finalStats(state);
  }
  saveChar();
  return true;
}

// v0.22: realm-gated techniques are no longer auto-unlocked on breakthrough — they have to be
// bought from the Market tab's Wandering Master for spirit stones. realm met + cost paid.
// Existing loadout entries are grandfathered (free for v0.21 saves where techs auto-added).
function buyTechnique(techId) {
  if (!state || !state.confirmed) return false;
  const tech = TECHNIQUES[techId];
  if (!tech) return false;
  if (tech.school !== state.selectedSchool) return false;
  const min = tech.minRealmTier || 0;
  if (min === 0) return false;  // base techs aren't for sale; they're starter-given
  if (state.realm.tierIdx < min) return false;
  if (state.loadout.includes(techId)) return false;
  const cost = tech.cost || 0;
  if ((state.base.materials.spirit_stone || 0) < cost) return false;
  state.base.materials.spirit_stone -= cost;
  state.loadout.push(techId);
  // Wave 1d: auto-slot the new technique into an Active Ability slot if one's free.
  if (!state.activeSkills) state.activeSkills = [];
  if (state.activeSkills.length < activeSlotsForRealm(state) && !state.activeSkills.includes(techId)) {
    state.activeSkills.push(techId);
  }
  saveChar();
  return true;
}

// Wave 1d: Active Ability slots. Combat uses your slotted ACTIVE set (a subset of the loadout
// library), and the cap grows with realm (+1 at Golden Core, +1 at Nascent Soul). This also
// makes bought realm-gated techniques actually usable — initCombat previously used only the 4
// base school techniques, so purchased techs never reached combat.
function activeSlotsForRealm(char) {
  const t = (char && char.realm && char.realm.tierIdx) || 0;
  return 4 + (t >= 4 ? 1 : 0) + (t >= 5 ? 1 : 0);  // base 4; +1 Golden Core (tier 4); +1 Nascent Soul (tier 5)
}
function activeSkillsList(char) {
  const cap = activeSlotsForRealm(char);
  let arr = (char.activeSkills || []).filter(tid => TECHNIQUES[tid] && (char.loadout || []).includes(tid));
  arr = arr.filter((tid, i) => arr.indexOf(tid) === i);  // dedupe
  if (!arr.length) {
    const school = SCHOOLS[char.selectedSchool];
    arr = school ? school.techniques.slice() : [];   // safety fallback so combat is never empty
  }
  return arr.slice(0, cap);
}
function toggleActiveSkill(tid) {
  if (!state.activeSkills) state.activeSkills = [];
  if (!TECHNIQUES[tid] || !(state.loadout || []).includes(tid)) return;
  const i = state.activeSkills.indexOf(tid);
  if (i >= 0) state.activeSkills.splice(i, 1);
  else {
    if (state.activeSkills.length >= activeSlotsForRealm(state)) return;  // cap enforced
    state.activeSkills.push(tid);
  }
  saveChar();
}

function computeMaxHP(char) {
  // v0.23: HP cushion +40% vs v0.22 — base, body coefficient, and per-realm hpBonus
  // each scaled together so tier curve stays the same shape, just taller.
  const base = 63 + char.finalStats.body * 7 + Math.round(realmBonusFor(char).hp * 1.4);
  const mods = computeMods(char);
  return base + activeBuffValue('hp_max_add', 0) + boonHPAdd() + skillHPAdd() + (mods.hpBonus || 0) + metaHPAdd();
}
function computeMaxQi(char) {
  const mods = computeMods(char);
  return 25 + char.finalStats.spirit * 4 + realmBonusFor(char).qi + (mods.qiBonus || 0);
}
function computeMaxSpirit(char) {
  const mods = computeMods(char);
  return 12 + char.finalStats.sense * 2 + (mods.spiritBonus || 0);
}

// ============================================================
// Inscription helpers
// ============================================================
function rollInscriptionDrop() {
  if (Math.random() >= 0.45) return null;
  const pool = Object.keys(INSCRIPTIONS);
  const common = pool.filter(id => INSCRIPTIONS[id].rarity === 'common');
  const rare = pool.filter(id => INSCRIPTIONS[id].rarity === 'rare');
  const pickRare = Math.random() < 0.35;
  const source = pickRare && rare.length ? rare : common;
  return source[Math.floor(Math.random() * source.length)];
}

function slotCapacity() {
  const w = WEAPONS[state.weapon];
  return w ? (w.slots || 2) : 2;
}

function slotInscription(id) {
  if (!state.inscriptions.owned.includes(id)) return;
  if (state.inscriptions.slotted.length >= slotCapacity()) return;
  state.inscriptions.slotted.push(id);
  state.inscriptions.owned.splice(state.inscriptions.owned.indexOf(id), 1);
  saveChar();
}

function unslotInscription(idx) {
  const id = state.inscriptions.slotted[idx];
  if (!id) return;
  state.inscriptions.slotted.splice(idx, 1);
  state.inscriptions.owned.push(id);
  saveChar();
}

// ============================================================
// Weapon helpers
// ============================================================
function equipWeapon(id) {
  if (!WEAPONS[id]) return;
  if (id === state.weapon) return;
  if (!state.weapons.owned.includes(id)) return;

  const current = state.inscriptions.slotted.slice();
  state.inscriptions.slotted = [];
  state.inscriptions.owned.push(...current);

  if (state.weapon && !state.weapons.owned.includes(state.weapon)) {
    state.weapons.owned.push(state.weapon);
  }
  const idx = state.weapons.owned.indexOf(id);
  if (idx >= 0) state.weapons.owned.splice(idx, 1);

  state.weapon = id;
  saveChar();
}

// ============================================================
// Garden functions
// ============================================================
// v0.16: grow time = base × HERB_GROW_BASE_MULT (3), capped at 2 hours, then × heritage/skill mods.
// The herb's intrinsic tier — already encoded in HERBS[id].growMinutes (commons in single digits,
// divines in the hundreds) — is the only knob. Higher-tier herbs naturally hit the 2-hour cap and
// stay there, while commons remain quick. The cap matches the cultivation offline cap so a
// steady-state idle producer cycles at most every 2 hours regardless of what's planted.
const HERB_GROW_BASE_MULT = 3;
const HERB_GROW_CAP_SEC = 2 * 60 * 60;

function effectiveGrowSeconds(herbId) {
  const herb = HERBS[herbId];
  if (!herb) return 0;
  const capped = Math.min(HERB_GROW_CAP_SEC, herb.growMinutes * 60 * HERB_GROW_BASE_MULT);
  const hm = heritageMech();
  const speedMult = skillPlantSpeedMult() * (hm.herbGrowMult || 1);  // <1 = faster
  return Math.max(1, capped * speedMult);
}

function plotRemainingSec(plot) {
  if (!plot.herb) return 0;
  const cycle = effectiveGrowSeconds(plot.herb);
  return Math.max(0, cycle - (Date.now() - plot.plantedAt) / 1000);
}

function plotReady(plot) {
  return plot.herb && plotRemainingSec(plot) <= 0;
}

function plantHerb(plotIdx, herbId) {
  const plot = state.base.plots[plotIdx];
  if (!plot || plot.herb) return;
  if (!HERBS[herbId]) return;
  plot.herb = herbId;
  plot.plantedAt = Date.now();
  saveChar();
}

// Manual harvest button. Grants any complete cycles, then auto-replants the same herb so the plot
// keeps producing without further input. Returns true if anything changed.
function harvestPlot(plotIdx) {
  const plot = state.base.plots[plotIdx];
  if (!plot || !plot.herb) return false;
  const cycles = collectPlotCycles(plot);
  if (cycles > 0) saveChar();
  return cycles > 0;
}

// Single-source-of-truth herb harvest: if any complete cycles have elapsed since plot.plantedAt,
// add that many herbs to inventory and advance plantedAt by the consumed time. Same herb stays
// planted (auto-replant). Used by the cultivation tick AND by manual harvest.
function collectPlotCycles(plot) {
  if (!plot.herb) return 0;
  const cycleSec = effectiveGrowSeconds(plot.herb);
  if (cycleSec <= 0) return 0;
  const elapsedSec = (Date.now() - plot.plantedAt) / 1000;
  if (elapsedSec < cycleSec) return 0;
  const cycles = Math.floor(elapsedSec / cycleSec);
  state.base.herbs[plot.herb] = (state.base.herbs[plot.herb] || 0) + cycles;
  plot.plantedAt += cycles * cycleSec * 1000;
  return cycles;
}

function uprootPlot(plotIdx) {
  const plot = state.base.plots[plotIdx];
  if (!plot || !plot.herb) return;
  // Grant any pending cycles before uprooting so the player isn't punished for switching herbs.
  collectPlotCycles(plot);
  plot.herb = null;
  plot.plantedAt = 0;
  saveChar();
}

function meetsRealmReq(def) {
  if (def.minRealmTier == null) return true;
  if (state.realm.tierIdx < def.minRealmTier) return false;
  if (state.realm.tierIdx === def.minRealmTier && def.minLayer != null && state.realm.layer < def.minLayer) return false;
  return true;
}

function canCraft(recipeId) {
  const c = CONSUMABLES[recipeId];
  if (!c) return false;
  if (!meetsRealmReq(c)) return false;
  for (const [herb, count] of Object.entries(c.recipe)) {
    if ((state.base.herbs[herb] || 0) < count) return false;
  }
  return true;
}

// v0.24a: weapon-recipe material costs scaled by this constant. Recipe definitions
// stay readable as "designed costs"; this is the only number to change for tuning.
// Armor recipes are NOT scaled — gating armor would block the rebalanced player-HP curve.
const WEAPON_MAT_COST_MULT = 4;

function effectiveWeaponRecipeCost(recipe) {
  const out = {};
  Object.entries(recipe.materials).forEach(([mat, count]) => { out[mat] = count * WEAPON_MAT_COST_MULT; });
  return out;
}

function canForge(recipe) {
  if (!meetsRealmReq(recipe)) return false;
  const isWeaponRecipe = WEAPONS[recipe.id] !== undefined;
  const costs = isWeaponRecipe ? effectiveWeaponRecipeCost(recipe) : recipe.materials;
  for (const [mat, count] of Object.entries(costs)) {
    if ((state.base.materials[mat] || 0) < count) return false;
  }
  return true;
}

function craftArtifact(recipe) {
  if (!canForge(recipe)) return;
  if (state.weapons.owned.includes(recipe.id) || recipe.id === state.weapon) return;
  const costs = effectiveWeaponRecipeCost(recipe);
  for (const [mat, count] of Object.entries(costs)) {
    state.base.materials[mat] -= count;
    if (state.base.materials[mat] <= 0) delete state.base.materials[mat];
  }
  state.weapons.owned.push(recipe.id);
  // v0.24a: track that this id was crafted (vs found). UI shows a Crafted badge.
  if (!state.weapons.crafted) state.weapons.crafted = [];
  if (!state.weapons.crafted.includes(recipe.id)) state.weapons.crafted.push(recipe.id);
  saveChar();
}

function craftArmor(recipe) {
  if (!canForge(recipe)) return;
  const ar = ARMOR[recipe.id];
  if (!ar) return;
  for (const [mat, count] of Object.entries(recipe.materials)) {
    state.base.materials[mat] -= count;
    if (state.base.materials[mat] <= 0) delete state.base.materials[mat];
  }
  state.armor.owned.push(recipe.id);
  saveChar();
}

function equipArmor(slot, id) {
  if (!state.armor) state.armor = newArmorState();
  const piece = ARMOR[id];
  if (!piece) return;
  // Accessories pieces have slot === 'accessory' but equip slots are 'accessory1'/'accessory2'.
  const valid = piece.slot === 'accessory'
    ? (slot === 'accessory1' || slot === 'accessory2')
    : piece.slot === slot;
  if (!valid) return;
  if (!armorSlotsUnlocked(state).includes(slot)) return;
  // Take the piece out of owned pool.
  const idx = state.armor.owned.indexOf(id);
  if (idx < 0) return;
  state.armor.owned.splice(idx, 1);
  // Return whatever was equipped to the owned pool.
  const prev = state.armor.equipped[slot];
  if (prev) state.armor.owned.push(prev);
  state.armor.equipped[slot] = id;
  saveChar();
}

function unequipArmor(slot) {
  if (!state.armor) return;
  const prev = state.armor.equipped[slot];
  if (!prev) return;
  state.armor.owned.push(prev);
  state.armor.equipped[slot] = null;
  saveChar();
}

function craft(recipeId) {
  if (!canCraft(recipeId)) return;
  const c = CONSUMABLES[recipeId];
  for (const [herb, count] of Object.entries(c.recipe)) {
    state.base.herbs[herb] -= count;
    if (state.base.herbs[herb] <= 0) delete state.base.herbs[herb];
  }
  state.base.consumables[recipeId] = (state.base.consumables[recipeId] || 0) + 1;
  saveChar();
}

function consume(recipeId) {
  if (!state.base.consumables[recipeId]) return;
  state.base.consumables[recipeId]--;
  if (state.base.consumables[recipeId] <= 0) delete state.base.consumables[recipeId];
  const c = CONSUMABLES[recipeId];
  const now = Date.now();
  c.effects.forEach(ef => {
    if (ef.kind === 'stat_perm') {
      state.finalStats[ef.statKey] = (state.finalStats[ef.statKey] || 0) + ef.value;
      return;
    }
    if (ef.kind === 'stat_perm_all') {
      STAT_KEYS.forEach(k => { state.finalStats[k] = (state.finalStats[k] || 0) + ef.value; });
      return;
    }
    // Timed buff
    state.base.buffs = state.base.buffs.filter(b => b.kind !== ef.kind);
    state.base.buffs.push({
      kind: ef.kind,
      value: ef.value,
      expiresAt: now + ef.durationMin * 60000,
      sourceName: c.name,
    });
  });
  saveChar();
}

// ============================================================
// Cultivation helpers
// ============================================================
function cultivationRate() {
  if (!state || !state.confirmed) return 0;
  const method = getCultivationMethod();
  const fs = state.finalStats;
  const base = 0.015;
  let statBonus = fs.spirit * 0.0012 + fs.mind * 0.0006;
  if (method.scales === 'spirit') statBonus += fs.spirit * 0.0018;
  if (method.scales === 'body')   statBonus += fs.body   * 0.0018;
  if (method.scales === 'mind')   statBonus += fs.mind   * 0.0018;
  const realmMult = 1 + state.realm.tierIdx * 0.35 + (state.realm.tierIdx > 0 ? state.realm.layer * 0.02 : 0);
  let locMult;
  if (state.cultivating) {
    const loc = LOCATIONS.find(l => l.id === state.cultivating.locationId);
    locMult = loc ? (loc.cultivationMult || 1) : 0.4;
  } else {
    locMult = 0.4;  // passive rate always on
  }
  const cultBuff = activeBuffValue('cultivation_mult', 1);
  const hm = heritageMech();
  const heritageCult = (hm.cultivationMult || 1)
    * (hm.cultInsightMult || 1)
    * ((hm.schoolCultMult && hm.schoolCultMult[state.selectedSchool]) || 1);
  const gearCult = computeMods(state).cultMult || 1;
  // Wave 1: spirit-root grade (gentle, upside-only) + foundation quality (set at breakthroughs).
  const rootGrade = (state.spiritRoot && state.spiritRoot.grade) || 1;
  const foundation = state.foundationQuality || 1;
  return (base + statBonus) * method.mult * locMult * realmMult * cultBuff * boonCultivationMult() * skillCultivationMult() * heritageCult * gearCult * rootGrade * foundation * sectRankMult() * metaCultMult();
}

function startCultivation(locationId) {
  const loc = LOCATIONS.find(l => l.id === locationId);
  if (!loc || !locationUnlocked(loc)) return;
  // Flush any accumulated time
  tickCultivation();
  state.cultivating = { locationId, lastTick: Date.now() };
  saveChar();
  scheduleCultivationTick();
}

function stopCultivation() {
  tickCultivation();
  state.cultivating = null;
  state.passiveTick = Date.now();
  saveChar();
}

function tickCultivation() {
  if (!state || !state.confirmed) return;
  if (combat) {
    if (state.cultivating) state.cultivating.lastTick = Date.now();
    else state.passiveTick = Date.now();
    return;
  }
  const now = Date.now();
  let lastTick = state.cultivating ? state.cultivating.lastTick : (state.passiveTick || now);
  const elapsed = (now - lastTick) / 1000;
  if (elapsed >= 0.1) {
    const gain = cultivationRate() * elapsed;
    addInsight(gain);
    if (state.cultivating) state.cultivating.lastTick = now;
    else state.passiveTick = now;
  }

  // Auto-harvest + auto-replant any ready plots (catches up multiple cycles after offline windows).
  let needsRerender = false;
  state.base.plots.forEach(plot => {
    if (plot.herb && collectPlotCycles(plot) > 0) needsRerender = true;
  });
  const beforeBuffCount = state.base.buffs.length;
  cleanupBuffs();
  if (state.base.buffs.length !== beforeBuffCount) needsRerender = true;

  if (now - lastCultSaveAt > 10000) {
    saveChar();
    lastCultSaveAt = now;
  }

  if (needsRerender) render();
  else updateLiveDisplay();
}

function scheduleCultivationTick() {
  if (cultivationTimer) clearInterval(cultivationTimer);
  cultivationTimer = setInterval(tickCultivation, 1000);
}

function applyOfflineGains() {
  if (!state || !state.confirmed) return null;
  const now = Date.now();
  const lastTick = state.cultivating ? state.cultivating.lastTick : (state.passiveTick || now);
  const rawElapsed = (now - lastTick) / 1000;
  // v0.20: offline cap = 2 hours base + 1 hour per realm tier (Mortal: 2h, QC: 3h, ..., SS: 8h).
  // Higher realms reward longer idle windows.
  const offlineCapHours = 2 + (state.realm.tierIdx || 0);
  const elapsed = Math.min(rawElapsed, offlineCapHours * 3600);
  if (elapsed < 2) {
    if (state.cultivating) state.cultivating.lastTick = now;
    else state.passiveTick = now;
    return null;
  }
  const gain = cultivationRate() * elapsed;
  addInsight(gain);
  if (state.cultivating) state.cultivating.lastTick = now;
  else state.passiveTick = now;
  saveChar();
  return { elapsed, rawElapsed, gain, capped: rawElapsed > elapsed };
}

function updateLiveDisplay() {
  if (combat) return;
  const insightEl = document.getElementById('insight-value');
  if (insightEl) insightEl.textContent = Math.floor(state.realm.insight);
  const info = advanceInfo(state);
  const barEl = document.getElementById('insight-bar');
  if (barEl && info) barEl.style.width = Math.min(100, (state.realm.insight / info.cost) * 100) + '%';
  const advBtn = document.getElementById('advance');
  if (advBtn && info) advBtn.disabled = state.realm.insight < info.cost;
  const rateEl = document.getElementById('cult-rate');
  if (rateEl) rateEl.textContent = cultivationRate().toFixed(3);
  // Plot timers
  state.base.plots.forEach((plot, idx) => {
    const el = document.getElementById(`plot-${idx}-timer`);
    if (el && plot.herb) {
      const rem = plotRemainingSec(plot);
      el.textContent = rem > 0 ? `Growing — ${formatDuration(rem)}` : 'Ready!';
    }
  });
  // Buff timers
  state.base.buffs.forEach((buff, i) => {
    const el = document.getElementById(`buff-${i}-timer`);
    if (el) {
      const rem = Math.max(0, (buff.expiresAt - Date.now()) / 1000);
      el.textContent = formatDuration(rem);
    }
  });
}

// ============================================================
// Combat state + model
// ============================================================
let combat = null;

// v0.19 Phase 3: builds a single enemy combat object from data.
// v0.19 Phase 3: encounter generator. Mixes singles, 2 mooks, solo elites, and elite + 2 mooks
// based on the location's enemyPool. "Elite" is determined by archetype tag (Phase 2). Locations
// without an elite in their pool fall back to single / 2-mook.
function rollEncounter(loc) {
  const pool = loc.enemyPool || [];
  if (!pool.length) return [];
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const elites = pool.filter(id => ENEMIES[id] && ENEMIES[id].archetype === 'elite');
  const mooks = pool.filter(id => ENEMIES[id] && ENEMIES[id].archetype !== 'elite');
  const r = Math.random();
  // 40% single, 25% two mooks, 20% solo elite, 15% elite + two mooks.
  if (r < 0.40)             return [pick(pool)];
  if (r < 0.65 && mooks.length) return [pick(mooks), pick(mooks)];
  if (r < 0.85 && elites.length) return [pick(elites)];
  if (elites.length && mooks.length) return [pick(elites), pick(mooks), pick(mooks)];
  // Fallback when pool is too thin: single enemy.
  return [pick(pool)];
}

function buildEnemyCombat(enemyId) {
  const enemyData = ENEMIES[enemyId];
  if (!enemyData) return null;
  const eTechs = {};
  enemyData.techIds.forEach(id => { eTechs[id] = ENEMY_TECHS[id]; });
  const scale = playerLayerScale(state);
  // v0.23 robustness pass: separate normal vs elite multipliers stacked on top of the
  // existing v0.18 phase-2 bump (hp x2.5 / wpn x2 / qi-spirit-posture x2). Elite gets a
  // steeper bump so boss fights feel meaningfully harder than mooks at the same tier.
  // v0.23.1: normal HP bumped from 1.30 -> 1.65 — optimized builds were one-shotting mooks.
  // v0.25: 20% nerf to enemy HP and weaponPower across the board — v0.23 overshot.
  //   normal HP 1.65 -> 1.32,  elite HP 1.20 -> 0.96,  elite extra 2.20 -> 1.76
  //   normal wpn 1.15 -> 0.92, elite wpn 1.50 -> 1.20
  // qi/spirit/posture intentionally NOT nerfed — those are pacing knobs, not damage/health.
  const isElite = enemyData.archetype === 'elite';
  const hpBoost      = isElite ? 0.96 : 1.32; // multiplier APPLIED on top of x2.5 base.
  const wpnBoost     = isElite ? 1.20 : 0.92;
  const qiBoost      = isElite ? 1.50 : 1.15;
  const postureBoost = isElite ? 1.50 : 1.15;
  // Elite extra HP — also nerfed 20%.
  const eliteHpExtra = isElite ? 1.76 : 1.00;

  const scaledHpMax = Math.round(enemyData.hpMax * scale.stats * 2.5 * hpBoost * eliteHpExtra);
  const scaledQiMax = Math.round(enemyData.qiMax * scale.stats * 2 * qiBoost);
  const scaledSpiritMax = Math.round(enemyData.spiritMax * scale.stats * 2 * qiBoost);
  const scaledPostureMax = Math.round(enemyData.postureMax * scale.stats * 2 * postureBoost);
  const scaledWeaponPower = Math.max(1, Math.round(enemyData.weaponPower * scale.stats * 2 * wpnBoost));
  // Flat damage reduction. Elites get a thicker pad; normals get a small one (v0.23.2)
  // that scales gently by tier. Both blunt chip-damage / multi-hit AOE strategies.
  const tierIdx = state.realm.tierIdx || 0;
  const baseFlatDR = isElite
    ? Math.round(8 * (1 + tierIdx * 0.5))   // M 8, QC 12, FE 16, CF 20, GC 24, NS 28, SS 32
    : Math.round(2 * (1 + tierIdx * 0.4));  // M 2, QC ~3, FE ~3, CF 4, GC 4, NS 5, SS 5
  const eliteFlatDR = baseFlatDR;
  return {
    name: enemyData.name,
    id: enemyData.id,
    archetype: enemyData.archetype,
    kind: enemyData.kind || enemyKindFor(enemyId),  // v0.23 creature type for vs-kind weapon mods
    element: enemyData.element || enemyElementFor(enemyId),  // Wave 1: five-element affinity
    isElite,
    hpMax: scaledHpMax, hp: scaledHpMax,
    qiMax: scaledQiMax, qi: scaledQiMax,
    spiritMax: scaledSpiritMax, spirit: scaledSpiritMax,
    postureMax: scaledPostureMax, posture: 0, broken: 0,
    weaponPower: scaledWeaponPower,
    techniques: eTechs,
    cooldowns: Object.fromEntries(Object.keys(eTechs).map(k => [k, 0])),
    buffs: { incomingMult: 1 },
    baseIncoming: 1,
    effects: [],
    scale,
    flatDR: eliteFlatDR,
  };
}

// v0.23: creature-type tag used by vs-kind weapon mods. Inferred by id substring as a
// pragmatic shortcut; explicit ENEMIES[].kind overrides this when set.
const ENEMY_KIND_HINTS = [
  ['demonic', /demon|inner_demon|heart_demon|abyss|wraith|hell|fiend/i],
  ['beast',   /wolf|bat|rat|tiger|serpent|fox|dragon|crow|spider|bear|boar|stag/i],
  ['spirit',  /ghost|spirit|wraith|phantom|soul|specter|mist|fen_serpent/i],
  ['construct', /elemental|stone|iron|array|grid|golem|machine|puppet/i],
  ['heaven', /heavenly|tribulation|trib_|judgement|pressure/i],
];
function enemyKindFor(enemyId) {
  for (const [kind, rx] of ENEMY_KIND_HINTS) if (rx.test(enemyId)) return kind;
  return 'human';
}

// Wave 1: five-element affinity for enemies, inferred by id substring (explicit
// ENEMIES[].element overrides). Deterministic hash fallback so every foe has an element.
const ENEMY_ELEMENT_HINTS = [
  ['fire',  /flame|fire|ember|phoenix|ash|sun|blaze|crimson|brazier|lava|scorch/i],
  ['water', /water|frost|ice|coral|tide|moon|mist|fen|sea|snow|lake|wave|rain|siren/i],
  ['wood',  /briar|grove|vine|verdant|petal|bloom|leaf|forest|wood|reed|thorn/i],
  ['metal', /iron|steel|blade|sword|saber|dagger|bell|gold|disc|chain|needle|spear|arrow/i],
  ['earth', /stone|rock|mountain|earth|bone|jade|dust|clay|corpse|tomb|cliff|sand|grid/i],
];
function enemyElementFor(enemyId) {
  for (const [el, rx] of ENEMY_ELEMENT_HINTS) if (rx.test(enemyId)) return el;
  return ELEMENTS[Math.abs(hashStr(enemyId)) % ELEMENTS.length];
}

// v0.19 Phase 3: initCombat now accepts a single enemyId OR an array of enemyIds (multi-enemy
// encounter). combat.enemies[] is always the array; combat.enemy is a back-compat pointer to
// the current "primary target" (first alive enemy), kept up to date as enemies fall.
function initCombat(enemyIdOrIds) {
  const ids = Array.isArray(enemyIdOrIds) ? enemyIdOrIds.slice() : [enemyIdOrIds];
  const enemies = ids.map(buildEnemyCombat).filter(Boolean);
  if (!enemies.length) return;
  const weapon = WEAPONS[state.weapon];
  const school = SCHOOLS[state.selectedSchool];
  const loadout = activeSkillsList(state);  // Wave 1d: combat uses the slotted active set (was school.techniques)
  const mods = computeMods(state);
  const rb = realmBonusFor(state);
  const weaponMult = activeBuffValue('weapon_mult', 1);
  const baseIncoming = activeBuffValue('incoming_mult', 1) * boonIncomingMult() * skillIncomingMultPerm() * (mods.incomingMult || 1);

  const p = {
    name: state.name,
    hpMax: computeMaxHP(state), hp: computeMaxHP(state),
    qiMax: computeMaxQi(state), qi: computeMaxQi(state),
    spiritMax: computeMaxSpirit(state), spirit: computeMaxSpirit(state),
    postureMax: 60, posture: 0, broken: 0,
    weaponPower: Math.round((weapon.power + secondaryWeaponPowerBonus(state) + refineWeaponBonus(state) + rb.weapon + mods.weaponBonus + boonWeaponAdd() + skillWeaponAdd()) * weaponMult * (mods.weaponMultFlat || 1)),
    loadout,
    cooldowns: Object.fromEntries(loadout.map(id => [id, 0])),
    buffs: { incomingMult: 1, incomingTurns: 0, nextDamageMult: 1, nextDamageTurns: 0 },
    baseIncoming,
    effects: [],
    mods,
    elements: playerElements(state),               // Wave 1: five-element counters
    element: (playerElements(state)[0] || null),
  };
  combat = {
    turn: 1,
    enemyId: enemies[0].id,  // legacy single-enemy ID used by victory-reward / insight scaling
    log: [],
    player: p,
    enemies,
    enemy: enemies[0],  // back-compat primary-target pointer; updated by advancePrimaryTarget()
    over: false,
    victory: null,
    rewards: null,
  };
  pushLog('turn', `— Turn 1 —`);
  if (enemies.length === 1) {
    pushLog('flavor', ENEMIES[enemies[0].id].intro);
  } else {
    pushLog('flavor', `Multiple opponents step from the brush — ${enemies.map(e => e.name).join(', ')}.`);
  }
  if (weaponMult !== 1) pushLog('flavor', `The tincture burns in your veins. Your weapon hums louder.`);
  if (baseIncoming !== 1) pushLog('flavor', `Cold mist coils about you, blunting the edges of the world.`);
}

// Pick the next alive enemy as the primary target. Called whenever an enemy dies. If none alive,
// combat.enemy ends up null and the victory check fires.
function advancePrimaryTarget() {
  const alive = combat.enemies.filter(e => e.hp > 0);
  combat.enemy = alive[0] || null;
  if (combat.enemy) combat.enemyId = combat.enemy.id;
}

function pushLog(cls, text) { combat.log.push({ cls, text }); }

function dealDamage(target, amount, opts) {
  opts = opts || {};
  let qiDmg = amount;
  let hpDmg = opts.directHP || 0;
  let spiritDmg = opts.directSpirit || 0;

  if (target.broken > 0 && !opts.ignorePostureBreak) qiDmg *= 2;
  let incoming = (target.buffs.incomingMult || 1) * (target.baseIncoming || 1);
  // Player-only heritage mitigations
  if (combat && target === combat.player) {
    const hm = heritageMech();
    if (combat.tribulation && hm.tribulationIncomingMult) incoming *= hm.tribulationIncomingMult;
    if (combat.tribulation) incoming *= boonTribulationIncomingMult();
    if (spiritDmg && hm.spiritIncomingMult) spiritDmg *= hm.spiritIncomingMult;
  }
  qiDmg *= incoming;
  hpDmg *= incoming;

  if (opts.pierceQi) {
    const pierced = qiDmg * opts.pierceQi;
    hpDmg += pierced;
    qiDmg -= pierced;
  }

  // v0.23 flatDR — applied after multipliers, capped at 40% of incoming.
  // Player reads from mods; enemies can carry a target.flatDR (set in initCombat for elites).
  const targetDR = (combat && target === combat.player)
    ? (combat.player.mods.flatDR || 0)
    : (target.flatDR || 0);
  if (targetDR > 0) {
    const cap = (qiDmg + hpDmg) * 0.4;
    let dr = Math.min(targetDR, cap);
    const qSoak = Math.min(qiDmg, dr);
    qiDmg -= qSoak; dr -= qSoak;
    if (dr > 0) hpDmg = Math.max(0, hpDmg - dr);
  }

  const absorbed = Math.min(target.qi, qiDmg);
  target.qi -= absorbed;
  const overflow = qiDmg - absorbed;
  const totalHp = overflow + hpDmg;
  target.hp -= totalHp;
  target.spirit -= spiritDmg;
  if (target.hp < 0) target.hp = 0;
  if (target.spirit < 0) target.spirit = 0;

  // Track the largest single hit the player has taken this combat — used by the death rule
  // (a finishing blow that took out a big chunk of max HP marks the defeat as reckless).
  if (combat && target === combat.player) {
    target.lastHpHit = totalHp;
    target.biggestHpHit = Math.max(target.biggestHpHit || 0, totalHp);
  }

  return {
    qiAbsorbed: Math.round(absorbed),
    hpDamage: Math.round(totalHp),
    spiritDamage: Math.round(spiritDmg),
  };
}

function applyPosture(target, amount, isBreaker, breakDuration) {
  if (amount <= 0 && !isBreaker) return false;
  target.posture += amount;
  if (isBreaker) target.posture = target.postureMax;  // guaranteed break
  let broke = false;
  if (target.posture >= target.postureMax && target.broken === 0) {
    target.broken = breakDuration != null ? breakDuration : 3;
    target.posture = 0;
    broke = true;
  }
  if (target.posture > target.postureMax) target.posture = target.postureMax;
  return broke;
}

function damageLogLine(res, target) {
  const parts = [];
  if (res.qiAbsorbed) parts.push(`${res.qiAbsorbed} qi shield`);
  if (res.hpDamage)   parts.push(`${res.hpDamage} body`);
  if (res.spiritDamage) parts.push(`${res.spiritDamage} spirit`);
  if (!parts.length) return `  → (no damage)`;
  return `  → ${parts.join(', ')} [${target.name}]`;
}

// ============================================================
// Player actions
// ============================================================
// v0.24b: auto-combat helpers. Auto-mode is a strike-only farming tool: damage
// reduced (penalty starts at -30% at Mortal, -5% per realm tier — SS strikes at
// full power), insight reward heavily reduced (auto kills earn 12.5% of the new
// 4x baseline = 0.5x current per-kill), capped at 60 minutes of run-time per IRL
// day. Active combat (no auto used in the fight) earns the full 4x baseline.

// Damage penalty for an auto-driven strike, scaled by player realm tier.
// Mortal -30%, QC -25%, FE -20%, CF -15%, GC -10%, NS -5%, SS 0%.
function autoDamagePenalty(tierIdx) {
  return Math.max(0, 0.30 - (tierIdx || 0) * 0.05);
}

// Auto-mode insight is capped at 12.5% of the new 4x active baseline = 0.5x current.
// Active mode (combat.autoUsed === false at time of kill) earns the full 4x.
function combatInsightMult(combatRef) {
  return (combatRef && combatRef.autoUsed) ? 0.5 : 4.0;
}

// Reset dailyMinutes once 24h have passed. Called from cultivation tick + on render.
function tickAutoCombatReset() {
  if (!state || !state.autoCombat) return;
  const now = Date.now();
  if (now - (state.autoCombat.lastReset || 0) >= 24 * 3600 * 1000) {
    state.autoCombat.dailyMinutes = 0;
    state.autoCombat.lastReset = now;
  }
}

const AUTO_TICK_MS = 1500;
const AUTO_DAILY_CAP_MIN = 60;
let autoCombatTimer = null;

// Drives auto-strikes while combat is open and autoCombat.active. Each fired strike
// counts AUTO_TICK_MS toward dailyMinutes; once we hit AUTO_DAILY_CAP_MIN, auto-mode
// force-disables. Also disables on combat.over so we don't run after victory/defeat.
function autoCombatTick() {
  if (!state || !state.autoCombat || !state.autoCombat.active) return;
  if (!combat || combat.over) return;
  // Survival tribulations don't allow strike — auto skips them silently.
  if (combat.tribulation && combat.tribulation.kind === 'survival') return;
  // Daily cap check.
  tickAutoCombatReset();
  if (state.autoCombat.dailyMinutes >= AUTO_DAILY_CAP_MIN) {
    setAutoCombat(false);
    pushLog('flavor', `(auto-combat budget exhausted for the day)`);
    render();
    return;
  }
  state.autoCombat.dailyMinutes += AUTO_TICK_MS / 60000; // 1.5s -> 0.025 min
  playerStrike({ auto: true });
}

function setAutoCombat(on) {
  state.autoCombat.active = !!on;
  if (autoCombatTimer) { clearInterval(autoCombatTimer); autoCombatTimer = null; }
  if (on) {
    autoCombatTimer = setInterval(autoCombatTick, AUTO_TICK_MS);
  }
  saveChar();
}

// v0.23: applies crit / first-strike / low-HP / vs-kind to outgoing damage.
// Mutates ctx.crit so the log line can mark the hit. Returns scaled damage.
function applyPlayerOutgoingMods(p, dmg, target, ctx) {
  const m = p.mods;
  const turn = (combat && combat.turn) || 1;
  if (m.firstStrikeBonus && turn <= 1) dmg *= 1 + m.firstStrikeBonus;
  if (m.lowHpBonus && p.hp > 0 && p.hp / p.hpMax < 0.33) dmg *= 1 + m.lowHpBonus;
  if (target && target.kind && m.vsKindMult && m.vsKindMult[target.kind]) {
    dmg *= 1 + m.vsKindMult[target.kind];
  }
  // Wave 1: Five-Element counter (gentle). Overcoming the foe's element = +20%; being
  // overcome = -15%. Dual roots take the most favorable matchup.
  if (target && target.element && p.elements && p.elements.length) {
    const em = bestElementCounter(p.elements, target.element);
    if (em !== 1) { dmg *= em; ctx.elementMult = em; }
  }
  if (m.critChance > 0 && Math.random() < m.critChance) {
    dmg *= (m.critMult || 1.5);
    ctx.crit = true;
  }
  return dmg;
}

// v0.23: lifesteal + qi-on-hit-style triggers fired after a successful hit.
function applyPostHitTriggers(p, res) {
  if ((p.mods.lifestealPct || 0) > 0 && (res.hpDamage + res.qiAbsorbed) > 0) {
    const heal = Math.round((res.hpDamage + res.qiAbsorbed) * p.mods.lifestealPct);
    if (heal > 0) {
      const before = p.hp;
      p.hp = Math.min(p.hpMax, p.hp + heal);
      if (p.hp > before) pushLog('heal', `  → +${p.hp - before} hp (lifesteal)`);
    }
  }
}

function playerStrike(opts) {
  opts = opts || {};
  if (combat.over) return;
  const p = combat.player, e = combat.enemy;
  // v0.24b: auto-driven strikes apply a tier-scaled damage penalty and taint the
  // fight's insight reward (combat.autoUsed sticks for the rest of the encounter).
  const isAuto = !!opts.auto;
  if (isAuto) combat.autoUsed = true;
  let dmg = p.weaponPower * 1.5 * (p.mods.strikeDamageMult || 1) * boonStrikeMult();
  if (isAuto) dmg *= (1 - autoDamagePenalty(state.realm.tierIdx || 0));
  if (p.buffs.nextDamageTurns > 0) {
    dmg *= p.buffs.nextDamageMult;
    p.buffs.nextDamageTurns = 0;
    p.buffs.nextDamageMult = 1;
    pushLog('posture', `The waiting edge falls.`);
  }
  const ctx = {};
  dmg = applyPlayerOutgoingMods(p, dmg, e, ctx);
  const res = dealDamage(e, dmg, {});
  pushLog('line', ctx.crit
    ? `${p.name} strikes — the blade finds the seam, and the air opens.`
    : (isAuto ? `${p.name} strikes — a measured, half-mindful blow.`
              : `${p.name} strikes — a clean, disciplined blow.`));
  pushLog('hurt', damageLogLine(res, e));
  applyPostHitTriggers(p, res);
  const hmStrike = heritageMech();
  const postureAmt = Math.round(10 * p.mods.postureMult * (hmStrike.postureDamageMult || 1));
  const broke = applyPosture(e, postureAmt, false, 3 + p.mods.postureBreakBonus);
  if (broke) pushLog('posture', `${e.name}'s stance shatters! Qi damage doubled for ${e.broken} turns.`);
  if (p.mods.strikeHeal > 0 && res.qiAbsorbed + res.hpDamage > 0) {
    const before = p.hp;
    p.hp = Math.min(p.hpMax, p.hp + p.mods.strikeHeal);
    if (p.hp > before) pushLog('heal', `  → +${p.hp - before} hp (Bloodbond)`);
  }
  endPlayerAction();
}

function effectiveQiCost(p, tech) {
  let cost = tech.qi;
  const schoolMult = p.mods.schoolQiMult[tech.school];
  if (schoolMult) cost *= schoolMult;
  const hm = heritageMech();
  if (hm.schoolQiDiscount && hm.schoolQiDiscount[tech.school]) cost *= hm.schoolQiDiscount[tech.school];
  if (hm.schoolQiPenalty && hm.schoolQiPenalty[tech.school]) cost *= hm.schoolQiPenalty[tech.school];
  cost *= boonQiCostMult();
  const qiUp = p.effects.find(ef => ef.kind === 'qi_cost_up');
  if (qiUp) cost *= qiUp.value;
  return Math.ceil(cost);
}
function effectiveHpCost(p, tech) {
  if (!tech.hpCost) return 0;
  return Math.ceil(tech.hpCost * p.mods.hpCostMult);
}

function playerTechnique(techId) {
  if (combat.over) return;
  const p = combat.player, e = combat.enemy;
  const tech = TECHNIQUES[techId];
  if (p.cooldowns[techId] > 0) return;
  const qiCost = effectiveQiCost(p, tech);
  const hpCost = effectiveHpCost(p, tech);
  if (p.qi < qiCost) return;
  if (hpCost && p.hp <= hpCost) return;

  p.qi -= qiCost;
  if (hpCost) p.hp -= hpCost;
  p.cooldowns[techId] = tech.cd + 1;

  let dmg = p.weaponPower * (tech.damage || 0) * (p.mods.techDamageMult || 1);
  const hm0 = heritageMech();
  if (hm0.schoolDamageMult && hm0.schoolDamageMult[tech.school]) dmg *= hm0.schoolDamageMult[tech.school];
  if (p.mods.schoolDamageMult && p.mods.schoolDamageMult[tech.school]) dmg *= p.mods.schoolDamageMult[tech.school];
  if (hm0.rivalDamageMult && combat.enemyId && RIVAL_ENEMY_IDS.has(combat.enemyId)) dmg *= hm0.rivalDamageMult;
  if (p.buffs.nextDamageTurns > 0 && dmg > 0) {
    dmg *= p.buffs.nextDamageMult;
    p.buffs.nextDamageTurns = 0;
    p.buffs.nextDamageMult = 1;
    pushLog('posture', `The waiting edge joins the blow.`);
  }

  // v0.19 Phase 3: AOE techs hit every alive enemy at 70% per-target damage.
  // Single-target techs (default) hit primary target only at full damage.
  const isAoe = tech.target === 'aoe';
  const targets = isAoe ? combat.enemies.filter(en => en.hp > 0) : [e];
  const targetDmgMult = isAoe ? 0.7 : 1.0;

  if (isAoe && targets.length > 1) {
    pushLog('line', `${p.name} unleashes ${tech.name} — the strike spreads across every standing opponent.`);
  } else {
    pushLog('line', tech.logHit(p.name, e.name));
  }

  let pierce = tech.pierceQi || 0;
  if (hm0.schoolPierceBonus && hm0.schoolPierceBonus[tech.school]) pierce = Math.min(1, pierce + hm0.schoolPierceBonus[tech.school]);
  const directSpiritAmt = (tech.directSpirit || 0) * (p.mods.spiritDamageMult || 1);
  const postureAmtBase = Math.round((tech.postureBuild || 0) * p.mods.postureMult * (hm0.postureDamageMult || 1));

  targets.forEach(tgt => {
    let tdmg = dmg * targetDmgMult;
    const ctx = {};
    tdmg = applyPlayerOutgoingMods(p, tdmg, tgt, ctx);
    if (tdmg > 0 || tech.directHP || tech.directSpirit) {
      const res = dealDamage(tgt, tdmg, {
        directHP: tech.directHP || 0,
        directSpirit: directSpiritAmt,
        pierceQi: pierce,
      });
      if (ctx.crit) pushLog('posture', `  → critical strike!`);
      pushLog('hurt', damageLogLine(res, tgt));
      applyPostHitTriggers(p, res);
    }
    if (postureAmtBase || tech.postureBreak) {
      const broke = applyPosture(tgt, postureAmtBase, tech.postureBreak, 3 + p.mods.postureBreakBonus);
      if (broke) pushLog('posture', `${tgt.name}'s stance shatters! Qi damage doubled for ${tgt.broken} turns.`);
    }
    if (tech.effect) {
      tgt.effects.push({
        kind: tech.effect,
        value: tech.effectValue,
        turns: tech.effectTurns,
        name: tech.name,
      });
    }
  });
  if (tech.effect === 'qi_drain') pushLog('flavor', `The glyph sings softly, siphoning breath.`);
  if (tech.effect === 'qi_cost_up') pushLog('flavor', `Their meridians twist against them.`);

  if (tech.buff) {
    if (tech.buff.nextDamageMult) {
      p.buffs.nextDamageMult = tech.buff.nextDamageMult;
      p.buffs.nextDamageTurns = tech.buff.turns || 1;
    }
    if (tech.buff.incomingMult != null) {
      p.buffs.incomingMult = tech.buff.incomingMult;
      p.buffs.incomingTurns = tech.buff.turns || 1;
    }
  }

  endPlayerAction();
}

function playerMeditate() {
  if (combat.over) return;
  const p = combat.player;
  const hm = heritageMech();
  const schoolMed = (hm.schoolMeditateMult && hm.schoolMeditateMult[state.selectedSchool]) || 1;
  const regen = Math.ceil(p.qiMax * 0.5 * p.mods.meditateMult * schoolMed);
  const before = p.qi;
  p.qi = Math.min(p.qiMax, p.qi + regen);
  p.buffs.incomingMult = 1.6;
  p.buffs.incomingTurns = 1;
  pushLog('line', `${p.name} folds inward, drawing heaven-qi through open meridians.`);
  pushLog('heal', `  → +${p.qi - before} qi (vulnerable until next turn)`);
  endPlayerAction();
}

// ============================================================
// Turn flow
// ============================================================
function endPlayerAction() {
  if (checkDeath()) return;
  enemyTurn();
  if (checkDeath()) return;
  endOfRound();
  if (checkDeath()) return;
  render();
}

// Per-enemy loot + insight grant. Called once per enemy as they fall. Accumulates into
// combat.rewards (multi-enemy aware: arrays of drops, summed insight + materials).
function grantEnemyDefeatRewards(e) {
  const enemyData = ENEMIES[e.id];
  const hmVictory = heritageMech();
  const rewardScale = (e.scale && e.scale.reward) || 1;
  const insight = Math.round(enemyData.insightReward * rewardScale * boonInsightMult() * skillCombatInsightMult() * (combat.player.mods.insightMult || 1) * ((SCHOOLS[state.selectedSchool] && SCHOOLS[state.selectedSchool].insightFromKillsMult) || 1) * (hmVictory.combatInsightMult || 1) * combatInsightMult(combat) * metaInsightMult());
  addInsight(insight);
  state.sectKills = (state.sectKills || 0) + 1;  // Wave 2b: progress toward the sect hunt bounty
  const drop = rollInscriptionDrop();
  if (drop) state.inscriptions.owned.push(drop);
  const armorDrop = rollArmorDrop(enemyData);
  if (armorDrop) state.armor.owned.push(armorDrop);
  const artifactDrop = rollArtifactDrop(enemyData);
  if (artifactDrop) state.artifacts.owned.push(artifactDrop);
  let weaponDrop = null;
  // v0.24a: drop logic split. Elites use the existing per-enemy named drop table.
  // Non-elites get junk most of the time — their named drop is "replaced" 80% of
  // the time with a tier-appropriate junk roll. Net effect: most drops are scrap
  // sellable to the caravan, occasional named slip-throughs, bosses still feel
  // worth re-fighting because their named drops aren't filtered.
  const isEliteKill = enemyData.archetype === 'elite';
  (enemyData.drops || []).forEach(d => {
    if (!weaponDrop && Math.random() < d.chance) {
      if (!isEliteKill && Math.random() < 0.80) {
        const junk = rollJunkWeaponForTier(state.realm.tierIdx || 0);
        if (junk) { weaponDrop = junk; state.weapons.owned.push(junk); }
      } else {
        weaponDrop = d.id;
        state.weapons.owned.push(d.id);
      }
    }
  });
  // Standalone junk-drop roll for non-elites that have no named drop entry, OR whose
  // named drops failed their per-entry chance roll. Keeps mooks dropping *something*
  // sometimes — gives the early game a steady trickle of sell-fodder.
  if (!weaponDrop && !isEliteKill && Math.random() < 0.18) {
    const junk = rollJunkWeaponForTier(state.realm.tierIdx || 0);
    if (junk) { weaponDrop = junk; state.weapons.owned.push(junk); }
  }
  const materialDrops = {};
  (enemyData.materialDrops || []).forEach(d => {
    if (Math.random() < d.chance) {
      const [lo, hi] = d.count;
      const n = lo + Math.floor(Math.random() * (hi - lo + 1));
      state.base.materials[d.id] = (state.base.materials[d.id] || 0) + n;
      materialDrops[d.id] = (materialDrops[d.id] || 0) + n;
    }
  });
  // v0.21: spirit stones drop on every kill, alongside insight. sqrt scaling so weak mooks give 1,
  // mid-tier give a handful, bosses give meaningfully more without flooding the economy. Funnels
  // into the same materialDrops dict so it appears in the combat log + post-combat panel.
  const stoneAmount = Math.max(1, Math.floor(Math.sqrt(enemyData.insightReward || 1) * rewardScale * 0.5));
  state.base.materials.spirit_stone = (state.base.materials.spirit_stone || 0) + stoneAmount;
  materialDrops.spirit_stone = (materialDrops.spirit_stone || 0) + stoneAmount;
  const bookChance = enemyData.bookDropChance != null ? enemyData.bookDropChance : 0.08;
  const bookDrop = rollBookDrop(bookChance);
  if (bookDrop) state.foundBooks.push(bookDrop);

  // v0.23: qi-on-kill from weapons/artifacts.
  const qiOnKill = (combat.player && combat.player.mods.qiOnKill) || 0;
  if (qiOnKill > 0) {
    const before = combat.player.qi;
    combat.player.qi = Math.min(combat.player.qiMax, combat.player.qi + qiOnKill);
    const gained = combat.player.qi - before;
    if (gained > 0) pushLog('heal', `  → +${gained} qi (kill surge)`);
  }

  pushLog('victory', `${e.name} falls.`);
  pushLog('flavor', enemyData.victoryText);
  pushLog('reward', `+${insight} insight gained.`);
  if (drop) { const ins = INSCRIPTIONS[drop]; pushLog('reward', `Inscription found: ${ins.name} — ${ins.desc}`); }
  if (weaponDrop) { const w = WEAPONS[weaponDrop]; pushLog('reward', `Weapon claimed: ${w.name} (power ${w.power}, ${w.slots} slots).`); }
  if (armorDrop) { const ar = ARMOR[armorDrop]; pushLog('reward', `Armor found: ${ar.name} (${ar.rarity}, ${ARMOR_SLOT_LABELS[ar.slot] || ar.slot}).`); }
  if (artifactDrop) { const af = ARTIFACTS[artifactDrop]; pushLog('reward', `Artifact recovered: ${af.name} — ${af.desc}`); }
  const matStr = Object.entries(materialDrops).map(([id, n]) => `${n}× ${MATERIALS[id].name}`).join(', ');
  if (matStr) pushLog('reward', `Materials gathered: ${matStr}.`);
  if (bookDrop) { const bk = SKILL_BOOKS[bookDrop]; pushLog('reward', `A skill book tumbles loose: ${bk.name} (${bk.rarity}).`); }

  combat.rewards = combat.rewards || { insight: 0, drops: [], weaponDrops: [], bookDrops: [], armorDrops: [], artifactDrops: [], materialDrops: {} };
  combat.rewards.insight += insight;
  if (drop) combat.rewards.drops.push(drop);
  if (weaponDrop) combat.rewards.weaponDrops.push(weaponDrop);
  if (bookDrop) combat.rewards.bookDrops.push(bookDrop);
  if (armorDrop) combat.rewards.armorDrops.push(armorDrop);
  if (artifactDrop) combat.rewards.artifactDrops.push(artifactDrop);
  Object.entries(materialDrops).forEach(([id, n]) => {
    combat.rewards.materialDrops[id] = (combat.rewards.materialDrops[id] || 0) + n;
  });
}

function checkDeath() {
  const p = combat.player;
  // Check each enemy for newly-defeated state. Per-enemy rewards on each fall.
  combat.enemies.forEach(e => {
    if (e.hp <= 0 && !e.defeated) {
      e.defeated = true;
      grantEnemyDefeatRewards(e);
    }
  });
  // If primary target fell, advance to next alive enemy.
  if (combat.enemy && combat.enemy.hp <= 0) advancePrimaryTarget();
  // Final victory only when no alive enemies remain.
  const anyAlive = combat.enemies.some(e => e.hp > 0);
  if (!anyAlive && !combat.over) {
    combat.over = true;
    combat.victory = true;

    // Tribulation victory: advance realm, skip extra insight reward (already granted per-enemy).
    if (combat.tribulation && pendingTribulation) {
      state.realm.insight -= pendingTribulation.cost;
      state.realm.tierIdx = pendingTribulation.targetTier;
      state.realm.layer = 1;
      state.realmDefeats = 0;  // v0.25: breakthrough resets defeat counter
      pushLog('reward', `Realm breakthrough: ${REALMS[state.realm.tierIdx].name}!`);
      if (state.tribulationFails && state.tribulationFails[combat.enemyId]) {
        state.tribulationFails[combat.enemyId] = 0;
      }
      pendingTribulation = null;
      if (state.confirmed) state.finalStats = finalStats(state);
    }

    const hmVictory = heritageMech();
    if (hmVictory.postCombatHeal) {
      combat.player.hp = combat.player.hpMax;
      combat.player.qi = combat.player.qiMax;
      combat.player.spirit = combat.player.spiritMax;
      pushLog('heal', `  → World-Tree Scion: body and qi restored.`);
    }
    saveChar();
    render();
    return true;
  }
  if (p.hp <= 0 && !combat.over) {
    combat.over = true;
    combat.victory = false;
    const enemyData = ENEMIES[combat.enemyId];
    pushLog('defeat', `${p.name} collapses.`);
    pushLog('flavor', enemyData.defeatText);
    if (combat.tribulation && pendingTribulation) {
      handleTribulationFailure(combat.enemyId, p.name, enemyData);
      return true;
    }
    // Non-tribulation defeats: small base death chance, raised by reckless conditions.
    const death = rollCombatDeath(combat, p);
    if (death.died) {
      pushLog('defeat', `The wound runs deeper than the body. ${p.name} does not rise.`);
      const cause = `Slain by ${enemyData.name} (${death.reasons.join(', ') || 'a careless step'})`;
      const prose = `In the long ledger of the dao, the strike that ended ${p.name} was no different from a thousand others — only the body it found could not stand back up.`;
      saveChar(); // persist the over-state briefly so the log is visible if user quickly inspects
      setTimeout(() => dieRun(cause, prose, p.name), 0);
    }
    render();
    return true;
  }
  return false;
}

// Combat death rule: defeats are usually unconscious-and-retry, but reckless conditions (huge
// finishing blow, qi shield depleted, fast wipe, late realm) can stack a chance to permakill.
// Tribulation defeats use the streak counter instead — handled separately.
// v0.25: defeat counter ramps perma-death chance per realm.
// First 5 defeats this realm are free (0% chance). Each defeat thereafter adds 2.5%.
// Counter increments on EVERY defeat (whether the roll killed or not) and resets
// on realm breakthrough. Tribulations are handled separately (3-strike rule).
function rollCombatDeath(combat, p) {
  state.realmDefeats = (state.realmDefeats || 0) + 1;
  const defeats = state.realmDefeats;
  const chance = Math.max(0, (defeats - 5) * 0.025);
  const died = Math.random() < chance;
  return {
    died, chance,
    reasons: died ? [`${defeats} defeats this realm — the dao thins, and the body remembers each loss`] : [],
    defeats,
  };
}

// Tribulation streak: each tribulation tracks consecutive failures by enemyId. 3 in a row kills.
// Resets on success or on attempting a different tribulation.
function handleTribulationFailure(enemyId, charName, enemyData) {
  if (!state.tribulationFails) state.tribulationFails = {};
  state.tribulationFails[enemyId] = (state.tribulationFails[enemyId] || 0) + 1;
  // Reset other tribulations' streaks — only one trib can be currently in-streak.
  Object.keys(state.tribulationFails).forEach(k => { if (k !== enemyId) state.tribulationFails[k] = 0; });
  pendingTribulation = null;
  const fails = state.tribulationFails[enemyId];
  if (fails >= 3) {
    pushLog('defeat', `Three times the heavens tested you. Three times you fell. The dao closes.`);
    saveChar();
    const cause = `Consumed by ${enemyData.name} (third failed tribulation)`;
    const prose = `Some doors do not open on the third knock. ${charName}'s name is unstitched from the realm-list, and the next breath belongs to no one.`;
    setTimeout(() => dieRun(cause, prose, charName), 0);
  } else {
    pushLog('defeat', `Tribulation failure ${fails}/3. The next attempt will be the last.`);
    saveChar();
  }
  render();
}

// v0.19 Phase 3: every alive enemy in combat.enemies takes a turn (in their array order).
// Effects tick per-enemy. AI runs from ENEMIES[e.id].ai. Defeated enemies are skipped.
// Stops early if checkDeath fires combat.over (e.g. player died from a bleed at start).
function enemyTurn() {
  const p = combat.player;
  for (const e of combat.enemies) {
    if (e.hp <= 0) continue;
    if (combat.over) break;
    e.effects = e.effects.filter(ef => {
      if (ef.kind === 'qi_drain') {
        const before = e.qi;
        e.qi = Math.max(0, e.qi - ef.value);
        if (before > 0) pushLog('hurt', `  → ${e.name} bleeds ${before - e.qi} qi to the ${ef.name}.`);
      }
      ef.turns--;
      return ef.turns > 0;
    });
    const enemyData = ENEMIES[e.id];
    if (enemyData) enemyData.ai(e, p);
    e.buffs.incomingMult = 1;
  }
}

function enemyTickCDs(e) {
  Object.keys(e.cooldowns).forEach(k => { if (e.cooldowns[k]>0) e.cooldowns[k]--; });
}
function enemyCanUse(e, techId) {
  const tech = e.techniques[techId];
  const up = e.effects.find(ef => ef.kind === 'qi_cost_up');
  const cost = up ? Math.ceil(tech.qi * up.value) : tech.qi;
  return e.cooldowns[techId] === 0 && e.qi >= cost;
}
function enemyUseTech(e, p, techId) {
  const tech = e.techniques[techId];
  const up = e.effects.find(ef => ef.kind === 'qi_cost_up');
  const cost = up ? Math.ceil(tech.qi * up.value) : tech.qi;
  e.qi -= cost;
  e.cooldowns[techId] = tech.cd + 1;
  const dmg = e.weaponPower * (tech.damage || 0);
  pushLog('line', tech.logHit(e.name, p.name));
  if (dmg > 0 || tech.directHP || tech.directSpirit) {
    const res = dealDamage(p, dmg, {
      directHP: tech.directHP || 0,
      directSpirit: tech.directSpirit || 0,
      pierceQi: tech.pierceQi || 0,
    });
    pushLog('hurt', damageLogLine(res, p));
  }
  if (tech.postureBuild || tech.postureBreak) {
    const broke = applyPosture(p, tech.postureBuild || 0, tech.postureBreak, 3);
    if (broke) pushLog('posture', `${p.name}'s stance shatters! Qi damage doubled for ${p.broken} turns.`);
  }
  if (tech.effect) {
    let turns = tech.effectTurns;
    const hm = heritageMech();
    if (tech.effect === 'qi_cost_up' && hm.qiCostUpDurationMult) {
      turns = Math.max(1, Math.ceil(turns * hm.qiCostUpDurationMult));
    }
    p.effects.push({
      kind: tech.effect, value: tech.effectValue, turns, name: tech.name,
    });
    if (tech.effect === 'qi_drain') pushLog('flavor', `A glyph sticks to you, drinking your qi.`);
    if (tech.effect === 'bleed') pushLog('flavor', `The wound will not close on its own.`);
  }
}
function enemyMeditate(e) {
  const regen = Math.ceil(e.qiMax * 0.4);
  const before = e.qi;
  e.qi = Math.min(e.qiMax, e.qi + regen);
  e.buffs.incomingMult = 1.5;
  pushLog('line', `The ${e.name} gathers itself, drawing qi inward.`);
  pushLog('heal', `  → +${e.qi - before} qi (vulnerable)`);
}
function enemyBasicStrike(e, p) {
  // v0.18 Phase 2: before falling through to a plain strike, try any usable technique.
  // This lets new techs added to techIds actually get used by the existing per-enemy AIs
  // (which only hard-code their original tech names). Specific AI logic that prefers
  // particular techs in particular orders runs first and is unaffected — this only kicks
  // in when the AI was already about to basic-strike.
  for (const techId of Object.keys(e.techniques || {})) {
    if (enemyCanUse(e, techId)) return enemyUseTech(e, p, techId);
  }
  const res = dealDamage(p, e.weaponPower, {});
  pushLog('line', `The ${e.name} attacks ${p.name}.`);
  pushLog('hurt', damageLogLine(res, p));
  applyPosture(p, 4, false, 3);
}

function endOfRound() {
  const p = combat.player;
  Object.keys(p.cooldowns).forEach(k => { if (p.cooldowns[k]>0) p.cooldowns[k]--; });

  p.effects = p.effects.filter(ef => {
    if (ef.kind === 'qi_drain') p.qi = Math.max(0, p.qi - ef.value);
    if (ef.kind === 'bleed') {
      const before = p.hp;
      p.hp = Math.max(0, p.hp - ef.value);
      const lost = before - p.hp;
      if (lost > 0) pushLog('hurt', `  → ${p.name} bleeds ${lost} hp from ${ef.name || 'a wound'}.`);
      // Track for the death rule — a bleed-out finishing blow counts as a "big hit".
      p.lastHpHit = Math.max(p.lastHpHit || 0, lost);
    }
    ef.turns--;
    return ef.turns > 0;
  });

  if (p.buffs.incomingTurns > 0) {
    p.buffs.incomingTurns--;
    if (p.buffs.incomingTurns === 0) p.buffs.incomingMult = 1;
  }
  if (p.broken > 0) p.broken--;
  // Tick posture-broken state for every alive enemy (multi-enemy aware).
  combat.enemies.forEach(en => { if (en.broken > 0) en.broken--; });

  const regen = 2 + (p.mods.qiRegenBonus || 0);
  p.qi = Math.min(p.qiMax, p.qi + regen);

  combat.turn++;
  pushLog('turn', `— Turn ${combat.turn} —`);

  // Survival tribulation: win when turn count exceeds threshold (kill all enemies, normally one)
  if (combat.tribulation && combat.tribulation.kind === 'survival' && combat.turn > combat.tribulation.turns) {
    combat.enemies.forEach(en => { en.hp = 0; });
  }
}

const app = document.getElementById('app');

function appendPanel(panel, tab) {
  if (tab && tab !== activeTab) return;
  app.appendChild(panel);
}

function renderTabBar() {
  const bar = document.createElement('div');
  bar.className = 'tabs';
  const tabs = [
    { id: 'self',     label: 'Loadout' },
    { id: 'skills',   label: 'Skills' },
    { id: 'armor',    label: 'Armor' },
    { id: 'garden',   label: 'House' },
    { id: 'forge',    label: 'Forge' },
    { id: 'market',   label: 'Market' },
    { id: 'sect',     label: 'Sect' },
    { id: 'journeys', label: 'Journeys' },

  tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab === t.id ? ' active' : '');
    b.textContent = t.label;
    b.onclick = () => { activeTab = t.id; render(); };
    bar.appendChild(b);
  });
  app.appendChild(bar);
}

function render() {
  app.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.innerHTML = 'Ascent to the Stars<span class="sub">步步登天</span>';

  if (pendingAscension)      return renderAscension();
  if (pendingDestiny)        return renderDestiny();
  if (combat)                return renderCombat();
  if (!state)                return renderLanding();
  if (state.childhood && state.childhood.step !== 'complete') return renderChildhood();
  if (!state.confirmed)      return renderCreation();
  return renderCharSheet();
}

      }
      if (beat.items.weapons && beat.items.weapons.length) {
        const names = beat.items.weapons.map(id => WEAPONS[id] ? WEAPONS[id].name : id).join(', ');
        extras.push(`<em>Heirloom:</em> ${names}`);
      }
      if (beat.items.materials && Object.keys(beat.items.materials).length) {
        const list = Object.entries(beat.items.materials).map(([id, n]) => `${n}× ${MATERIALS[id] ? MATERIALS[id].name : id}`).join(', ');
        extras.push(`<em>Provisions:</em> ${list}`);
      }
      if (beat.items.herbs && Object.keys(beat.items.herbs).length) {
        const list = Object.entries(beat.items.herbs).map(([id, n]) => `${n}× ${HERBS[id] ? HERBS[id].name : id}`).join(', ');
        extras.push(`<em>Pouch:</em> ${list}`);
      }
    }
    const fatalBadge = beat.fatal
      ? `<div class="heritage-mods" style="color:#c44;margin-top:0.3rem"><strong>This fate ends here.</strong> No cultivator emerges from this story.</div>`
      : '';
    card.innerHTML = `<div class="school-name">${beat.name}</div>
      <div class="heritage-flavor" style="margin:0.5rem 0">${beat.prose}</div>
      ${extras.map(e => `<div class="heritage-mods" style="font-size:0.78rem;margin-top:0.2rem">${e}</div>`).join('')}
      ${fatalBadge}`;
    card.onclick = () => pickChildhoodBeat(stage, beatId);
    app.appendChild(card);
  });

  const cancel = document.createElement('div');
  cancel.className = 'panel';
  cancel.innerHTML = `<div class="button-row"><button class="ghost" id="abandon-childhood">Abandon</button></div>`;
  app.appendChild(cancel);
  document.getElementById('abandon-childhood').onclick = () => { state = null; render(); };
}

function pickChildhoodBeat(stage, beatId) {
  const beat = CHILDHOOD_BEATS[stage][beatId];
  if (beat && beat.fatal) {
    // Fatal childhood beat: the run ends before chargen. No save to wipe (no atts-char yet).
    dieRun(beat.deathCause, beat.deathProse, 'A would-be cultivator');
    return;
  }
  applyChildhoodBeatToState(state, stage, beatId);
  const i = CHILDHOOD_STAGE_ORDER.indexOf(stage);
  if (i < CHILDHOOD_STAGE_ORDER.length - 1) {
    const nextStage = CHILDHOOD_STAGE_ORDER[i + 1];
    state.childhood.step = nextStage;
    const rng = makeRng((state.seed ^ Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    state.childhood.offer = rollChildhoodOffer(nextStage, state.childhood.flags, rng);
  } else {
    const finishedChildhood = state.childhood;
    state = newCharacter((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, finishedChildhood);
  }
  render();
}

function renderCreation() {
  const nameP = document.createElement('div');
  nameP.className = 'panel';
  nameP.innerHTML = `<label><strong>Cultivator Name</strong></label>

  app.appendChild(nameP);
  const nameInput = document.getElementById('name');
  nameInput.value = state.name;
